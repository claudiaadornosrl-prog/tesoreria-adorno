    if (error || !data) { toast(error ? 'Error: ' + error.message : 'No se encontró el movimiento', true); return; }
    m = data; _movsCache.push(m);
  }
  const motivo = prompt(
    `Este comprobante ya salió del local, así que no se puede modificar desde acá.\n\n` +
    `Contá cuál es el problema y le llega la alerta al administrador para que lo corrija:\n\n` +
    `#${m.id} · ${fmtFecha(m.fecha)} · ${fmt$(m.importe, m.cuenta_moneda)}\n${(m.descripcion || '').slice(0, 60)}`
  );
  if (motivo === null) return;
  if (!motivo.trim()) { toast('Contá cuál es el problema', true); return; }
  try {
    const { error } = await sb.rpc('tesoreria_reportar_problema', { p_mov_id: id, p_motivo: motivo.trim() });
    if (error) throw error;
    toast('⚠ Reportado — le llegó la alerta al administrador');
    if (currentTab === 'firma') renderPendientesFirma(); else renderMovimientos();
  } catch (e) { toast('Error: ' + e.message, true); }
}

function renderListaMovimientos(movs, tenencias = []) {
  const cont = document.getElementById('mov-lista');
  const tablaTenencias = renderTablaTenencias(tenencias);

  // Banner de "Pendiente de liquidar" — sólo cuando se filtra por UNA cuenta
  // y esa cuenta tiene saldo_banco_pendiente > 0 (típico de MP Locales).
  let bannerPendiente = '';
  if (_movFiltroCuenta) {
    const c = _cuentas.find(x => x.id === Number(_movFiltroCuenta));
    const pend = Number(c?.saldo_banco_pendiente || 0);
    if (pend > 0) {
      bannerPendiente = `
        <div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:4px solid #f59e0b;border-radius:8px;padding:12px 16px;margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
          <span style="font-size:24px;">📅</span>
          <div style="flex:1;min-width:200px;">
            <div style="font-size:12px;color:#92400e;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Pendiente de liquidar</div>
            <div style="font-size:20px;font-weight:700;color:#78350f;">${fmt$(pend, c.moneda)}</div>
            <div style="font-size:11px;color:#92400e;margin-top:2px;">Saldo aún no acreditado, en proceso de release</div>
          </div>
        </div>
      `;
    }
  }

  if (movs.length === 0) {
    cont.innerHTML = tablaTenencias + bannerPendiente + `<div class="empty"><div class="icon">📭</div>Sin movimientos en el rango.</div>`;
    return;
  }
  const totIng = movs.filter(m => +m.importe > 0).reduce((s, m) => s + +m.importe, 0);
  const totEgr = movs.filter(m => +m.importe < 0).reduce((s, m) => s + +m.importe, 0);

  cont.innerHTML = tablaTenencias + bannerPendiente + `
    <div class="card" style="margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;">
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Movimientos:</span> <strong>${movs.length}</strong></div>
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Ingresos:</span> <strong class="importe-ingreso">${fmt$(totIng)}</strong></div>
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Egresos:</span> <strong class="importe-egreso">${fmt$(totEgr)}</strong></div>
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Neto:</span> <strong>${fmt$(totIng+totEgr)}</strong></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:30px;"></th>
          <th>Fecha</th><th>Cuenta</th><th>Local</th><th>Canal</th><th>Descripción</th>
          <th class="right">Débitos</th><th class="right">Créditos</th><th class="right">Saldo</th><th></th>
        </tr></thead>
        <tbody>
          ${movs.slice(_movPag.p * _movPag.n, (_movPag.p + 1) * _movPag.n).map(m => {
            const origenChip = {
              manual: 'origen-manual',
              ventas_auto: 'origen-ventas',
              scraper_galicia: 'origen-scraper', scraper_mp: 'origen-scraper', scraper_ppi: 'origen-scraper',
              transferencia: 'origen-transferencia',
              liquidacion: 'origen-ventas'
            }[m.origen] || 'origen-manual';
            const origenLabel = {
              manual: 'manual', ventas_auto: 'ventas', scraper_galicia: 'Galicia', scraper_mp: 'MP', scraper_ppi: 'PPI',
              transferencia: 'transferencia', liquidacion: 'liquidación'
            }[m.origen] || m.origen;
            let firma = '';
            const esDep = m.respaldo_tipo === 'deposito';
            const rotulo = esDep ? 'Depósito' : 'Factura';
            const destino = esDep ? 'Marisa' : 'administración';
            if (m.firma_rechazada_at && !m.firmado_at) {
              // Administración rechazó el recibo: hay que corregirlo o anularlo.
              // Antes esto no se veía por ningún lado en Tesorería.
              firma = `<span class="chip" style="background:#fee2e2;color:#991b1b;font-size:11px;font-weight:700;cursor:pointer;" title="${escHtml(m.firma_rechazo_motivo || 'Sin motivo detallado')} — corregilo con ✏️ o anulalo con 🗑" onclick="event.stopPropagation();cambiarTab('firma')">↩ Rechazado</span>`;
            } else if (m.respaldo_rechazado_at && !m.factura_path) {
              // (7-sep) administración rechazó el archivo: hay que volver a adjuntar
              firma = `<span class="chip" style="background:#fee2e2;color:#991b1b;font-size:11px;font-weight:600;cursor:pointer;" title="${escHtml(m.respaldo_rechazo_motivo || '')} — tocá ✏️ y adjuntá el archivo correcto" onclick="event.stopPropagation();abrirEditarMov(${m.id})">↩ Volver a subir ${rotulo.toLowerCase()}</span>`;
            } else if (m.factura_path) {
              const etapa = m.archivo_item_id ? ((m.archivo_carpeta || '').split('/').filter(Boolean).pop() || '') : '';
              const tit = m.archivo_item_id ? `${rotulo} en OneDrive: ${m.archivo_carpeta || ''} / ${m.archivo_nombre || ''}` : `${rotulo} adjunto — se sube al OneDrive en la próxima pasada (cada hora)`;
              firma = `<a href="${escHtml(m.factura_path)}" target="_blank" rel="noopener" class="chip" style="background:${esDep ? '#dcfce7;color:#166534' : '#e0e7ff;color:#3730a3'};font-size:11px;font-weight:600;text-decoration:none;" title="${escHtml(tit)}">${esDep ? '🏦' : '📎'} ${rotulo}${m.archivo_item_id ? ' ✓' : ' ⏳'}${etapa && !esDep ? ' · ' + escHtml(etapa) : ''}</a>`;
            } else if (m.respaldo_tipo === 'factura' || esDep) {
              // Purgada del bucket a los 30 días del envío — el respaldo quedó
              // en el mail a administración y el archivero de Anita.
              firma = `<span class="chip" style="background:#f3f4f6;color:var(--muted);font-size:11px;font-weight:600;" title="La imagen se borró del sistema a los 30 días (enviada a administración el ${m.factura_enviada_at ? new Date(m.factura_enviada_at).toLocaleDateString('es-AR') : '—'}). El respaldo está en el archivero.">📎 Archivada</span>`;
            }
            if (m.requiere_firma) {
              if (m.firmado_at) {
                const urlFirmado = pathToSharepointUrl(m.pdf_path);
                firma = urlFirmado
                  ? `<a href="${escHtml(urlFirmado)}" target="_blank" rel="noopener" class="chip" style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;" title="Firmado el ${new Date(m.firmado_at).toLocaleDateString('es-AR')} — click para abrir el PDF guardado">✓ Firmado 🔗</a>`
                  : `<span class="chip" style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:600;" title="Firmado el ${new Date(m.firmado_at).toLocaleDateString('es-AR')}">✓ Firmado</span>`;
              } else {
                // (4-ago) El 📄 vive solo en la columna de acciones (estaba duplicado acá)
                firma = `<span class="chip" style="background:#fef3c7;color:#92400e;font-size:11px;font-weight:600;" title="Pendiente de firma — descargá el PDF con el botón 📄 de la derecha">⏳ Sin firmar</span>`;
              }
            }
            const imp = +m.importe;
            const debito  = imp < 0 ? `<span class="importe-egreso">- ${fmt$(Math.abs(imp), m.cuenta_moneda)}</span>` : '';
            const credito = imp > 0 ? `<span class="importe-ingreso">+ ${fmt$(imp, m.cuenta_moneda)}</span>` : '';
            const saldo = (m.saldo_post !== null && m.saldo_post !== undefined)
              ? fmt$(m.saldo_post, m.cuenta_moneda) : '—';
            // Chips de local y canal con colores claros para Point/QR
            const canalChip = m.canal
              ? `<span class="chip" style="background:${m.canal==='qr'?'#dbeafe':m.canal==='point'?'#fef3c7':'#e5e7eb'};color:#374151;font-size:11px;">${escHtml(m.canal.toUpperCase())}</span>`
              : '';
            const localLabel = m.mov_local
              ? `<span style="font-weight:600;text-transform:capitalize;">${escHtml(m.mov_local)}</span>`
              : '<span style="color:var(--muted);">—</span>';
            // Info adicional del banco (razón social, CUIT, CBU) capturada
            // por el scraper al expandir los detalles. Renderizamos como
            // subtítulo gris debajo de la descripción si existe.
            const ex = m.extra || {};
            const extraItems = [];
            if (ex.razon_social) extraItems.push(escHtml(ex.razon_social));
            if (ex.cuit) extraItems.push(`<span style="font-family:monospace;">CUIT ${escHtml(ex.cuit)}</span>`);
            if (ex.cbu)  extraItems.push(`<span style="font-family:monospace;">CBU ${escHtml(ex.cbu)}</span>`);
            const subDesc = extraItems.length
              ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;">${extraItems.join(' · ')}</div>`
              : '';
            const tieneExtra = extraItems.length > 0;
            // Nota: si hay nota, fila tintada amarillo claro + icono de chincheta lleno
            const tieneNota = !!(m.nota && m.nota.trim());
            const trStyle = tieneNota ? 'background:#fef9c3;' : '';
            const notaIcon = tieneNota
              ? `<button class="btn-icon" onclick="abrirNotaMov(${m.id})" title="${escHtml(m.nota)}" style="background:none;border:none;cursor:pointer;font-size:16px;padding:2px;">📌</button>`
              : `<button class="btn-icon" onclick="abrirNotaMov(${m.id})" title="Agregar nota" style="background:none;border:none;cursor:pointer;font-size:14px;padding:2px;opacity:0.35;">📝</button>`;
            return `<tr style="${trStyle}">
              <td style="text-align:center;">${notaIcon}</td>
              <td>${fmtFecha(m.fecha)}</td>
              <td><span style="font-weight:600;">${escHtml(m.cuenta_nombre||'?')}</span></td>
              <td>${localLabel}</td>
              <td>${canalChip || '<span style="color:var(--muted);">—</span>'}</td>
              <td style="max-width:320px;${tieneExtra ? '' : 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'}" title="${escHtml(m.descripcion||'')}${m.categoria_nombre ? ' · '+escHtml(m.categoria_nombre) : ''}">
                <div style="${tieneExtra ? 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' : ''}">${escHtml(m.descripcion||'')} <span class="chip chip-${origenChip}">${origenLabel}</span> ${firma}</div>
                ${subDesc}
                ${tieneNota ? `<div style="font-size:11px;color:#854d0e;margin-top:3px;font-style:italic;">📌 ${escHtml(m.nota)}</div>` : ''}
              </td>
              <td class="right">${debito}</td>
              <td class="right">${credito}</td>
              <td class="right" style="color:var(--muted);">${saldo}</td>
              ${(() => {
                // Admin: siempre puede editar/borrar.
                // (3-ago) Recibo pendiente de firma: 📄 re-descarga el PDF
                const btnPdf = (m.origen === 'manual' && m.requiere_firma && !m.firmado_at)
                  ? `<button class="btn-icon" onclick="generarPDFEgreso(${m.id})" title="Volver a descargar el PDF del recibo (aún sin firmar)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.7;">📄</button>`
                  : '';
                if (session.verTodo) return `<td style="white-space:nowrap;text-align:center;">${btnPdf}
                  <button class="btn-icon" onclick="abrirEditarMov(${m.id})" title="Editar movimiento (admin)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">✏️</button>
                  <button class="btn-icon" onclick="borrarMov(${m.id})" title="Borrar movimiento (admin)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">🗑</button>
                </td>`;
                // Encargada/cajera: sus movimientos manuales SIN firmar se
                // pueden corregir o borrar; los ya guardados solo se reportan.
                if (m.origen === 'manual' && !m.firmado_at && !m.controlado) return `<td style="white-space:nowrap;text-align:center;">${btnPdf}
                  <button class="btn-icon" onclick="abrirEditarMov(${m.id})" title="${m.pdf_descargado_at ? 'Corregir — ojo: ya lo imprimiste, el papel dejaría de servir' : 'Corregir este movimiento (todavía no volvió firmado)'}" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">✏️</button>
                  <button class="btn-icon" onclick="borrarMov(${m.id})" title="${m.pdf_descargado_at ? 'Anular — ojo: ya lo imprimiste' : 'Anular este movimiento (todavía no volvió firmado)'}" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">🗑</button>
                </td>`;
                if (m.origen === 'manual') return `<td style="white-space:nowrap;text-align:center;">${btnPdf}
                  <button class="btn-icon" onclick="reportarProblemaMov(${m.id})" title="${m.firmado_at ? 'Ya volvió firmado y está en el archivero' : 'Administración ya lo controló'}: avisale a administración y ellos lo rechazan" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.7;">⚠️</button>
                </td>`;
                return '<td></td>';
              })()}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    ${_movPagHtml(movs.length)}
  `;
}

function renderCargar() {
  const cont = document.getElementById('contenido');
  if (session.soloComprobantes) return renderCargarComprobante();
  // "Gerente restringido" = gerente de un local físico (no oficina ni admin)
  // "Gerente restringido" = cualquiera de local (encargada o cajera), no Oficina
  const esGerente = !session.esOficina;
  // Para gerente: pre-seleccionar la caja DE SU LOCAL (no la primera del array).
  // Bug histórico: sin el filtro c.local === session.localGerencia, agarraba
  // "Caja Alcorta" para TODOS los gerentes por orden alfabético, y la policy
  // tm_gerente_egreso rechazaba el INSERT porque el local no coincidía.
  const cajaGerente = esGerente
    ? (_cuentas.find(c => c.tipo === 'caja' && c.local === session.localGerencia)
       || _cuentas.find(c => c.tipo === 'caja'))  // cajera: su única caja visible
    // (11-ago, pedido Marisa) Oficina: preseleccionar Caja Oficina — antes
    // quedaba la primera del array (Caja Alcorta) y cargaban ahí por error.
    : (_cuentas.find(c => c.tipo === 'caja' && c.local === 'oficina') || null);
  const cuentasOpt = _cuentas.map(c => {
    const sel = cajaGerente && c.id === cajaGerente.id ? 'selected' : '';
    return `<option value="${c.id}" ${sel}>${escHtml(c.nombre)} (${c.moneda})</option>`;
  }).join('');

  cont.innerHTML = `
    <div class="card" style="max-width:680px;margin:0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 class="card-title" style="margin:0;">➕ Cargar movimiento</h3>
      </div>
      <div class="form-row" style="margin-bottom:10px;">
        <label>Tipo</label>
        <div style="display:flex;gap:8px;">
          <button onclick="setTipoCarga('ingreso')" id="ti-ingreso" class="btn-secondary" style="flex:1;">⬆ Ingreso</button>
          <button onclick="setTipoCarga('egreso')" id="ti-egreso" class="btn-secondary" style="flex:1;">⬇ Egreso</button>
          ${esGerente ? '' : '<button onclick="setTipoCarga(\'transferencia\')" id="ti-trans" class="btn-secondary" style="flex:1;">🔄 Transferencia</button>'}
        </div>
      </div>
      <div id="form-fields">
        <div class="form-grid compacta">
          <div class="form-row"><label>Fecha</label><input type="date" id="f-fecha" value="${hoyISO()}"></div>
          <div class="form-row"><label>Importe</label><input type="text" inputmode="decimal" id="f-importe" placeholder="0" onfocus="wireImporte(this)"></div>
          <div class="form-row"><label>${esGerente ? 'Caja' : 'Cuenta (de donde sale/entra)'}</label>
            <select id="f-cuenta" ${esGerente ? 'disabled style="background:#f9fafb;"' : ''} onchange="if (_tipoCarga === 'egreso' && (_respaldoCarga === 'recibo' || _respaldoCarga === 'ninguno')) setRespaldo(_defaultRespaldo())">${esGerente ? '' : '<option value="">— Elegir —</option>'}${cuentasOpt}</select>
          </div>
          <div class="form-row"><label>Categoría</label>
            <select id="f-categoria" onchange="_eventualCategoriaCambio()"><option value="">— Elegir —</option></select>
          </div>
          <div class="form-row full" id="row-eventual" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;">
            <label style="color:#991b1b;">📅 Días que cubre este pago <span style="color:#dc2626">*</span></label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
              <div><div style="font-size:11px;color:var(--muted);">Desde</div><input type="date" id="f-ev-desde" oninput="_eventualRecalc(true)"></div>
              <div><div style="font-size:11px;color:var(--muted);">Hasta (inclusive)</div><input type="date" id="f-ev-hasta" oninput="_eventualRecalc(true)"></div>
              <div><div style="font-size:11px;color:var(--muted);">Días trabajados</div><input type="number" id="f-ev-dias" min="1" step="1" style="width:90px;" oninput="_eventualRecalc(false)"></div>
            </div>
            <div id="f-ev-aviso" style="font-size:11px;color:#991b1b;margin-top:6px;"></div>
          </div>
          <div class="form-row" id="row-cuenta-destino" style="display:none;"><label>Cuenta destino</label>
            <select id="f-cuenta-destino"><option value="">— Elegir —</option>${cuentasOpt}</select>
          </div>
          <div class="form-row full"><label>Descripción / observación <span style="color:#dc2626">*</span></label>
            <textarea id="f-descripcion" required placeholder="Obligatoria: qué es este movimiento (proveedor, comprobante, a quién se le pagó…)"></textarea>
          </div>
          <div class="form-row full" id="row-respaldo" style="display:none;">
            <label>Respaldo del egreso</label>
            <div style="display:flex;gap:8px;">
              <button type="button" id="resp-recibo" class="btn-secondary" style="flex:1;" onclick="setRespaldo('recibo')">🧾 Recibo firmado</button>
              <button type="button" id="resp-factura" class="btn-secondary" style="flex:1;" onclick="setRespaldo('factura')">🧺 Factura / ticket</button>
              <button type="button" id="resp-deposito" class="btn-secondary" style="flex:1;" onclick="setRespaldo('deposito')">🏦 Depósito bancario</button>
              ${session.esOficina ? `<button type="button" id="resp-ninguno" class="btn-secondary" style="flex:1;" onclick="setRespaldo('ninguno')" title="Egreso bancario / sin comprobante a firmar">∅ Sin respaldo</button>` : ''}
            </div>
          </div>
          <div class="form-row full" id="row-factura" style="display:none;">
            <label id="lbl-adjunto">Foto o PDF de la factura</label>
            <input type="file" id="f-factura" accept="image/*,application/pdf" capture="environment"
                   style="width:100%;padding:10px;border:2px dashed var(--border);border-radius:8px;background:#f9fafb;">
            <div style="font-size:11px;color:var(--muted);margin-top:4px;">
              <span id="aviso-adjunto">📁 La factura queda archivada sola en el OneDrive, en CONTABILIZAR › 1 - SIN CONTABILIZAR, para que administración la contabilice.</span>
            </div>
          </div>
          ${esGerente ? `
            <div class="form-row full" style="background:#fef3c7;padding:10px 12px;border-radius:6px;font-size:12px;color:#92400e;">
              📝 Los egresos que cargues quedan pendientes hasta que firmes el PDF y lo envíes por mail.
            </div>
          ` : ''}
        </div>
        <div class="form-actions">
          <button class="btn-secondary" onclick="cambiarTab('dashboard')">Cancelar</button>
          <button class="btn-primary" style="width:auto;padding:9px 24px;" id="btn-guardar" onclick="guardarMovimiento()">💾 Guardar</button>
        </div>
      </div>
    </div>
  `;
  // Por default, tipo = egreso (es lo más común que carga la encargada)
  setTipoCarga(esGerente ? 'egreso' : 'ingreso');
}

// (9-sep, JP) Formulario acotado para vendedoras y usuarios genéricos de local:
// egreso de la caja de SU local con foto de factura/ticket o depósito. Sin
// recibo firmado (eso queda para cajeras/encargadas), sin ingresos ni transfer.
async function renderCargarComprobante() {
  const cont = document.getElementById('contenido');
  let caja = session.miCaja || _cuentas.find(c => c.tipo === 'caja' && c.local === session.localGerencia);
  if (!caja) {
    const { data } = await sb.rpc('tesoreria_mi_caja');
    caja = Array.isArray(data) ? data[0] : data;
    if (caja) session.miCaja = caja;
  }
  if (!caja) { cont.innerHTML = '<div class="empty">No encuentro la caja de tu local. Avisale a JP.</div>'; return; }
  cont.innerHTML = `
    <div class="card" style="max-width:680px;margin:0 auto;">
      <h3 class="card-title" style="margin:0 0 6px;">🧺 Subir comprobante · ${escHtml(caja.nombre)}</h3>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Pagaste algo con plata de la caja: cargá el importe y sacale foto a la factura/ticket, o al comprobante si fue un depósito bancario. Se descuenta de la caja y va a administración.</div>
      <div id="form-fields">

let _tipoCarga = 'ingreso';
let _respaldoCarga = 'recibo';

// (9-sep) Default del respaldo según la cuenta: en una CAJA (local u oficina)

// el grupo Oficina carga sin respaldo. Las encargadas nunca ven "Sin respaldo".
function _defaultRespaldo() {
  if (!session.esOficina) return 'recibo';
  const cid = parseInt(document.getElementById('f-cuenta')?.value);
  const c = _cuentas.find(x => x.id === cid);

}
function setRespaldo(r) {
  // 4 respaldos posibles: recibo firmado (circuito de siempre, PDF con QR),
  // factura/ticket y depósito (van al OneDrive), y "ninguno" (solo Oficina).
  if (r === 'ninguno' && !session.esOficina) r = 'recibo';

    const b = document.getElementById(id);

  if (lbl) lbl.textContent = r === 'deposito' ? 'Foto o PDF del comprobante de depósito' : 'Foto o PDF de la factura';

}
function setTipoCarga(tipo) {

// ── (28-sep, JP) Sueldo de personal eventual (Nora) ────────────────────
// La categoría "Pago Nora" (tesoreria_categorias.rrhh_eventual_id) manda el
// pago a la liquidación de RRHH: al MES de los días que cubre y al LOCAL de
// la caja. Por eso acá se piden los días, no la fecha de pago.
function _catEventual(catId) {
  const c = _categorias.find(x => x.id === Number(catId));
  return (c && c.rrhh_eventual_id) ? c : null;
}
function _eventualCategoriaCambio() {
  const row = document.getElementById('row-eventual'); if (!row) return;
  const ev = _catEventual(document.getElementById('f-categoria')?.value);
  row.style.display = (ev && _tipoCarga === 'egreso') ? '' : 'none';
  if (!ev) return;
  // Lleva recibo firmado (se le paga en mano): no factura ni depósito
  if (_respaldoCarga !== 'recibo') setRespaldo('recibo');
  const imp = document.getElementById('f-importe');
  if (imp && !imp._evWired) { imp._evWired = true; imp.addEventListener('input', () => _eventualRecalc(false)); }
  const f = document.getElementById('f-fecha')?.value || hoyISO();
  const d = document.getElementById('f-ev-desde'), h = document.getElementById('f-ev-hasta');
  if (!d.value) d.value = f;
  if (!h.value) h.value = d.value;
  _eventualRecalc(true);
}
function _eventualSpan(d, h) {
  if (!d || !h) return 0;
  return Math.round((new Date(h + 'T12:00:00') - new Date(d + 'T12:00:00')) / 86400000) + 1;
}
function _eventualRecalc(resetDias) {
  const d = document.getElementById('f-ev-desde')?.value, h = document.getElementById('f-ev-hasta')?.value;
  const inDias = document.getElementById('f-ev-dias'), av = document.getElementById('f-ev-aviso');
  const span = _eventualSpan(d, h);
  if (resetDias && span > 0) inDias.value = span;
  if (inDias && span > 0) inDias.max = span;
  const dias = Number(inDias?.value || 0);
  const imp = Math.abs(nmParse(document.getElementById('f-importe')?.value || '0')) || 0;
  let txt = '';
  if (span <= 0) txt = '⚠ La fecha "hasta" no puede ser anterior a "desde".';
  else if (span > 31) txt = '⚠ Un pago cubre como máximo un mes.';
  else if (dias < 1 || dias > span) txt = `⚠ Los días trabajados tienen que estar entre 1 y ${span}.`;
  else {
    const mesD = d.slice(0, 7), mesH = h.slice(0, 7);
    txt = `${dias} día${dias === 1 ? '' : 's'}${imp ? ' · $' + Math.round(imp / dias).toLocaleString('es-AR') + ' por día' : ''}. `
        + (mesD === mesH ? 'Va a la liquidación de ese mes.' : 'Cruza de mes: se reparte entre los dos meses según los días de cada uno.');
  }
  if (av) av.textContent = txt;
}
function _eventualLeer() {
  const d = document.getElementById('f-ev-desde')?.value, h = document.getElementById('f-ev-hasta')?.value;
  const dias = Number(document.getElementById('f-ev-dias')?.value || 0);
  const span = _eventualSpan(d, h);
  if (!d || !h) throw new Error('Cargá los días que cubre el pago (desde y hasta)');
  if (span <= 0) throw new Error('La fecha "hasta" es anterior a "desde"');
  if (span > 31) throw new Error('Un pago cubre como máximo un mes: partilo en dos');
  if (!(dias >= 1 && dias <= span)) throw new Error(`Los días trabajados tienen que estar entre 1 y ${span}`);
  return { desde: d, hasta: h, dias, cargado_por: session.email || '', cargado_at: new Date().toISOString() };
}

// Parser de la tabla pegada de Galicia
function parsearTablaPegada(texto) {
  const lineas = texto.split('\n').map(l => l.trim()).filter(l => l);
  const movs = [];
  const reFecha = /^(\d{1,2}\/\d{1,2}\/\d{4})/;
  const reCuit = /^\d{11}$/;
  const reCbu = /^\d{20,22}$/;
  // Detectar importe (con signo y formato AR: "- $1.234,56" o "+ $1.234,56" o "$1.234,56")
  const reMoney = /([+\-])?\s*\$\s*([\d.]+,\d{2})/g;

  let i = 0;
  while (i < lineas.length) {
    const m = lineas[i].match(reFecha);
    if (!m) { i++; continue; }

    // Encontrar todos los montos en esta línea — el primero suele ser débito/crédito, el segundo el saldo
    const linea = lineas[i];
    const montos = [];
    let mm;
    const reM = /([+\-])?\s*\$\s*([\d.]+,\d{2})/g;
    while ((mm = reM.exec(linea)) !== null) {
      const signo = mm[1] === '-' ? -1 : 1;
      const valor = parseFloat(mm[2].replace(/\./g, '').replace(',', '.'));
      montos.push(signo * valor);
    }

    const fechaStr = m[1];
    const [d, mes, a] = fechaStr.split('/');
    const fecha = `${a}-${mes.padStart(2,'0')}-${d.padStart(2,'0')}`;

    // Descripción: quitar fecha y montos
    let desc = linea.replace(reFecha, '').replace(/[+\-]?\s*\$\s*[\d.]+,\d{2}/g, '').trim();
    desc = desc.replace(/\s+/g, ' ');

    const importe = montos.length > 0 ? montos[0] : 0;
    const saldo = montos.length > 1 ? Math.abs(montos[1]) : null;

    // Mirar líneas siguientes para detalle (hasta encontrar otra fecha)
    let razonSocial = null, cuit = null, cbu = null;
    let j = i + 1;
    while (j < lineas.length && !reFecha.test(lineas[j])) {
      const sub = lineas[j];
      if (reCuit.test(sub)) cuit = sub;
      else if (reCbu.test(sub)) cbu = sub;
      else if (sub.length > 3 && !sub.startsWith('$') && !sub.match(/^\d/)) {
        if (!razonSocial) razonSocial = sub;
      }
      j++;
    }

    movs.push({
      fecha, fechaStr,
      descripcion: desc.substring(0, 200),
      importe,
      saldo,
      razonSocial,
      cuit,
      cbu,
    });
    i = j;
  }
  return movs;
}

async function confirmarImportarPaste() {
  const movs = window._pasteMovs;
  const cuentaId = window._pasteCuentaId;
  if (!movs?.length || !cuentaId) { toast('Nada para importar', true); return; }

  // Helper para hash. IMPORTANTE: mismo formato que scraper_galicia.py
  // — NO incluye saldo, porque Galicia recalcula el saldo de cada mov
  // cuando un cheque pendiente se acredita y reordena las filas. Si
  // incluyéramos saldo, el mismo evento se duplicaría.
  async function hashMov(fecha, desc, importe, saldo) {
    const raw = `${fecha}|${desc}|${importe.toFixed(2)}|`;
    const buf = new TextEncoder().encode(raw);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0,32);
  }

  const rows = [];
  for (const m of movs) {
    const extra = { metodo: 'paste_manual' };
    if (m.razonSocial) extra.razon_social = m.razonSocial;
    if (m.cuit) extra.cuit = m.cuit;
    if (m.cbu) extra.cbu = m.cbu;
    const hash = await hashMov(m.fecha, m.descripcion, m.importe, m.saldo);
    rows.push({
      cuenta_id: cuentaId,
      fecha: m.fecha,
      importe: m.importe,
      descripcion: m.descripcion,
      origen: 'scraper_galicia',
      controlado: false,
      hash_externo: hash,
      saldo_post: m.saldo,
      extra,
      cargado_por: session.email || 'paste_manual',
    });
  }

  // Upsert con ignore-duplicates por hash
  const { error } = await sb.from('tesoreria_movimientos').upsert(rows, {
    onConflict: 'cuenta_id,hash_externo',
    ignoreDuplicates: true,
  });
  if (error) { toast('Error: ' + error.message, true); return; }

  toast(`✓ ${rows.length} movimientos importados`);
  document.getElementById('modal-paste').remove();
  cargar();
}

async function guardarMovimiento() {
  const btn = document.getElementById('btn-guardar');
  const fecha = document.getElementById('f-fecha').value;
  const importeAbs = Math.abs(nmParse(document.getElementById('f-importe').value));
  const cuentaId = parseInt(document.getElementById('f-cuenta').value);
  const categoriaId = parseInt(document.getElementById('f-categoria').value) || null;
  const desc = document.getElementById('f-descripcion').value.trim() || null;
  if (!fecha || !importeAbs || !cuentaId) { toast('Completá fecha, importe y cuenta', true); return; }
  // (7-sep, JP) la observación es obligatoria como el resto de los campos
  if (_tipoCarga !== 'transferencia' && (!desc || desc.length < 3)) {
    toast('Completá la descripción / observación del movimiento', true);
    document.getElementById('f-descripcion').focus(); return;
  }

  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    if (_tipoCarga === 'transferencia') {
      const cuentaDestino = parseInt(document.getElementById('f-cuenta-destino').value);
      if (!cuentaDestino) throw new Error('Falta cuenta destino');
      if (cuentaDestino === cuentaId) throw new Error('Origen y destino tienen que ser distintos');
      // Insertamos los 2 movimientos, después los linkeamos
      const meta = { fecha, categoria_id: categoriaId, descripcion: desc, origen: 'transferencia', cargado_por: session.email };
      const { data: ins1, error: e1 } = await sb.from('tesoreria_movimientos')
        .insert({ ...meta, cuenta_id: cuentaId, importe: -importeAbs })
        .select().single();
      if (e1) throw e1;
      const { data: ins2, error: e2 } = await sb.from('tesoreria_movimientos')
        .insert({ ...meta, cuenta_id: cuentaDestino, importe: importeAbs, transferencia_id: ins1.id })
        .select().single();
      if (e2) throw e2;
      await sb.from('tesoreria_movimientos').update({ transferencia_id: ins2.id }).eq('id', ins1.id);
    } else {
      const signo = _tipoCarga === 'ingreso' ? 1 : -1;
      const data = {
        fecha, cuenta_id: cuentaId, categoria_id: categoriaId,
        importe: signo * importeAbs,
        descripcion: desc, origen: 'manual',
        cargado_por: session.email,
      };
      // (28-sep) Pago a personal eventual: los días que cubre van a la liquidación
      if (_tipoCarga === 'egreso' && _catEventual(categoriaId)) {
        if (_respaldoCarga !== 'recibo') throw new Error('El pago a ' + _catEventual(categoriaId).nombre.replace(/^Pago /,'') + ' lleva recibo firmado');
        data.extra = { eventual: _eventualLeer() };
      }
      // Respaldo por FACTURA adjunta (jul 2026): sube la foto/PDF al bucket,
      // no requiere firma, y el VPS se la manda por mail a administración
      // (claudiaadorno@claudiaadorno.com) para el circuito contable.
      if (_tipoCarga === 'egreso' && (_respaldoCarga === 'factura' || _respaldoCarga === 'deposito')) {
        const fInput = document.getElementById('f-factura');
        const file = fInput?.files?.[0];
        if (!file) throw new Error(_respaldoCarga === 'deposito'
              ? 'Adjuntá la foto o el PDF del comprobante de depósito'
              : 'Adjuntá la foto o el PDF de la factura');
        if (file.size > 15 * 1024 * 1024) throw new Error('El archivo es muy grande (máx 15 MB)');
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${cuentaId}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await sb.storage.from('tesoreria-facturas')
          .upload(path, file, { contentType: file.type || 'image/jpeg' });
        if (upErr) throw new Error('No pude subir la factura: ' + upErr.message);
        const { data: pub } = sb.storage.from('tesoreria-facturas').getPublicUrl(path);
        data.respaldo_tipo = _respaldoCarga;   // 'factura' | 'deposito'
        data.factura_path = pub.publicUrl;
      } else if (_tipoCarga === 'egreso' && _respaldoCarga === 'recibo') {
        // Egreso con recibo firmado: circuito de firma de siempre (PDF con QR).
        // (9-sep) Vale también para admin/Oficina cuando eligen "Recibo firmado"
        // — antes solo aplicaba a encargadas y el botón no hacía nada para JP.
        data.requiere_firma = true;
        data.respaldo_tipo = 'recibo';
      }
      const { data: insMov, error } = await sb.from('tesoreria_movimientos').insert(data).select().single();
      if (error) throw error;
      if (data.respaldo_tipo === 'factura' || data.respaldo_tipo === 'deposito') {
        toast(data.respaldo_tipo === 'deposito'
              ? '✓ Cargado · el comprobante se archiva en el OneDrive'
              : '✓ Cargado · la factura se archiva en SIN CONTABILIZAR');
        if (session.soloComprobantes) { renderCargar(); return; }
        cambiarTab('dashboard');
        cargar();
        return;
      }
      // Si requiere firma: el saldo YA fue descontado. Mostramos modal
      // con botón para descargar el PDF (debe firmar y mandar por mail).
      if (data.requiere_firma && insMov) {
        toast('✓ Movimiento cargado · descargá el recibo');
        abrirModalPostCarga(insMov.id);
        return;
      }
    }
    toast('✓ Movimiento cargado');
    cambiarTab('dashboard');
    cargar();
  } catch (e) {
    toast('Error: ' + e.message, true);
    btn.disabled = false; btn.textContent = '💾 Guardar';
  }
}

async function ejecutarScraperAhora(id, nombre) {
  // Marca el scraper como "vencido" (proximo_run en el pasado). El servicio
  // main.py corriendo en loop en la PC lo detecta en el próximo polling
  // (cada POLL_SECONDS, default 5 min) y lo ejecuta.
  try {
    const { data: ok, error } = await sb.rpc('tesoreria_bot_ejecutar', { p_id: id });
    if (error) throw error;
    if (!ok) throw new Error('No se pudo encolar (¿scraper inactivo?)');
    toast(`✓ ${nombre} encolado — la PC lo corre en el próximo ciclo (≤5 min). Requiere "py main.py" corriendo en la PC.`);
    renderScrapers();
  } catch (e) { toast('Error: ' + e.message, true); }
}

// Push notifications (reuso patrón de Ventas / RRHH)
// ═══════════════════════════════════════════════════════════════════════
const VAPID_PUBLIC_KEY = 'BIYqIamefFB0ZmTt31sm4ubbKcq0hGHRoG4StSLO26HPpjYL58n6uvHaQmTYTqtW1Tr4qp_bEs6TrvMxlROmqp8';

  // (22-oct-2026, migración a São Paulo) si la suscripción del navegador es de la clave VAPID vieja, se descarta para re-suscribir con la nueva
  async function _getSubFresca(reg) {
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return null;
    try {
      const k = sub.options && sub.options.applicationServerKey;
      if (k) {
        const s = btoa(String.fromCharCode(...new Uint8Array(k))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        if (s !== VAPID_PUBLIC_KEY) { await sub.unsubscribe().catch(() => {}); return null; }
      }
    } catch (_) {}
    return sub;
  }

const pushManager = (() => {
  const soportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  function urlB64ToUint8(b64) {
    const pad = '='.repeat((4 - (b64.length % 4)) % 4);
    const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(s);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  async function estado() {
    if (!soportado()) return 'no-soportado';
    if (Notification.permission === 'denied') return 'bloqueado';
    const reg = await navigator.serviceWorker.ready;
    const sub = await _getSubFresca(reg);
    return sub ? 'activo' : 'inactivo';
  }
  // (4-ago) Gestión propia: suscripción en la tabla UNIFICADA
  // rrhh_push_subscriptions con app='tesoreria' (misma que leen las Edge Functions).
  async function _identidadPush() {
    try {
      const { data } = await sb.rpc('rrhh_current_user');
      const u = Array.isArray(data) ? data[0] : data;
      return { empleado_id: u?.empleado_id || null, local_gerencia: u?.local_gerencia || null };
    } catch (_) { return { empleado_id: null, local_gerencia: null }; }
  }
  async function activar() {
    if (!soportado()) throw new Error('Este navegador no soporta notificaciones.');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('Permiso denegado.');
    const reg = await navigator.serviceWorker.ready;
    let sub = await _getSubFresca(reg);
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY),
      });
    }
    const raw = sub.toJSON();
    const cu = await _identidadPush();
    const payload = {
      endpoint: raw.endpoint,
      p256dh: raw.keys.p256dh,
      auth: raw.keys.auth,
      app: 'tesoreria',
      activa: true,
      user_agent: (navigator.userAgent || '').slice(0, 200),
      last_seen_at: new Date().toISOString(),
    };
    if (cu.empleado_id) payload.empleado_id = cu.empleado_id;
    else if (cu.local_gerencia) payload.local_generico = cu.local_gerencia;
    else throw new Error('No pude identificar tu usuario para las notificaciones.');
    const { error } = await sb.from('rrhh_push_subscriptions').upsert(payload, { onConflict: 'endpoint,app' });
    if (error) throw error;
    return 'activo';
  }
  async function desactivar() {
    const reg = await navigator.serviceWorker.ready;
    const sub = await _getSubFresca(reg);
    if (sub) {
      try { await sb.from('rrhh_push_subscriptions').delete().eq('endpoint', sub.endpoint); } catch (_) {}
      await sub.unsubscribe();
    }
    return 'inactivo';
  }
  return { soportado, estado, activar, desactivar };
})();

function fmtMoneda(n, moneda) {
  const s = moneda === 'USD' ? 'US$' : '$';
  return s + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// (19-ago) Refresco tras una acción (editar/pagar/cancelar/confirmar):
// re-renderiza la lista pero deja el scroll exactamente donde estaba.
async function refrescarPendientesEnLugar() {
  const y = window.scrollY;
  await renderPagosPendientes();
  window.scrollTo(0, y);
}

// (28-sep, JP) El buscador espera a que termines de escribir (0,6 s o Enter), filtra
// lo que ya está cargado SIN volver a consultar la base y devuelve el cursor al campo.
// Antes re-consultaba y re-dibujaba todo a los 250 ms y el campo perdía el foco.
function _ppBuscar(v, inmediato) {
  _filtroTexto = v;
  clearTimeout(window._ppDebounce);
  const go = async () => {
    await renderPagosPendientes(true);
    const el = document.getElementById('pp-buscador');
    if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch(_){} }
  };
  if (inmediato) go(); else window._ppDebounce = setTimeout(go, 600);
}
async function renderPagosPendientes(soloFiltro) {
  const cont = document.getElementById('contenido');
  if (!soloFiltro) {
  cont.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  const filtro = _filtroEstado === 'pagados' ? ['pagado']
    : _filtroEstado === 'todos' ? ['pendiente','por_confirmar','parcial','pagado','cancelado']
    : ['pendiente','por_confirmar','parcial'];
  let q = sb.from('tesoreria_pagos_pendientes_view').select('*').in('estado', filtro);
  if (_filtroCategoria) q = q.eq('categoria', _filtroCategoria);
  if (_filtroLocal) q = q.eq('local', _filtroLocal);
  if (_filtroDesde) q = q.gte('fecha_vencimiento', _filtroDesde);
  if (_filtroHasta) q = q.lte('fecha_vencimiento', _filtroHasta);
  q = q.order('fecha_vencimiento', { ascending: true });
  const { data, error } = await q;
  if (error) { cont.innerHTML = `<div class="empty">Error: ${escHtml(error.message)}</div>`; return; }
  _pagosPendientesCache = data || [];
  }
  // (26-oct) Pagos en partes: las partes (parte_de) no se listan sueltas, viven en la ficha del padre
  let cacheFiltrado = _pagosPendientesCache.filter(p => !p.parte_de);
  if (_filtroTexto && _filtroTexto.trim().length >= 2) {
    const t = _filtroTexto.trim().toLowerCase();
    const tnum = t.replace(/[.,$\s]/g, '');
    cacheFiltrado = cacheFiltrado.filter(p => {
      const importeStr = String(p.importe || '').replace(/[.,]/g,'');
      return (p.concepto && p.concepto.toLowerCase().includes(t))
          || (p.destinatario && p.destinatario.toLowerCase().includes(t))
          || (p.notas && p.notas.toLowerCase().includes(t))
          || (p.categoria && p.categoria.toLowerCase().includes(t))
          || (p.medio_pago && p.medio_pago.toLowerCase().includes(t))
          || (p.local && p.local.toLowerCase().includes(t))
          || (importeStr.includes(tnum));
    });
  }
  const pendientes = cacheFiltrado.filter(p => ['pendiente','por_confirmar','parcial'].includes(p.estado));
  const totalPos = pendientes.filter(p => +p.importe > 0).reduce((s,p) => s + _ppMonto(p), 0);
  const totalNeg = pendientes.filter(p => +p.importe < 0).reduce((s,p) => s + +p.importe, 0);
  const grupos = { vencido:[], hoy:[], esta_semana:[], este_mes:[], futuro:[], pagado:[], cancelado:[] };
  if (_ordenPendientes === 'venc_asc') {
    cacheFiltrado.forEach(p => { (grupos[p.estado_urgencia] || grupos.futuro).push(p); });
  } else {
    // (14-ago) Orden personalizado: lista plana ordenada, sin grupos de urgencia
    const ord = [...cacheFiltrado].sort((a, b) => {
      if (_ordenPendientes === 'venc_desc') return b.fecha_vencimiento.localeCompare(a.fecha_vencimiento);
      if (_ordenPendientes === 'importe_desc') return Math.abs(+b.importe) - Math.abs(+a.importe);
      if (_ordenPendientes === 'importe_asc') return Math.abs(+a.importe) - Math.abs(+b.importe);
      return (a.destinatario || a.concepto || '').localeCompare(b.destinatario || b.concepto || '', 'es');
    });
    grupos._orden = ord;
  }

  cont.innerHTML = `<div style="padding:16px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <div style="flex:1;min-width:180px;background:white;border-radius:10px;padding:14px;box-shadow:var(--shadow);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;">A pagar</div>
        <div style="font-size:22px;font-weight:800;color:#dc2626;margin-top:4px;">${fmtMoneda(totalPos, 'ARS')}</div>
      </div>
      <div style="flex:1;min-width:180px;background:white;border-radius:10px;padding:14px;box-shadow:var(--shadow);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;">A cobrar</div>
        <div style="font-size:22px;font-weight:800;color:#16a34a;margin-top:4px;">${fmtMoneda(Math.abs(totalNeg), 'ARS')}</div>
      </div>
      <div style="flex:1;min-width:180px;background:white;border-radius:10px;padding:14px;box-shadow:var(--shadow);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;">Neto</div>
        <div style="font-size:22px;font-weight:800;color:var(--primary-dark);margin-top:4px;">${fmtMoneda(totalPos + totalNeg, 'ARS')}</div>
      </div>
    </div>
    <div class="toolbar compacta" style="margin-bottom:12px;">
      <div style="position:relative;flex:1;min-width:170px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;">🔍</span>
        <input id="pp-buscador" type="search" placeholder="Buscar concepto, proveedor, importe…" value="${escHtml(_filtroTexto||'')}"
               oninput="_ppBuscar(this.value)" onkeydown="if(event.key==='Enter')_ppBuscar(this.value,true)"
               style="width:100%;padding:6px 10px 6px 30px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;box-sizing:border-box;">
        ${_filtroTexto ? `<button onclick="_ppBuscar('',true)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:#f1f5f9;color:#475569;border:none;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;" title="Limpiar">✕</button>` : ''}
      </div>
      <select onchange="_filtroCategoria=this.value;renderPagosPendientes();" title="Categoría">
        <option value="">Categorías</option>
        ${Object.entries(CAT_LABELS).map(([k,v]) => `<option value="${k}" ${_filtroCategoria===k?'selected':''}>${v}</option>`).join('')}
      </select>
      <select onchange="_filtroLocal=this.value;renderPagosPendientes();" title="Local">
        <option value="">Locales</option>
        ${[...new Set(['general','alcorta','unicenter','oficina', ..._pagosPendientesCache.map(p => p.local).filter(Boolean)])].map(l =>
          `<option value="${escHtml(l)}" ${_filtroLocal===l?'selected':''}>${escHtml(l.charAt(0).toUpperCase()+l.slice(1))}</option>`).join('')}
      </select>
      <select onchange="_filtroEstado=this.value;renderPagosPendientes();" title="Estado">
        <option value="pendientes" ${_filtroEstado==='pendientes'?'selected':''}>Pendientes</option>
        <option value="pagados" ${_filtroEstado==='pagados'?'selected':''}>Solo pagados</option>
        <option value="todos" ${_filtroEstado==='todos'?'selected':''}>Mostrar todos</option>
      </select>
      <span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);" title="Filtra por fecha de vencimiento">
        <input type="date" value="${_filtroDesde}" title="Vence desde" onchange="_ppFecha('desde', this.value)">
        <input type="date" value="${_filtroHasta}" title="Vence hasta" onchange="_ppFecha('hasta', this.value)">
        ${(_filtroDesde || _filtroHasta) ? `<button onclick="_filtroDesde='';_filtroHasta='';renderPagosPendientes();" style="background:#f1f5f9;color:#475569;border:none;border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer;" title="Quitar el rango de fechas">✕</button>` : ''}
      </span>
      <select onchange="_ordenPendientes=this.value;renderPagosPendientes();" title="Ordenar filas">
        <option value="venc_asc" ${_ordenPendientes==='venc_asc'?'selected':''}>↕ Vencimiento ↑</option>
        <option value="venc_desc" ${_ordenPendientes==='venc_desc'?'selected':''}>↕ Vencimiento ↓</option>
        <option value="importe_desc" ${_ordenPendientes==='importe_desc'?'selected':''}>↕ Importe mayor</option>
        <option value="importe_asc" ${_ordenPendientes==='importe_asc'?'selected':''}>↕ Importe menor</option>
        <option value="proveedor" ${_ordenPendientes==='proveedor'?'selected':''}>↕ Proveedor A-Z</option>
      </select>
      <button class="ibtn primary" onclick="abrirFormNuevoPago()" title="Nuevo pago pendiente"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    ${(grupos._orden ? ['_orden'] : ['vencido','hoy','esta_semana','este_mes','futuro','pagado','cancelado']).map(u => {
      const items = grupos[u] || [];
      if (!items.length) return '';
      const cfg = u === '_orden'
        ? { label: '📋 Ordenado', color: '#475569', bg: '#f8fafc' }
        : (URGENCIA_CFG[u] || { label: u.toUpperCase(), color: '#475569', bg: '#f8fafc' });
      const subtotal = items.filter(p => ['pendiente','por_confirmar','parcial'].includes(p.estado)).reduce((s,p) => s + _ppMonto(p), 0);
      return `<div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:${cfg.bg};border-left:4px solid ${cfg.color};border-radius:6px;margin-bottom:6px;">
          <div style="font-weight:700;color:${cfg.color};">${cfg.label} <span style="color:var(--muted);font-weight:500;font-size:13px;">(${items.length})</span></div>
          <div style="font-size:13px;color:${cfg.color};font-weight:600;">${u==='pagado'||u==='cancelado'?'':fmtMoneda(subtotal,'ARS')}</div>
        </div>
        <div style="background:white;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);">
          ${items.map(renderPagoItem).join('')}
        </div>
      </div>`;
    }).join('')}
    ${_pagosPendientesCache.length === 0 ? `<div class="empty">No hay pagos pendientes. <button class="btn-primary" style="width:auto;padding:8px 14px;font-size:13px;margin-top:10px;" onclick="abrirFormNuevoPago()">+ Crear el primero</button></div>` : ''}
  </div>`;
}

// (26-oct) lo que todavía hay que pagar de un pendiente: en los pagos en partes, lo que falta
function _ppMonto(p) { return p.estado === 'parcial' ? +(p.importe_falta || 0) : +p.importe; }
function _ppPct(p) { return +p.importe > 0 ? Math.min(100, Math.round(100 * (+p.importe_pagado || 0) / +p.importe)) : 0; }
function renderPagoItem(p) {
  const esNegativo = +p.importe < 0;
  const esParcial = p.estado === 'parcial';
  const colorImp = p.estado === 'pagado' ? '#16a34a' : (esNegativo ? '#16a34a' : '#dc2626');
  const labelImp = esNegativo ? '+' : '−';
  const fechaCorta = new Date((esParcial && p.proximo_vto ? p.proximo_vto : p.fecha_vencimiento) + 'T00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const cat = CAT_LABELS[p.categoria] || p.categoria;
  const medio = MEDIO_LABELS[p.medio_pago] || p.medio_pago;
  const localBadge = p.local && p.local !== 'general'
    ? `<span style="background:#ede9fe;color:#5b21b6;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;">${p.local.toUpperCase()}</span>` : '';
  const recurrenteBadge = p.recurrente
    ? `<span style="background:#dcfce7;color:#166534;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;" title="Recurrente">🔁 ${p.frecuencia}${p.recurrente_veces ? ' × ' + p.recurrente_veces : ''}</span>` : '';
  const estadoBadge = esParcial
    ? `<span style="background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;" title="Pago en partes: ${p.partes_pagadas} de ${p.partes_n} pagadas">🧩 EN PARTES · ${_ppPct(p)}%</span>`
    : p.estado === 'pagado'
    ? `<span style="background:#dcfce7;color:#166534;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;">✓ PAGADO${p.partes_n > 0 ? ' · ' + p.partes_n + ' partes' : ''}</span>`
    : (p.estado === 'cancelado'
      ? `<span style="background:#fee2e2;color:#991b1b;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;">✗ CANCELADO</span>`
      : (p.estado === 'por_confirmar'
        ? `<span style="background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;" title="El sistema detectó un egreso bancario del mismo importe">🤔 ¿PAGADO?</span>` : ''));
  const acciones = esParcial
    ? `<button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#b45309;border-color:#fcd34d;font-weight:700;" title="Registrar el próximo pago de esta serie" onclick="event.stopPropagation();abrirEditarPago(${p.id})">➕ Pago</button>
       <button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#dc2626;border-color:#fca5a5;" onclick="event.stopPropagation();cancelarPago(${p.id})">✗</button>`
    : p.estado === 'por_confirmar'
    ? `<button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#16a34a;border-color:#86efac;font-weight:700;" onclick="event.stopPropagation();confirmarMatchPago(${p.id}, ${p.movimiento_id || 'null'})">✓ Sí, pagado</button>
       <button class="btn-secondary" style="font-size:12px;padding:5px 10px;" onclick="event.stopPropagation();rechazarMatchPago(${p.id})">✗ No es</button>`
    : p.estado === 'pendiente'
    ? `<button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#16a34a;border-color:#86efac;" onclick="event.stopPropagation();marcarComoPagado(${p.id})">✓ Pagado</button>
       <button class="btn-secondary" style="font-size:12px;padding:5px 10px;" onclick="event.stopPropagation();abrirEditarPago(${p.id})">✏️</button>
       <button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#dc2626;border-color:#fca5a5;" onclick="event.stopPropagation();cancelarPago(${p.id})">✗</button>`
    : `<button class="btn-secondary" style="font-size:12px;padding:5px 10px;" onclick="event.stopPropagation();abrirEditarPago(${p.id})">Ver</button>`;
  // (13-oct, JP) color por urgencia en la fila: franja izquierda y fecha del color del grupo
  const urg = (p.estado === 'pendiente' || p.estado === 'por_confirmar' || esParcial) ? (URGENCIA_CFG[p.estado_urgencia] || URGENCIA_CFG.futuro) : { color: '#cbd5e1' };
  const barra = esParcial ? `<div style="display:flex;align-items:center;gap:8px;margin-top:4px;"><div class="pp-bar"><div style="width:${_ppPct(p)}%"></div></div><span style="font-size:11px;color:#92400e;white-space:nowrap;">${_ppPct(p)}% pagado · falta ${fmtMoneda(p.importe_falta, p.moneda)}</span></div>` : '';
  return `<div class="pp-fila" style="border-left-color:${urg.color};${p.estado === 'pagado' || p.estado === 'cancelado' ? 'opacity:.7;' : ''}" onclick="abrirEditarPago(${p.id})">
    <div style="font-size:13px;font-weight:700;color:${urg.color};text-align:center;line-height:1.2;">${fechaCorta}</div>
    <div style="min-width:0;">
      <div style="font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(p.concepto)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <span>${cat}</span><span>·</span><span>${medio}</span>${localBadge}${recurrenteBadge}${estadoBadge}
      </div>${barra}
    </div>
    <div style="font-weight:700;font-size:15px;color:${colorImp};text-align:right;font-variant-numeric:tabular-nums;">${labelImp}${fmtMoneda(Math.abs(esParcial ? +p.importe_falta : +p.importe), p.moneda)}${esParcial ? `<div style="font-size:10px;color:var(--muted);font-weight:500;">de ${fmtMoneda(p.importe, p.moneda)}</div>` : ''}</div>
    <div style="display:flex;gap:4px;">${acciones}</div>
  </div>`;
}

// ── Matcheo automático: el trigger de la base detectó un egreso bancario
//    del mismo importe y dejó el pendiente "por_confirmar" ──────────────
async function confirmarMatchPago(id, movimientoId) {
  try {
    const { error } = await sb.rpc('marcar_pago_realizado', { p_id: id, p_movimiento_id: movimientoId, p_pagado_por: session.email || 'admin' });
    if (error) throw error;
    toast('✓ Confirmado como pagado');
    refrescarPendientesEnLugar(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}
async function rechazarMatchPago(id) {
  try {
    const { error } = await sb.from('tesoreria_pagos_pendientes')
      .update({ estado: 'pendiente', movimiento_id: null }).eq('id', id);
    if (error) throw error;
    toast('Vuelve a Pendientes');
    refrescarPendientesEnLugar(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}

async function marcarComoPagado(id) {
  if (!confirm('¿Marcar este pago como realizado?\n\nSi es recurrente, se va a crear automáticamente el del próximo período.')) return;
  try {
    const { data, error } = await sb.rpc('marcar_pago_realizado', { p_id: id, p_pagado_por: session.email || 'admin' });
    if (error) throw error;
    toast(data?.siguiente_creado_id ? '✓ Pagado · siguiente recurrente creado' : '✓ Pagado');
    refrescarPendientesEnLugar(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}
// (25-sep) "CUOTA 3 DE 6" → 3
function _cuotaNro(c) { const m = /CUOTA\s+(\d+)\s+DE\s+\d+\s*$/i.exec(c || ''); return m ? +m[1] : null; }
async function cancelarPago(id) {
  const p = _pagosPendientesCache.find(x => x.id === id) || {};
  if (!confirm(p.estado === 'parcial' ? `¿Cancelar lo que falta de este pago?\n\nYa se pagaron ${fmtMoneda(p.importe_pagado, p.moneda)}; las partes abiertas se cancelan y eso queda registrado.` : '¿Cancelar este pago?')) return;
  let ids = [id];
  // Serie de cuotas: cancelar una NO cancela las demás, salvo que se pida
  if (p.serie_id) {
    const nro = _cuotaNro(p.concepto) || 1;
    const sig = _pagosPendientesCache.filter(x => x.serie_id === p.serie_id && x.id !== id
      && ['pendiente','por_confirmar'].includes(x.estado) && (_cuotaNro(x.concepto) || 0) > nro);
    if (sig.length && confirm(`Es la CUOTA ${nro} de una serie. ¿Cancelar también las ${sig.length} cuota(s) siguiente(s)?\n\nAceptar = cancelar todas · Cancelar = solo esta`))
      ids = ids.concat(sig.map(x => x.id));
  }
  try {
    const { error } = await sb.from('tesoreria_pagos_pendientes').update({ estado: 'cancelado' }).in('id', ids);
    if (error) throw error;
    toast(ids.length > 1 ? `Canceladas ${ids.length}` : 'Cancelado'); refrescarPendientesEnLugar();
  } catch (e) { alert('Error: ' + e.message); }
}
function abrirFormNuevoPago(precarga) { abrirFormPago(null, precarga); }
async function volverAPendiente(id) {
  const p = _pagosPendientesCache.find(x => x.id === id);
  if (!confirm(`¿Volver a PENDIENTE este pago?\n\n${p ? p.concepto : '#' + id}\n\nSe deshace la marca de pagado y se desengancha del movimiento del banco. Queda registrado quién lo deshizo.`)) return;
  const { error } = await sb.rpc('tesoreria_volver_a_pendiente', { p_id: id });
  if (error) { alert('No se pudo: ' + error.message); return; }
  document.getElementById('modal-pago')?.remove();
  renderPagosPendientes();
}

function abrirEditarPago(id) {
  const p = _pagosPendientesCache.find(x => x.id === id);
  if (p) abrirFormPago(p, null);
}

// (27-oct) mañana en hora argentina (antes salía de toISOString → UTC, de noche daba pasado mañana)
function _ppMananaAR() {
  const d = new Date(hoyISO() + 'T12:00:00'); d.setDate(d.getDate() + 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function _ppRecurrenteCambio(on) {
  const fw = document.getElementById('f-frecuencia-wrap');
  if (fw) fw.style.display = on ? 'grid' : 'none';
  const ep = document.getElementById('f-en-partes');
  if (on && ep && ep.checked) { ep.checked = false; _partesNuevoToggle(false); }
}
// (27-oct, JP) Formulario de pago · diseño B: importe y vencimiento arriba en la franja ámbar,
// el resto en dos columnas, y Recurrente / En partes / Notas / Local como botones que se despliegan.
// Los ids de los campos son los de siempre: guardarPago, renderOrigenPago y los elegir* los leen por id.
function abrirFormPago(existente, precarga) {
  document.getElementById('modal-pago')?.remove();
  const p = existente || precarga || {};
  const esEdit = !!existente;
  const wrap = document.createElement('div');
  wrap.id = 'modal-pago';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  const fechaDefault = p.fecha_vencimiento || _ppMananaAR();

// Un pendiente con el total y N partes (anticipo, saldo…). Cada parte es un pendiente
// hijo (parte_de): la matchea el banco y la avisa el cron. El padre queda "parcial"
// con la barra de avance hasta que se paga la última parte.
async function _reabrirFicha(id) {
  await renderPagosPendientes();
  const p = _pagosPendientesCache.find(x => x.id === id);
  if (p) abrirFormPago(p, null); else document.getElementById('modal-pago')?.remove();

}
function _parteNombre(h) { const m = /· (pago \d+ de \d+.*)$/.exec(h.concepto || ''); return m ? m[1] : (h.concepto || ''); }
// (27-oct, JP) Partes como línea de tiempo: verde las pagadas, ámbar la próxima, gris punteado las que siguen
function _ppPlata(n) { return '$' + Math.round(+n || 0).toLocaleString('es-AR'); }
function _parteCorto(h, i) {
  const m = /\(([^)]*)\)\s*$/.exec(h.concepto || '');
  const t = m ? m[1] : ('Pago ' + (h.parte_nro || i + 1));
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function _partesTimeline(items) {
  if (!items || !items.length) return '';
  const n = items.length;
  let prox = false;
  const est = items.map(x => {
    if (x.estado === 'pagado') return 'ok';
    if (x.estado === 'cancelado') return 'canc';
    if (x.estado === 'por_confirmar') return 'duda';
    if (!prox) { prox = true; return 'prox'; }
    return 'fut';
  });
  const ultOk = est.lastIndexOf('ok');
  const mitad = 50 / n;
  const verde = n > 1 && ultOk > 0 ? (100 - 2 * mitad) * ultOk / (n - 1) : 0;
  const fd = f => f ? new Date(f + 'T00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) : '—';
  const signo = { ok: '✓', duda: '?', canc: '✕', prox: '', fut: '' };
  return `<div class="pp-tl" style="grid-template-columns:repeat(${n},minmax(0,1fr));">
    ${n > 1 ? `<div class="pp-tl-line" style="left:${mitad}%;right:${mitad}%;"></div><div class="pp-tl-ok" style="left:${mitad}%;width:${verde}%;"></div>` : ''}
    ${items.map((x, i) => `<div class="pp-tl-it ${est[i]}" title="${escHtml(x.titulo || x.nombre)}">
      <div class="pp-tl-dot ${est[i]}">${signo[est[i]]}</div>
      <div class="pp-tl-nom">${escHtml(x.nombre)}</div>
      <div class="pp-tl-det">${fd(x.fecha)} · ${_ppPlata(x.importe)}</div>
    </div>`).join('')}
  </div>`;
}

      }).join('')}
    </table></div>
    <div id="f-parte-reg"></div>
    <div id="f-partes-edit"></div>
    ${abierto ? `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
      <button type="button" class="btn-secondary" style="font-size:12px;padding:5px 10px;" onclick="_partesForm(${p.id})">✏️ Rehacer las partes que faltan${pendientesN ? ' (' + pendientesN + ')' : ''}</button>
    </div>` : ''}
  </div>`;
}
let _partesEdit = [];

}
function _partesFormRender(id, falta, moneda) {

  const suma = _partesEdit.reduce((s, r) => s + (+r.importe || 0), 0);

    ${_partesEdit.map((r, i) => `<div class="pp-parte-fila">

      <input type="text" inputmode="decimal" value="${nmShow(r.importe)}" onfocus="wireImporte(this)" onchange="_partesEdit[${i}].importe=nmParse(this.value)||0;_partesFormRender(${id},${falta},'${moneda}')" style="width:100%;min-width:0;box-sizing:border-box;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;text-align:right;">
      <input type="date" value="${r.fecha||''}" onchange="_partesEdit[${i}].fecha=this.value;${id == null ? `_partesFormRender(null,0,'ARS')` : ''}" style="width:100%;min-width:0;box-sizing:border-box;padding:6px 6px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;">

      <span style="font-size:12px;color:${Math.abs(dif) < 1 ? '#166534' : '#b45309'};">Suma ${fmtMoneda(suma, moneda)}${Math.abs(dif) < 1 ? ' ✓' : ' · ' + (dif > 0 ? 'faltan ' : 'sobran ') + fmtMoneda(Math.abs(dif), moneda)}</span>
