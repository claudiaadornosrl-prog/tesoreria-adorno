// Parser de la tabla pegada de Galicia
function parsearTablaPegada(texto) {
  const lineas = texto.split('\n').map(l => l.trim()).filter(l => l);
  const movs = [];
  const reFecha = /^(\d{1,2}\/\d{1,2}\/\d{4})/;
  const reCuit = /^\d{11}$/;
  const reCbu = /^\d{20,22}$/;
  // Detectar importe (con signo y formato AR: "- $1.234,56" o "+ $1.234,56" o "$1.234,56")
  const reMoney = /([+\-])?\s*\$\s*([\d.]+,\d{2})/g;

  let i = 0;
  while (i < lineas.length) {
    const m = lineas[i].match(reFecha);
    if (!m) { i++; continue; }

    // Encontrar todos los montos en esta línea — el primero suele ser débito/crédito, el segundo el saldo
    const linea = lineas[i];
    const montos = [];
    let mm;
    const reM = /([+\-])?\s*\$\s*([\d.]+,\d{2})/g;
    while ((mm = reM.exec(linea)) !== null) {
      const signo = mm[1] === '-' ? -1 : 1;
      const valor = parseFloat(mm[2].replace(/\./g, '').replace(',', '.'));
      montos.push(signo * valor);
    }

    const fechaStr = m[1];
    const [d, mes, a] = fechaStr.split('/');
    const fecha = `${a}-${mes.padStart(2,'0')}-${d.padStart(2,'0')}`;

    // Descripción: quitar fecha y montos
    let desc = linea.replace(reFecha, '').replace(/[+\-]?\s*\$\s*[\d.]+,\d{2}/g, '').trim();
    desc = desc.replace(/\s+/g, ' ');

    const importe = montos.length > 0 ? montos[0] : 0;
    const saldo = montos.length > 1 ? Math.abs(montos[1]) : null;

    // Mirar líneas siguientes para detalle (hasta encontrar otra fecha)
    let razonSocial = null, cuit = null, cbu = null;
    let j = i + 1;
    while (j < lineas.length && !reFecha.test(lineas[j])) {
      const sub = lineas[j];
      if (reCuit.test(sub)) cuit = sub;
      else if (reCbu.test(sub)) cbu = sub;
      else if (sub.length > 3 && !sub.startsWith('$') && !sub.match(/^\d/)) {
        if (!razonSocial) razonSocial = sub;
      }
      j++;
    }

    movs.push({
      fecha, fechaStr,
      descripcion: desc.substring(0, 200),
      importe,
      saldo,
      razonSocial,
      cuit,
      cbu,
    });
    i = j;
  }
  return movs;
}

async function confirmarImportarPaste() {
  const movs = window._pasteMovs;
  const cuentaId = window._pasteCuentaId;
  if (!movs?.length || !cuentaId) { toast('Nada para importar', true); return; }

  // Helper para hash. IMPORTANTE: mismo formato que scraper_galicia.py
  // — NO incluye saldo, porque Galicia recalcula el saldo de cada mov
  // cuando un cheque pendiente se acredita y reordena las filas. Si
  // incluyéramos saldo, el mismo evento se duplicaría.
  async function hashMov(fecha, desc, importe, saldo) {
    const raw = `${fecha}|${desc}|${importe.toFixed(2)}|`;
    const buf = new TextEncoder().encode(raw);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0,32);
  }

  const rows = [];
  for (const m of movs) {
    const extra = { metodo: 'paste_manual' };
    if (m.razonSocial) extra.razon_social = m.razonSocial;
    if (m.cuit) extra.cuit = m.cuit;
    if (m.cbu) extra.cbu = m.cbu;
    const hash = await hashMov(m.fecha, m.descripcion, m.importe, m.saldo);
    rows.push({
      cuenta_id: cuentaId,
      fecha: m.fecha,
      importe: m.importe,
      descripcion: m.descripcion,
      origen: 'scraper_galicia',
      controlado: false,
      hash_externo: hash,
      saldo_post: m.saldo,
      extra,
      cargado_por: session.email || 'paste_manual',
    });
  }

  // Upsert con ignore-duplicates por hash
  const { error } = await sb.from('tesoreria_movimientos').upsert(rows, {
    onConflict: 'cuenta_id,hash_externo',
    ignoreDuplicates: true,
  });
  if (error) { toast('Error: ' + error.message, true); return; }

  toast(`✓ ${rows.length} movimientos importados`);
  document.getElementById('modal-paste').remove();
  cargar();
}

async function guardarMovimiento() {
  const btn = document.getElementById('btn-guardar');
  const fecha = document.getElementById('f-fecha').value;
  const importeAbs = Math.abs(parseFloat(document.getElementById('f-importe').value || '0'));
  const cuentaId = parseInt(document.getElementById('f-cuenta').value);
  const categoriaId = parseInt(document.getElementById('f-categoria').value) || null;
  const desc = document.getElementById('f-descripcion').value.trim() || null;
  if (!fecha || !importeAbs || !cuentaId) { toast('Completá fecha, importe y cuenta', true); return; }

  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    if (_tipoCarga === 'transferencia') {
      const cuentaDestino = parseInt(document.getElementById('f-cuenta-destino').value);
      if (!cuentaDestino) throw new Error('Falta cuenta destino');
      if (cuentaDestino === cuentaId) throw new Error('Origen y destino tienen que ser distintos');
      // Insertamos los 2 movimientos, después los linkeamos
      const meta = { fecha, categoria_id: categoriaId, descripcion: desc, origen: 'transferencia', cargado_por: session.email };
      const { data: ins1, error: e1 } = await sb.from('tesoreria_movimientos')
        .insert({ ...meta, cuenta_id: cuentaId, importe: -importeAbs })
        .select().single();
      if (e1) throw e1;
      const { data: ins2, error: e2 } = await sb.from('tesoreria_movimientos')
        .insert({ ...meta, cuenta_id: cuentaDestino, importe: importeAbs, transferencia_id: ins1.id })
        .select().single();
      if (e2) throw e2;
      await sb.from('tesoreria_movimientos').update({ transferencia_id: ins2.id }).eq('id', ins1.id);
    } else {
      const signo = _tipoCarga === 'ingreso' ? 1 : -1;
      const data = {
        fecha, cuenta_id: cuentaId, categoria_id: categoriaId,
        importe: signo * importeAbs,
        descripcion: desc, origen: 'manual',
        cargado_por: session.email,
      };
      // Respaldo por FACTURA adjunta (jul 2026): sube la foto/PDF al bucket,
      // no requiere firma, y el VPS se la manda por mail a administración
      // (claudiaadorno@claudiaadorno.com) para el circuito contable.
      if (_tipoCarga === 'egreso' && _respaldoCarga === 'factura') {
        const fInput = document.getElementById('f-factura');
        const file = fInput?.files?.[0];
        if (!file) throw new Error('Adjuntá la foto o el PDF de la factura');
        if (file.size > 15 * 1024 * 1024) throw new Error('El archivo es muy grande (máx 15 MB)');
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${cuentaId}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await sb.storage.from('tesoreria-facturas')
          .upload(path, file, { contentType: file.type || 'image/jpeg' });
        if (upErr) throw new Error('No pude subir la factura: ' + upErr.message);
        const { data: pub } = sb.storage.from('tesoreria-facturas').getPublicUrl(path);
        data.respaldo_tipo = 'factura';
        data.factura_path = pub.publicUrl;
      } else if (!session.esOficina && _tipoCarga === 'egreso') {
        // Egreso de gerente/cajera con recibo: circuito de firma de siempre
        data.requiere_firma = true;
        data.respaldo_tipo = 'recibo';
      }
      const { data: insMov, error } = await sb.from('tesoreria_movimientos').insert(data).select().single();
      if (error) throw error;
      if (data.respaldo_tipo === 'factura') {
        toast('✓ Cargado · la factura se envía a administración');
        cambiarTab('dashboard');
        cargar();
        return;
      }
      // Si requiere firma: el saldo YA fue descontado. Mostramos modal
      // con botón para descargar el PDF (debe firmar y mandar por mail).
      if (data.requiere_firma && insMov) {
        toast('✓ Movimiento cargado · descargá el recibo');
        abrirModalPostCarga(insMov.id);
        return;
      }
    }
    toast('✓ Movimiento cargado');
    cambiarTab('dashboard');
    cargar();
  } catch (e) {
    toast('Error: ' + e.message, true);
    btn.disabled = false; btn.textContent = '💾 Guardar';
  }
}

  // main.py corriendo en loop en la PC lo detecta en el próximo polling

  try {
    const { data: ok, error } = await sb.rpc('tesoreria_bot_ejecutar', { p_id: id });

    if (!ok) throw new Error('No se pudo encolar (¿scraper inactivo?)');

  } catch (e) { toast('Error: ' + e.message, true); }
}

const pushManager = (() => {

    const { error } = await sb.from('rrhh_push_subscriptions').upsert(payload, { onConflict: 'endpoint,app' });

    const est = await pushManager.estado();
    if (est === 'no-soportado') { toast('Este navegador no soporta notificaciones', true); return; }
    if (est === 'bloqueado') { toast('Las notificaciones están bloqueadas — habilitalas en la config del navegador', true); return; }
    if (est === 'activo') {
      await pushManager.desactivar();
      toast('🔕 Notificaciones desactivadas');
    } else {
      await pushManager.activar();
      toast('🔔 Notificaciones de Tesorería activadas');
    }
  } catch (e) {
    toast('Error: ' + (e.message || e), true);
  }
  actualizarBtnNotifs();
}
async function actualizarBtnNotifs() {
  const btn = document.getElementById('btn-notifs');
  if (!btn) return;
  const est = await pushManager.estado();
  btn.textContent = est === 'activo' ? '🔔' : '🔕';
}

// ═══════════════════════════════════════════════════════════════════════
// PAGOS PENDIENTES (cuentas por pagar)
// ═══════════════════════════════════════════════════════════════════════
const CAT_LABELS = {
  impuestos: '🏛️ Impuestos',
  proveedores: '📦 Proveedores',
  empleados: '👥 Empleados',
  socios: '🤝 Socios',
  otros:     '📌 Otros',
};
const MEDIO_LABELS = {
  efectivo: 'Efectivo', transferencia: 'Transferencia', debito_auto: 'Débito auto',
  cheque: 'Cheque', tarjeta_credito: 'Tarjeta crédito', otro: 'Otro',
};
const URGENCIA_CFG = {
  vencido:     { label: '⚠ Vencidos',    color: '#dc2626', bg: '#fef2f2' },
  hoy:         { label: '⏰ Hoy',         color: '#ea580c', bg: '#fff7ed' },
  esta_semana: { label: '📅 Esta semana', color: '#ca8a04', bg: '#fefce8' },
  este_mes:    { label: '🗓️ Este mes',   color: '#0891b2', bg: '#ecfeff' },
  futuro:      { label: '⏳ Futuro',      color: '#475569', bg: '#f8fafc' },
};
let _pagosPendientesCache = [];
let _filtroCategoria = '', _filtroLocal = '', _filtroEstado = 'pendientes', _filtroTexto = '';

async function refrescarBadgePagosPendientes() {
  try {
    const { count } = await sb.from('tesoreria_pagos_pendientes')
      .select('id', { count: 'exact', head: true })
      .in('estado', ['pendiente','por_confirmar'])
      .lte('fecha_vencimiento', new Date(Date.now() + 7*86400000).toISOString().slice(0,10));
    const badge = document.getElementById('badge-pendientes');
    if (badge) {
      if (count > 0) { badge.textContent = count; badge.style.display = ''; }
      else badge.style.display = 'none';
    }
  } catch (e) {}
}

function fmtMoneda(n, moneda) {
  const s = moneda === 'USD' ? 'US$' : '$';
  return s + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function renderPagosPendientes() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  const filtro = _filtroEstado === 'pagados' ? ['pagado']
    : _filtroEstado === 'todos' ? ['pendiente','por_confirmar','pagado','cancelado']
    : ['pendiente','por_confirmar'];
  let q = sb.from('tesoreria_pagos_pendientes_view').select('*').in('estado', filtro);
  if (_filtroCategoria) q = q.eq('categoria', _filtroCategoria);
  if (_filtroLocal) q = q.eq('local', _filtroLocal);
  q = q.order('fecha_vencimiento', { ascending: true });
  const { data, error } = await q;
  if (error) { cont.innerHTML = `<div class="empty">Error: ${escHtml(error.message)}</div>`; return; }
  _pagosPendientesCache = data || [];
  // Aplicar filtro de texto in-memory
  let cacheFiltrado = _pagosPendientesCache;
  if (_filtroTexto && _filtroTexto.trim().length >= 2) {
    const t = _filtroTexto.trim().toLowerCase();
    const tnum = t.replace(/[.,$\s]/g, '');
    cacheFiltrado = _pagosPendientesCache.filter(p => {
      const importeStr = String(p.importe || '').replace(/[.,]/g,'');
      return (p.concepto && p.concepto.toLowerCase().includes(t))
          || (p.destinatario && p.destinatario.toLowerCase().includes(t))
          || (p.notas && p.notas.toLowerCase().includes(t))
          || (p.categoria && p.categoria.toLowerCase().includes(t))
          || (p.medio_pago && p.medio_pago.toLowerCase().includes(t))
          || (p.local && p.local.toLowerCase().includes(t))
          || (importeStr.includes(tnum));
    });
  }
  const pendientes = cacheFiltrado.filter(p => ['pendiente','por_confirmar'].includes(p.estado));
  const totalPos = pendientes.filter(p => +p.importe > 0).reduce((s,p) => s + +p.importe, 0);
  const totalNeg = pendientes.filter(p => +p.importe < 0).reduce((s,p) => s + +p.importe, 0);
  const grupos = { vencido:[], hoy:[], esta_semana:[], este_mes:[], futuro:[], pagado:[], cancelado:[] };
  cacheFiltrado.forEach(p => { (grupos[p.estado_urgencia] || grupos.futuro).push(p); });

  cont.innerHTML = `<div style="padding:16px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <div style="flex:1;min-width:180px;background:white;border-radius:10px;padding:14px;box-shadow:var(--shadow);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;">A pagar</div>
        <div style="font-size:22px;font-weight:800;color:#dc2626;margin-top:4px;">${fmtMoneda(totalPos, 'ARS')}</div>
      </div>
      <div style="flex:1;min-width:180px;background:white;border-radius:10px;padding:14px;box-shadow:var(--shadow);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;">A cobrar</div>
        <div style="font-size:22px;font-weight:800;color:#16a34a;margin-top:4px;">${fmtMoneda(Math.abs(totalNeg), 'ARS')}</div>
      </div>
      <div style="flex:1;min-width:180px;background:white;border-radius:10px;padding:14px;box-shadow:var(--shadow);">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;">Neto</div>
        <div style="font-size:22px;font-weight:800;color:var(--primary-dark);margin-top:4px;">${fmtMoneda(totalPos + totalNeg, 'ARS')}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:white;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);">
      <div style="position:relative;flex:1;min-width:220px;">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;">🔍</span>
        <input id="pp-buscador" type="search" placeholder="Buscar concepto, proveedor, importe…" value="${escHtml(_filtroTexto||'')}"
               oninput="_filtroTexto=this.value;clearTimeout(window._ppDebounce);window._ppDebounce=setTimeout(()=>renderPagosPendientes(),250);"
               style="width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box;">
        ${_filtroTexto ? `<button onclick="_filtroTexto='';renderPagosPendientes();" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:#f1f5f9;color:#475569;border:none;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;" title="Limpiar">✕</button>` : ''}
      </div>
      <select onchange="_filtroCategoria=this.value;renderPagosPendientes();" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
        <option value="">Todas las categorías</option>
        ${Object.entries(CAT_LABELS).map(([k,v]) => `<option value="${k}" ${_filtroCategoria===k?'selected':''}>${v}</option>`).join('')}
      </select>
      <select onchange="_filtroLocal=this.value;renderPagosPendientes();" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
        <option value="">Todos los locales</option>
        ${[...new Set(['general','alcorta','unicenter','oficina', ..._pagosPendientesCache.map(p => p.local).filter(Boolean)])].map(l =>
          `<option value="${escHtml(l)}" ${_filtroLocal===l?'selected':''}>${escHtml(l.charAt(0).toUpperCase()+l.slice(1))}</option>`).join('')}
      </select>
      <select onchange="_filtroEstado=this.value;renderPagosPendientes();" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;">
        <option value="pendientes" ${_filtroEstado==='pendientes'?'selected':''}>Pendientes</option>
        <option value="pagados" ${_filtroEstado==='pagados'?'selected':''}>Solo pagados</option>
        <option value="todos" ${_filtroEstado==='todos'?'selected':''}>Mostrar todos</option>
      </select>
      <div style="flex:1;"></div>
      <button class="btn-primary" style="width:auto;padding:8px 16px;font-size:13px;" onclick="abrirFormNuevoPago()">+ Nuevo pago</button>
    </div>
    ${['vencido','hoy','esta_semana','este_mes','futuro','pagado','cancelado'].map(u => {
      const items = grupos[u] || [];
      if (!items.length) return '';
      const cfg = URGENCIA_CFG[u] || { label: u.toUpperCase(), color: '#475569', bg: '#f8fafc' };
      const subtotal = items.filter(p => ['pendiente','por_confirmar'].includes(p.estado)).reduce((s,p) => s + +p.importe, 0);
      return `<div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:${cfg.bg};border-left:4px solid ${cfg.color};border-radius:6px;margin-bottom:6px;">
          <div style="font-weight:700;color:${cfg.color};">${cfg.label} <span style="color:var(--muted);font-weight:500;font-size:13px;">(${items.length})</span></div>
          <div style="font-size:13px;color:${cfg.color};font-weight:600;">${u==='pagado'||u==='cancelado'?'':fmtMoneda(subtotal,'ARS')}</div>
        </div>
        <div style="background:white;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);">
          ${items.map(renderPagoItem).join('')}
        </div>
      </div>`;
    }).join('')}
    ${_pagosPendientesCache.length === 0 ? `<div class="empty">No hay pagos pendientes. <button class="btn-primary" style="width:auto;padding:8px 14px;font-size:13px;margin-top:10px;" onclick="abrirFormNuevoPago()">+ Crear el primero</button></div>` : ''}
  </div>`;
}

function renderPagoItem(p) {
  const esNegativo = +p.importe < 0;
  const colorImp = p.estado === 'pagado' ? '#16a34a' : (esNegativo ? '#16a34a' : '#dc2626');
  const labelImp = esNegativo ? '+' : '−';
  const fechaCorta = new Date(p.fecha_vencimiento + 'T00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  const cat = CAT_LABELS[p.categoria] || p.categoria;
  const medio = MEDIO_LABELS[p.medio_pago] || p.medio_pago;
  const localBadge = p.local && p.local !== 'general'
    ? `<span style="background:#ede9fe;color:#5b21b6;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;">${p.local.toUpperCase()}</span>` : '';
  const recurrenteBadge = p.recurrente
    ? `<span style="background:#dcfce7;color:#166534;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;" title="Recurrente">🔁 ${p.frecuencia}${p.recurrente_veces ? ' × ' + p.recurrente_veces : ''}</span>` : '';
  const estadoBadge = p.estado === 'pagado'
    ? `<span style="background:#dcfce7;color:#166534;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;">✓ PAGADO</span>`
    : (p.estado === 'cancelado'
      ? `<span style="background:#fee2e2;color:#991b1b;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;">✗ CANCELADO</span>`
      : (p.estado === 'por_confirmar'
        ? `<span style="background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:600;" title="El sistema detectó un egreso bancario del mismo importe">🤔 ¿PAGADO?</span>` : ''));
  const acciones = p.estado === 'por_confirmar'
    ? `<button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#16a34a;border-color:#86efac;font-weight:700;" onclick="event.stopPropagation();confirmarMatchPago(${p.id}, ${p.movimiento_id || 'null'})">✓ Sí, pagado</button>
       <button class="btn-secondary" style="font-size:12px;padding:5px 10px;" onclick="event.stopPropagation();rechazarMatchPago(${p.id})">✗ No es</button>`
    : p.estado === 'pendiente'
    ? `<button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#16a34a;border-color:#86efac;" onclick="event.stopPropagation();marcarComoPagado(${p.id})">✓ Pagado</button>
       <button class="btn-secondary" style="font-size:12px;padding:5px 10px;" onclick="event.stopPropagation();abrirEditarPago(${p.id})">✏️</button>
       <button class="btn-secondary" style="font-size:12px;padding:5px 10px;color:#dc2626;border-color:#fca5a5;" onclick="event.stopPropagation();cancelarPago(${p.id})">✗</button>`
    : `<button class="btn-secondary" style="font-size:12px;padding:5px 10px;" onclick="event.stopPropagation();abrirEditarPago(${p.id})">Ver</button>`;
  return `<div style="display:grid;grid-template-columns:55px 1fr 130px auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;" onclick="abrirEditarPago(${p.id})">
    <div style="font-size:13px;font-weight:700;color:var(--text);text-align:center;line-height:1.2;">${fechaCorta}</div>
    <div style="min-width:0;">
      <div style="font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(p.concepto)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <span>${cat}</span><span>·</span><span>${medio}</span>${localBadge}${recurrenteBadge}${estadoBadge}
      </div>
    </div>
    <div style="font-weight:700;font-size:15px;color:${colorImp};text-align:right;font-variant-numeric:tabular-nums;">${labelImp}${fmtMoneda(Math.abs(+p.importe), p.moneda)}</div>
    <div style="display:flex;gap:4px;">${acciones}</div>
  </div>`;
}

// ── Matcheo automático: el trigger de la base detectó un egreso bancario
//    del mismo importe y dejó el pendiente "por_confirmar" ──────────────
async function confirmarMatchPago(id, movimientoId) {
  try {
    const { error } = await sb.rpc('marcar_pago_realizado', { p_id: id, p_movimiento_id: movimientoId, p_pagado_por: session.email || 'admin' });
    if (error) throw error;
    toast('✓ Confirmado como pagado');
    renderPagosPendientes(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}
async function rechazarMatchPago(id) {
  try {
    const { error } = await sb.from('tesoreria_pagos_pendientes')
      .update({ estado: 'pendiente', movimiento_id: null }).eq('id', id);
    if (error) throw error;
    toast('Vuelve a Pendientes');
    renderPagosPendientes(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}

async function marcarComoPagado(id) {
  if (!confirm('¿Marcar este pago como realizado?\n\nSi es recurrente, se va a crear automáticamente el del próximo período.')) return;
  try {
    const { data, error } = await sb.rpc('marcar_pago_realizado', { p_id: id, p_pagado_por: session.email || 'admin' });
    if (error) throw error;
    toast(data?.siguiente_creado_id ? '✓ Pagado · siguiente recurrente creado' : '✓ Pagado');
    renderPagosPendientes(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}
async function cancelarPago(id) {
  if (!confirm('¿Cancelar este pago?')) return;
  try {
    const { error } = await sb.from('tesoreria_pagos_pendientes').update({ estado: 'cancelado' }).eq('id', id);
    if (error) throw error;
    toast('Cancelado'); renderPagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}
function abrirFormNuevoPago(precarga) { abrirFormPago(null, precarga); }
function abrirEditarPago(id) {
  const p = _pagosPendientesCache.find(x => x.id === id);
  if (p) abrirFormPago(p, null);
}

          <select id="f-frecuencia" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;">
            <option value="mensual" ${p.frecuencia==='mensual'||!p.frecuencia?'selected':''}>Mensual</option>
            <option value="bimestral" ${p.frecuencia==='bimestral'?'selected':''}>Bimestral</option>
            <option value="trimestral" ${p.frecuencia==='trimestral'?'selected':''}>Trimestral</option>
            <option value="semestral" ${p.frecuencia==='semestral'?'selected':''}>Semestral</option>
            <option value="anual" ${p.frecuencia==='anual'?'selected':''}>Anual</option>
          </select></label>
        <label><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px;">Cantidad de veces</div>
          <input id="f-rec-veces" type="number" min="1" max="120" value="${p.recurrente_veces||''}" placeholder="Sin fin"
                 style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;"></label>
      </div>
      <label><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px;">Notas</div>
        <textarea id="f-notas" rows="2" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;">${escHtml(p.notas||'')}</textarea></label>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;">
      <button class="btn-secondary" onclick="document.getElementById('modal-pago').remove();">Cancelar</button>
      <button class="btn-primary" style="width:auto;padding:10px 20px;" onclick="guardarPago(${esEdit?p.id:'null'})">${esEdit?'Actualizar':'Crear'}</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  cargarCatalogosCarga().then(() => {
    renderOrigenPago(document.getElementById('f-categoria').value);
    poblarLocalesSelect(p.local || 'general');
  }).catch(() => {});
}

// ═══════════ Carga estructurada por categoría (11-ago-2026) ═══════════
let _cat_carga = null;      // catálogos: impuestos, socios, proveedores, empleadas, préstamos
let _origenSel = {};        // proveedor elegido {proveedor_codigo, proveedor_cuit}

async function cargarCatalogosCarga(force) {
  if (_cat_carga && !force) return _cat_carga;
  const [imp, soc, prov, emp, locs] = await Promise.all([
    sb.from('tesoreria_impuestos').select('*').eq('activo', true).order('nombre'),
    sb.from('tesoreria_socios').select('*').eq('activo', true).order('nombre'),
    sb.from('tesoreria_proveedores').select('codigo,nombre,cuit_norm,origen').eq('activo', true).order('nombre'),
    sb.rpc('tesoreria_empleadas_pagos'),
    sb.from('tesoreria_locales_pago').select('*').eq('activo', true).order('core', { ascending: false }).order('nombre'),
  ]);
  _cat_carga = {
    impuestos: imp.data || [], socios: soc.data || [], provs: prov.data || [],
    empleadas: emp.data?.empleadas || [], prestamos: emp.data?.prestamos || [],
    locales: locs.data || [],
  };
  return _cat_carga;
}
function _setVal(id, v) { const el = document.getElementById(id); if (el && !el.value.trim()) el.value = v; }
function _mesActual() { const d = new Date(); return (d.getMonth() + 1) + '-' + d.getFullYear(); }

function renderOrigenPago(cat) {
  const wrap = document.getElementById('f-origen-wrap');
  if (!wrap) return;
  _origenSel = {};
  const c = _cat_carga;
  if (!c) { wrap.innerHTML = ''; return; }
  const lbl = (t) => `<div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px;">${t}</div>`;
  const st = 'width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;';
  if (cat === 'impuestos') {
    wrap.innerHTML = `<label>${lbl('Impuesto')}<select id="f-orig-imp" style="${st}" onchange="elegirImpuesto(this.value)">
      <option value="">— Elegir del listado —</option>
      ${c.impuestos.map(i => `<option value="${i.id}">${escHtml(i.nombre)}${i.ente ? ' · ' + escHtml(i.ente) : ''}</option>`).join('')}
      <option value="__nuevo__">➕ Nuevo impuesto…</option>
      <option value="__quitar__">🗑 Quitar uno del listado…</option></select></label>`;
  } else if (cat === 'proveedores') {
    wrap.innerHTML = `<label>${lbl('Proveedor (Dragonfish)')}<input id="f-orig-prov" list="dl-provs" placeholder="Escribí para buscar…" style="${st}" onchange="elegirProveedor(this.value)">
      <datalist id="dl-provs">${c.provs.map(pv => `<option value="${escHtml(pv.nombre)}${pv.cuit_norm ? ' · ' + pv.cuit_norm : ''}">`).join('')}</datalist></label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button type="button" class="btn-secondary" style="font-size:12px;padding:6px 10px;" onclick="nuevoProveedorManual()">➕ Proveedor nuevo (no está en Dragonfish)</button>
      <button type="button" class="btn-secondary" style="font-size:12px;padding:6px 10px;" onclick="quitarDeCatalogo('proveedores')">🗑 Quitar manual</button>
      </div>`;
  } else if (cat === 'empleados') {
    wrap.innerHTML = `<label>${lbl('Empleada')}<select id="f-orig-emp" style="${st}" onchange="elegirEmpleada(this.value)">
      <option value="">— Elegir —</option>
      ${c.empleadas.map(e => `<option value="${e.id}">${escHtml(e.nombre)} (${escHtml(e.local || '')})</option>`).join('')}</select></label>
      <div id="f-orig-emp-prestamo"></div>`;
  } else if (cat === 'socios') {
    wrap.innerHTML = `<label>${lbl('Socio')}<select id="f-orig-soc" style="${st}" onchange="elegirSocio(this.value)">
      <option value="">— Elegir —</option>
      ${c.socios.map(s => `<option value="${s.id}">${escHtml(s.nombre)}</option>`).join('')}
      <option value="__nuevo__">➕ Nuevo socio…</option>
      <option value="__quitar__">🗑 Quitar uno del listado…</option></select></label>`;
  } else {
    wrap.innerHTML = '';
  }
}

async function elegirImpuesto(v) {
  if (v === '__quitar__') { quitarDeCatalogo('impuestos'); return; }
  if (v === '__nuevo__') {
    const nombre = prompt('Nombre del impuesto (ej: "Tasa Seguridad e Higiene"):');
    if (!nombre) { document.getElementById('f-orig-imp').value = ''; return; }
    const ente = prompt('Ente (AFIP / ARBA / Municipalidad / etc.):') || null;
    const { data, error } = await sb.from('tesoreria_impuestos')
      .insert({ nombre: nombre.trim(), ente, created_by: session.email }).select().single();
    if (error) return alert('No se pudo crear: ' + error.message);
    await cargarCatalogosCarga(true);
    renderOrigenPago('impuestos');
    document.getElementById('f-orig-imp').value = data.id;
    elegirImpuesto(String(data.id));
    return;
  }
  const imp = (_cat_carga.impuestos || []).find(i => String(i.id) === String(v));
  if (!imp) return;
  document.getElementById('f-concepto').value = imp.nombre + ' ' + _mesActual();
  _setVal('f-destinatario', imp.ente || imp.nombre);
}

function elegirProveedor(valor) {
  // El datalist trae "Nombre · CUIT" — matchear por el string completo,
  // por nombre solo, o por CUIT tipeado a mano (solo dígitos).
  const soloDigitos = (valor || '').replace(/\D/g, '');
  const pv = (_cat_carga.provs || []).find(x =>
    valor === (x.nombre + (x.cuit_norm ? ' · ' + x.cuit_norm : '')) ||
    x.nombre === valor ||
    (soloDigitos.length === 11 && x.cuit_norm === soloDigitos));
  if (!pv) return;
  document.getElementById('f-orig-prov').value = pv.nombre;
  _origenSel = { proveedor_codigo: pv.codigo, proveedor_cuit: pv.cuit_norm };
  document.getElementById('f-destinatario').value = pv.nombre;
  _setVal('f-concepto', pv.nombre + ' FC ');
}

async function nuevoProveedorManual() {
  const nombre = prompt('Nombre / razón social del proveedor nuevo:');
  if (!nombre) return;
  const cuit = (prompt('CUIT (opcional, mejora el match automático de pagos):') || '').replace(/\D/g, '');
  const codigo = 'MAN-' + Date.now();
  const { error } = await sb.from('tesoreria_proveedores').insert({
    codigo, nombre: nombre.trim(), cuit: cuit || null,
    cuit_norm: cuit.length === 11 ? cuit : null, origen: 'manual' });
  if (error) return alert('No se pudo crear: ' + error.message);
  await cargarCatalogosCarga(true);
  renderOrigenPago('proveedores');
  document.getElementById('f-orig-prov').value = nombre.trim();
  elegirProveedor(nombre.trim());
  toast('✓ Proveedor creado');
}

function elegirEmpleada(id) {
  const e = (_cat_carga.empleadas || []).find(x => String(x.id) === String(id));
  const cont = document.getElementById('f-orig-emp-prestamo');
  if (!e) { if (cont) cont.innerHTML = ''; return; }
  document.getElementById('f-destinatario').value = e.nombre;
  const prests = (_cat_carga.prestamos || []).filter(p => String(p.empleado_id) === String(id));
  if (!prests.length) {
    if (cont) cont.innerHTML = '';
    _setVal('f-concepto', 'ADELANTO SUELDO ' + _mesActual() + ' ' + e.nombre.toUpperCase());
    return;
  }
  cont.innerHTML = `<label style="display:block;margin-top:8px;"><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px;">Préstamo (RRHH)</div>
    <select style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;" onchange="elegirPrestamo(this.value)">
    <option value="">Sin préstamo (adelanto u otro pago)</option>
    ${prests.map(p => `<option value="${p.prestamo_id}">Cuota ${p.cuota_numero} de ${p.cuotas_totales} — $${Math.round(p.monto).toLocaleString('es-AR')} (${escHtml(p.mes_descuento || '')})</option>`).join('')}
    </select></label>`;
}

function elegirPrestamo(pid) {
  const p = (_cat_carga.prestamos || []).find(x => String(x.prestamo_id) === String(pid));
  const emp = p ? (_cat_carga.empleadas || []).find(e => String(e.id) === String(p.empleado_id)) : null;
  if (!p || !emp) return;
  document.getElementById('f-concepto').value =
    'DEV PRESTAMO ' + emp.nombre.toUpperCase() + ' CUOTA ' + p.cuota_numero + ' DE ' + p.cuotas_totales;
  document.getElementById('f-importe').value = -Math.abs(p.monto);
}

async function elegirSocio(v) {
  if (v === '__quitar__') { quitarDeCatalogo('socios'); return; }
  if (v === '__nuevo__') {
    const nombre = prompt('Nombre del socio:');
    if (!nombre) { document.getElementById('f-orig-soc').value = ''; return; }
    const cuit = (prompt('CUIT (opcional):') || '').replace(/\D/g, '');
    const { data, error } = await sb.from('tesoreria_socios')
      .insert({ nombre: nombre.trim(), cuit_norm: cuit.length === 11 ? cuit : null, created_by: session.email }).select().single();
    if (error) return alert('No se pudo crear: ' + error.message);
    await cargarCatalogosCarga(true);
    renderOrigenPago('socios');
    document.getElementById('f-orig-soc').value = data.id;
    elegirSocio(String(data.id));
    return;
  }
  const s = (_cat_carga.socios || []).find(x => String(x.id) === String(v));
  if (!s) return;
  document.getElementById('f-destinatario').value = s.nombre;
  _setVal('f-concepto', s.nombre + ' — retiro/pago socio ' + _mesActual());
}


// ── Quitar ítems de catálogo (baja lógica: activo=false, la historia no se toca) ──
function quitarDeCatalogo(tipo) {
  const c = _cat_carga || {};
  const items = tipo === 'impuestos' ? (c.impuestos || [])
    : tipo === 'socios' ? (c.socios || [])
    : tipo === 'locales' ? (c.locales || []).filter(l => !l.core)
    : (c.provs || []).filter(p => p.origen === 'manual');
  const wrap = document.getElementById('f-origen-wrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="border:1px solid var(--border);border-radius:8px;padding:10px;background:#fffbeb;">
    <div style="font-size:12px;font-weight:600;margin-bottom:6px;">🗑 Quitar del listado — los pagos ya cargados NO se tocan</div>
    ${items.length ? items.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #fef3c7;">
      <span style="font-size:13px;">${escHtml(i.nombre)}</span>
      <button type="button" onclick="desactivarCatalogo('${tipo}', '${tipo === 'proveedores' ? i.codigo : (tipo === 'locales' ? i.clave : i.id)}')"
              style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px;">Quitar</button>
    </div>`).join('') : '<div style="font-size:12px;color:#92400e;">No hay ítems para quitar acá.</div>'}
    <button type="button" class="btn-secondary" style="margin-top:8px;font-size:12px;padding:6px 10px;" onclick="renderOrigenPago('${tipo}')">← Volver al listado</button>
  </div>`;
}
async function desactivarCatalogo(tipo, id) {
  const item = tipo === 'proveedores'
    ? (_cat_carga.provs || []).find(p => p.codigo === id)
    : tipo === 'locales'
    ? (_cat_carga.locales || []).find(l => l.clave === id)
    : (tipo === 'impuestos' ? _cat_carga.impuestos : _cat_carga.socios).find(x => String(x.id) === String(id));
  if (!confirm(`¿Quitar "${item ? item.nombre : ''}" del listado?`)) return;
  const tabla = tipo === 'impuestos' ? 'tesoreria_impuestos'
    : tipo === 'socios' ? 'tesoreria_socios'
    : tipo === 'locales' ? 'tesoreria_locales_pago' : 'tesoreria_proveedores';
  const q = tipo === 'proveedores'
    ? sb.from(tabla).update({ activo: false }).eq('codigo', id).eq('origen', 'manual')
    : tipo === 'locales'
    ? sb.from(tabla).update({ activo: false }).eq('clave', id)
    : sb.from(tabla).update({ activo: false }).eq('id', id);
  const { error } = await q;
  if (error) return alert('No se pudo quitar: ' + error.message);
  await cargarCatalogosCarga(true);
  toast('✓ Quitado del listado');
  quitarDeCatalogo(tipo);
  if (tipo === 'locales') poblarLocalesSelect('general');
}

// ── Locales de pago: catálogo editable (core fijos + etiquetas propias) ──
function poblarLocalesSelect(seleccionado) {
  const sel = document.getElementById('f-local');
  const locs = _cat_carga?.locales;
  if (!sel || !locs || !locs.length) return;
  sel.innerHTML = locs.map(l =>
    `<option value="${escHtml(l.clave)}" ${l.clave === seleccionado ? 'selected' : ''}>${escHtml(l.nombre)}</option>`).join('')
    + '<option value="__nuevo__">➕ Nuevo local/etiqueta…</option>'
    + '<option value="__quitar__">🗑 Quitar uno…</option>';
}
async function elegirLocalPago(v) {
  if (v === '__nuevo__') {
    const nombre = prompt('Nombre del local/etiqueta nuevo (ej: "Libertador"):');
    if (!nombre) { poblarLocalesSelect('general'); return; }
    const clave = nombre.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    if (!clave) { poblarLocalesSelect('general'); return; }
    const { error } = await sb.from('tesoreria_locales_pago')
      .insert({ clave, nombre: nombre.trim(), created_by: session.email });
    if (error) { alert('No se pudo crear: ' + error.message); poblarLocalesSelect('general'); return; }
    await cargarCatalogosCarga(true);
    poblarLocalesSelect(clave);
    toast('✓ Local creado');
    return;
  }
  if (v === '__quitar__') { quitarDeCatalogo('locales'); poblarLocalesSelect('general'); return; }
}

async function guardarPago(id) {
  const concepto = document.getElementById('f-concepto').value.trim();
  const destinatario = document.getElementById('f-destinatario').value.trim() || null;
  const importe = parseFloat(document.getElementById('f-importe').value);
  const moneda = document.getElementById('f-moneda').value;
  const fecha_vencimiento = document.getElementById('f-fecha').value;
  const categoria = document.getElementById('f-categoria').value;
  const medio_pago = document.getElementById('f-medio').value;
  const local = document.getElementById('f-local').value;
  if (local.startsWith('__')) return alert('Elegí un local válido');
  const recurrente = document.getElementById('f-recurrente').checked;
  const frecuencia = recurrente ? document.getElementById('f-frecuencia').value : null;
  const recurrente_veces = recurrente ? (parseInt(document.getElementById('f-rec-veces').value) || null) : null;
  const notas = document.getElementById('f-notas').value.trim() || null;
  if (!concepto) return alert('Falta el concepto');
  if (importe === null || isNaN(importe)) return alert('Falta el importe');
  if (!fecha_vencimiento) return alert('Falta la fecha de vencimiento');
  const payload = { concepto, destinatario, importe, moneda, fecha_vencimiento, categoria, medio_pago, local, recurrente, frecuencia, recurrente_veces, notas };
  if (categoria === 'proveedores' && _origenSel.proveedor_codigo) {
    payload.proveedor_codigo = _origenSel.proveedor_codigo;
    payload.proveedor_cuit = _origenSel.proveedor_cuit || null;
  }
  try {
    if (id) {
      const { error } = await sb.from('tesoreria_pagos_pendientes').update(payload).eq('id', id);
      if (error) throw error;
      toast('✓ Actualizado');
    } else {
      payload.created_by = session.email || 'admin';
      const { error } = await sb.from('tesoreria_pagos_pendientes').insert(payload);
      if (error) throw error;
      toast('✓ Creado');
    }
    document.getElementById('modal-pago').remove();
    renderPagosPendientes(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}


// ═══════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════
(async function init() {
  const { data: { session: authSession } } = await sb.auth.getSession();
  if (authSession?.user) {
    await initSession();
  }
})();

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});
}
</script>
