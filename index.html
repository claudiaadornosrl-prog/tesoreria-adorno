// (27-oct, JP) Partes también al CREAR el pago: casilla en "+ Nuevo pago pendiente".
// El editor es el mismo (_partesFormRender con id = null): el total sale del campo Importe.
let _partesNuevoTotal = 0;
function _partesNuevoInit() {
  const w = document.getElementById('f-partes-wrap');
  if (!w) return;
  w.innerHTML = '<div id="f-partes-edit"></div>';
  document.getElementById('f-importe')?.addEventListener('change', _partesNuevoReescalar);
}
function _partesNuevoToggle(on) {
  const ed = document.getElementById('f-partes-edit');
  if (!ed) return;
  if (!on) { ed.innerHTML = ''; _partesEdit = []; return; }
  const rec = document.getElementById('f-recurrente');
  if (rec && rec.checked) { rec.checked = false; rec.dispatchEvent(new Event('change')); }
  const total = nmParse(document.getElementById('f-importe').value) || 0;
  const vto = document.getElementById('f-fecha').value || hoyISO();
  _partesNuevoTotal = total;
  _partesEdit = [{ concepto: 'anticipo 50%', importe: Math.round(total / 2), fecha: hoyISO() },
                 { concepto: 'saldo', importe: total - Math.round(total / 2), fecha: vto }];
  _partesFormRender(null, 0, 'ARS');
}
// Si cambian el total y las partes cuadraban con el total anterior, se reparten en la misma proporción
function _partesNuevoReescalar() {
  if (!document.getElementById('f-en-partes')?.checked) return;
  const total = nmParse(document.getElementById('f-importe').value) || 0;
  const viejo = _partesNuevoTotal;
  const suma = _partesEdit.reduce((s, r) => s + (+r.importe || 0), 0);
  if (viejo > 0 && total > 0 && total !== viejo && Math.abs(suma - viejo) < 1) {
    let acum = 0;
    _partesEdit.forEach((r, i) => {
      if (i < _partesEdit.length - 1) { r.importe = Math.round((+r.importe || 0) * total / viejo); acum += r.importe; }
      else r.importe = total - acum;
    });
  }
  _partesNuevoTotal = total;
  _partesFormRender(null, 0, 'ARS');
}
async function guardarPartes(id, falta) {
  const partes = _partesEdit.map(r => ({ concepto: (r.concepto || '').trim(), importe: +r.importe || 0, fecha: r.fecha }));
  if (!partes.length) return alert('Agregá al menos una parte.');
  if (partes.some(r => r.importe <= 0)) return alert('Cada parte necesita un importe mayor a cero.');
  if (partes.some(r => !r.fecha)) return alert('Cada parte necesita su fecha de vencimiento.');
  const suma = partes.reduce((s, r) => s + r.importe, 0);
  if (Math.abs(suma - falta) >= 1 && !confirm(`Las partes suman ${fmtMoneda(suma, 'ARS')} y falta pagar ${fmtMoneda(falta, 'ARS')}.\n\n¿Guardar igual? (el total del pendiente no cambia; lo que falte quedará como diferencia)`)) return;
  const { error } = await sb.rpc('tesoreria_pago_partes_definir', { p_id: id, p_partes: partes });
  if (error) return alert('No se pudo: ' + error.message);
  toast('✓ Partes guardadas');
  _reabrirFicha(id);
}
function registrarParte(parteId, padreId) {
  const p = _pagosPendientesCache.find(x => x.id === padreId);
  const h = (p?.partes || []).find(x => x.id === parteId);
  const w = document.getElementById('f-parte-reg');
  if (!p || !h || !w) return;
  const abiertas = p.partes.filter(x => ['pendiente','por_confirmar'].includes(x.estado));
  const esUltima = abiertas.length === 1;
  w.innerHTML = `<div style="margin-top:8px;border:1px solid #fcd34d;border-radius:8px;padding:10px;background:#fff;">
    <div style="font-weight:600;font-size:13px;margin-bottom:6px;">Registrar el ${escHtml(_parteNombre(h))}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <label><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px;">Importe pagado</div>
        <input id="fp-importe" type="text" inputmode="decimal" value="${nmShow(h.importe)}" onfocus="wireImporte(this)" style="width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box;"></label>
      <label><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px;">Fecha de pago</div>
        <input id="fp-fecha" type="date" value="${hoyISO()}" style="width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;box-sizing:border-box;"></label>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:8px;cursor:pointer;">
      <input id="fp-ultimo" type="checkbox" ${esUltima ? 'checked' : ''}> Es el último pago: cerrar el pendiente aunque quede diferencia</label>
    <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">Si pagás menos que la parte y no es el último, lo que falta queda como una parte nueva con la misma fecha.</div>
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px;">
      <button type="button" class="btn-secondary" style="font-size:12px;padding:4px 10px;" onclick="document.getElementById('f-parte-reg').innerHTML=''">Cancelar</button>
      <button type="button" class="btn-primary" style="width:auto;font-size:12px;padding:5px 12px;" onclick="guardarRegistroParte(${parteId}, ${padreId})">Guardar pago</button>
    </div>
  </div>`;
  document.getElementById('fp-importe')?.focus();
}
async function guardarRegistroParte(parteId, padreId) {
  const importe = nmParse(document.getElementById('fp-importe').value);
  const fecha = document.getElementById('fp-fecha').value;
  const ultimo = document.getElementById('fp-ultimo').checked;
  if (!importe || importe <= 0) return alert('Falta el importe pagado.');
  if (!fecha) return alert('Falta la fecha de pago.');
  const { data, error } = await sb.rpc('tesoreria_pago_parte_registrar', { p_parte_id: parteId, p_importe: importe, p_fecha: fecha, p_ultimo: ultimo, p_movimiento_id: null });
  if (error) return alert('No se pudo: ' + error.message);
  toast(data?.estado === 'pagado' ? '✓ Pago registrado · pendiente completo' : `✓ Pago registrado · falta ${fmtMoneda(data?.importe_falta || 0, 'ARS')}`);
  _reabrirFicha(padreId);
}
async function confirmarParte(parteId, movimientoId, padreId) {
  const { error } = await sb.rpc('marcar_pago_realizado', { p_id: parteId, p_movimiento_id: movimientoId, p_pagado_por: session.email || 'admin' });
  if (error) return alert('Error: ' + error.message);
  toast('✓ Confirmado'); _reabrirFicha(padreId);
}
async function volverParte(parteId, padreId) {
  if (!confirm('¿Deshacer este pago? La parte vuelve a "a pagar" y el pendiente vuelve a quedar en partes.')) return;
  const { error } = await sb.rpc('tesoreria_volver_a_pendiente', { p_id: parteId });
  if (error) return alert('No se pudo: ' + error.message);
  toast('↩ Pago deshecho'); _reabrirFicha(padreId);
}

// ═══════════ Carga estructurada por categoría (11-ago-2026) ═══════════
let _cat_carga = null;      // catálogos: impuestos, socios, proveedores, empleadas, préstamos
let _origenSel = {};        // proveedor elegido {proveedor_codigo, proveedor_cuit}

async function cargarCatalogosCarga(force) {
  if (_cat_carga && !force) return _cat_carga;
  // (13-ago) Proveedores paginado: PostgREST corta en 1.000 filas y hay 1.282
  // — el datalist llegaba hasta la letra F.
  const _todosProvs = async () => {
    const out = [];
    for (let desde = 0; ; desde += 1000) {
      const { data, error } = await sb.from('tesoreria_proveedores')
        .select('codigo,nombre,cuit_norm,origen').eq('activo', true)
        .order('nombre').range(desde, desde + 999);
      if (error || !data || !data.length) break;
      out.push(...data);
      if (data.length < 1000) break;
    }
    return out;
  };
  const [imp, soc, prov, emp, locs] = await Promise.all([
    sb.from('tesoreria_impuestos').select('*').eq('activo', true).order('nombre'),
    sb.from('tesoreria_socios').select('*').eq('activo', true).order('nombre'),
    _todosProvs(),
    sb.rpc('tesoreria_empleadas_pagos'),
    sb.from('tesoreria_locales_pago').select('*').eq('activo', true).order('core', { ascending: false }).order('nombre'),
  ]);
  _cat_carga = {
    impuestos: imp.data || [], socios: soc.data || [], provs: prov || [],
    empleadas: emp.data?.empleadas || [], prestamos: emp.data?.prestamos || [],
    locales: locs.data || [],
  };
  return _cat_carga;
}
function _setVal(id, v) { const el = document.getElementById(id); if (el && !el.value.trim()) el.value = v; }
function _mesActual() { const d = new Date(); return (d.getMonth() + 1) + '-' + d.getFullYear(); }

function renderOrigenPago(cat) {
  const wrap = document.getElementById('f-origen-wrap');
  if (!wrap) return;
  _origenSel = {};
  const c = _cat_carga;
  if (!c) { wrap.innerHTML = ''; return; }
  const lbl = (t) => `<div class="pp-lbl">${t}</div>`;
  const st = 'width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;box-sizing:border-box;background:#fff;';
  if (cat === 'impuestos') {
    wrap.innerHTML = `<label>${lbl('Impuesto')}<select id="f-orig-imp" style="${st}" onchange="elegirImpuesto(this.value)">
      <option value="">— Elegir del listado —</option>
      ${c.impuestos.map(i => `<option value="${i.id}">${escHtml(i.nombre)}${i.ente ? ' · ' + escHtml(i.ente) : ''}</option>`).join('')}
      <option value="__nuevo__">➕ Nuevo impuesto…</option>
      <option value="__quitar__">🗑 Quitar uno del listado…</option></select></label>`;
  } else if (cat === 'proveedores') {
    wrap.innerHTML = `<label>${lbl('Proveedor (Dragonfish)')}<input id="f-orig-prov" list="dl-provs" placeholder="Escribí para buscar…" style="${st}" onchange="elegirProveedor(this.value)">
      <datalist id="dl-provs">${c.provs.map(pv => `<option value="${escHtml(pv.nombre)}${pv.cuit_norm ? ' · ' + pv.cuit_norm : ''}">`).join('')}</datalist></label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button type="button" class="btn-secondary" style="font-size:12px;padding:6px 10px;" onclick="nuevoProveedorManual()">➕ Proveedor nuevo (no está en Dragonfish)</button>
      <button type="button" class="btn-secondary" style="font-size:12px;padding:6px 10px;" onclick="quitarDeCatalogo('proveedores')">🗑 Quitar manual</button>
      </div>`;
  } else if (cat === 'empleados') {
    wrap.innerHTML = `<label>${lbl('Empleada')}<select id="f-orig-emp" style="${st}" onchange="elegirEmpleada(this.value)">
      <option value="">— Elegir —</option>
      ${c.empleadas.map(e => `<option value="${e.id}">${escHtml(e.nombre)} (${escHtml(e.local || '')})</option>`).join('')}</select></label>
      <div id="f-orig-emp-prestamo"></div>`;
  } else if (cat === 'socios') {
    wrap.innerHTML = `<label>${lbl('Socio')}<select id="f-orig-soc" style="${st}" onchange="elegirSocio(this.value)">
      <option value="">— Elegir —</option>
      ${c.socios.map(s => `<option value="${s.id}">${escHtml(s.nombre)}</option>`).join('')}
      <option value="__nuevo__">➕ Nuevo socio…</option>
      <option value="__quitar__">🗑 Quitar uno del listado…</option></select></label>`;
  } else {
    wrap.innerHTML = '';
  }
}

async function elegirImpuesto(v) {
  if (v === '__quitar__') { quitarDeCatalogo('impuestos'); return; }
  if (v === '__nuevo__') {
    const nombre = prompt('Nombre del impuesto (ej: "Tasa Seguridad e Higiene"):');
    if (!nombre) { document.getElementById('f-orig-imp').value = ''; return; }
    const ente = prompt('Ente (AFIP / ARBA / Municipalidad / etc.):') || null;
    const { data, error } = await sb.from('tesoreria_impuestos')
      .insert({ nombre: nombre.trim(), ente, created_by: session.email }).select().single();
    if (error) return alert('No se pudo crear: ' + error.message);
    await cargarCatalogosCarga(true);
    renderOrigenPago('impuestos');
    document.getElementById('f-orig-imp').value = data.id;
    elegirImpuesto(String(data.id));
    return;
  }
  const imp = (_cat_carga.impuestos || []).find(i => String(i.id) === String(v));
  if (!imp) return;
  document.getElementById('f-concepto').value = imp.nombre + ' ' + _mesActual();
  _setVal('f-destinatario', imp.ente || imp.nombre);
}

function elegirProveedor(valor) {
  // El datalist trae "Nombre · CUIT" — matchear por el string completo,
  // por nombre solo, o por CUIT tipeado a mano (solo dígitos).
  const soloDigitos = (valor || '').replace(/\D/g, '');
  const pv = (_cat_carga.provs || []).find(x =>
    valor === (x.nombre + (x.cuit_norm ? ' · ' + x.cuit_norm : '')) ||
    x.nombre === valor ||
    (soloDigitos.length === 11 && x.cuit_norm === soloDigitos));
  if (!pv) return;
  document.getElementById('f-orig-prov').value = pv.nombre;
  _origenSel = { proveedor_codigo: pv.codigo, proveedor_cuit: pv.cuit_norm };
  document.getElementById('f-destinatario').value = pv.nombre;
  _setVal('f-concepto', pv.nombre + ' FC ');
}

async function nuevoProveedorManual() {
  const nombre = prompt('Nombre / razón social del proveedor nuevo:');
  if (!nombre) return;
  const cuit = (prompt('CUIT (opcional, mejora el match automático de pagos):') || '').replace(/\D/g, '');
  const codigo = 'MAN-' + Date.now();
  const { error } = await sb.from('tesoreria_proveedores').insert({
    codigo, nombre: nombre.trim(), cuit: cuit || null,
    cuit_norm: cuit.length === 11 ? cuit : null, origen: 'manual' });
  if (error) return alert('No se pudo crear: ' + error.message);
  await cargarCatalogosCarga(true);
  renderOrigenPago('proveedores');
  document.getElementById('f-orig-prov').value = nombre.trim();
  elegirProveedor(nombre.trim());
  toast('✓ Proveedor creado');
}

function elegirEmpleada(id) {
  const e = (_cat_carga.empleadas || []).find(x => String(x.id) === String(id));
  const cont = document.getElementById('f-orig-emp-prestamo');
  if (!e) { if (cont) cont.innerHTML = ''; return; }
  document.getElementById('f-destinatario').value = e.nombre;
  const prests = (_cat_carga.prestamos || []).filter(p => String(p.empleado_id) === String(id));
  if (!prests.length) {
    if (cont) cont.innerHTML = '';
    _setVal('f-concepto', 'ADELANTO SUELDO ' + _mesActual() + ' ' + e.nombre.toUpperCase());
    return;
  }
  cont.innerHTML = `<label style="display:block;margin-top:8px;"><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:3px;">Préstamo (Colaboradores)</div>
    <select style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;box-sizing:border-box;" onchange="elegirPrestamo(this.value)">
    <option value="">Sin préstamo (adelanto u otro pago)</option>
    ${prests.map(p => `<option value="${p.prestamo_id}">Cuota ${p.cuota_numero} de ${p.cuotas_totales} — $${Math.round(p.monto).toLocaleString('es-AR')} (${escHtml(p.mes_descuento || '')})</option>`).join('')}
    </select></label>`;
}

function elegirPrestamo(pid) {
  const p = (_cat_carga.prestamos || []).find(x => String(x.prestamo_id) === String(pid));
  const emp = p ? (_cat_carga.empleadas || []).find(e => String(e.id) === String(p.empleado_id)) : null;
  if (!p || !emp) return;
  document.getElementById('f-concepto').value =
    (Number(p.cuotas_totales) === 1
      ? 'DEV ADELANTO SUELDO ' + emp.nombre.toUpperCase()
      : 'DEV PRESTAMO ' + emp.nombre.toUpperCase() + ' CUOTA ' + p.cuota_numero + ' DE ' + p.cuotas_totales);
  document.getElementById('f-importe').value = nmShow(-Math.abs(p.monto));
}

async function elegirSocio(v) {
  if (v === '__quitar__') { quitarDeCatalogo('socios'); return; }
  if (v === '__nuevo__') {
    const nombre = prompt('Nombre del socio:');
    if (!nombre) { document.getElementById('f-orig-soc').value = ''; return; }
    const cuit = (prompt('CUIT (opcional):') || '').replace(/\D/g, '');
    const { data, error } = await sb.from('tesoreria_socios')
      .insert({ nombre: nombre.trim(), cuit_norm: cuit.length === 11 ? cuit : null, created_by: session.email }).select().single();
    if (error) return alert('No se pudo crear: ' + error.message);
    await cargarCatalogosCarga(true);
    renderOrigenPago('socios');
    document.getElementById('f-orig-soc').value = data.id;
    elegirSocio(String(data.id));
    return;
  }
  const s = (_cat_carga.socios || []).find(x => String(x.id) === String(v));

  document.getElementById('f-destinatario').value = s.nombre;

}


// ── Quitar ítems de catálogo (baja lógica: activo=false, la historia no se toca) ──
function quitarDeCatalogo(tipo) {
  const c = _cat_carga || {};
  const items = tipo === 'impuestos' ? (c.impuestos || [])
    : tipo === 'socios' ? (c.socios || [])
    : tipo === 'locales' ? (c.locales || []).filter(l => !l.core)
    : (c.provs || []).filter(p => p.origen === 'manual');
  const wrap = document.getElementById('f-origen-wrap');
  if (!wrap) return;
  wrap.innerHTML = `<div style="border:1px solid var(--border);border-radius:8px;padding:10px;background:#fffbeb;">
    <div style="font-size:12px;font-weight:600;margin-bottom:6px;">🗑 Quitar del listado — los pagos ya cargados NO se tocan</div>
    ${items.length ? items.map(i => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #fef3c7;">
      <span style="font-size:13px;">${escHtml(i.nombre)}</span>
      <button type="button" onclick="desactivarCatalogo('${tipo}', '${tipo === 'proveedores' ? i.codigo : (tipo === 'locales' ? i.clave : i.id)}')"
              style="background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px;">Quitar</button>
    </div>`).join('') : '<div style="font-size:12px;color:#92400e;">No hay ítems para quitar acá.</div>'}
    <button type="button" class="btn-secondary" style="margin-top:8px;font-size:12px;padding:6px 10px;" onclick="renderOrigenPago('${tipo}')">← Volver al listado</button>
  </div>`;
}
async function desactivarCatalogo(tipo, id) {
  const item = tipo === 'proveedores'
    ? (_cat_carga.provs || []).find(p => p.codigo === id)
    : tipo === 'locales'
    ? (_cat_carga.locales || []).find(l => l.clave === id)
    : (tipo === 'impuestos' ? _cat_carga.impuestos : _cat_carga.socios).find(x => String(x.id) === String(id));
  if (!confirm(`¿Quitar "${item ? item.nombre : ''}" del listado?`)) return;
  const tabla = tipo === 'impuestos' ? 'tesoreria_impuestos'
    : tipo === 'socios' ? 'tesoreria_socios'
    : tipo === 'locales' ? 'tesoreria_locales_pago' : 'tesoreria_proveedores';
  const q = tipo === 'proveedores'
    ? sb.from(tabla).update({ activo: false }).eq('codigo', id).eq('origen', 'manual')
    : tipo === 'locales'
    ? sb.from(tabla).update({ activo: false }).eq('clave', id)
    : sb.from(tabla).update({ activo: false }).eq('id', id);
  const { error } = await q;
  if (error) return alert('No se pudo quitar: ' + error.message);
  await cargarCatalogosCarga(true);
  toast('✓ Quitado del listado');
  quitarDeCatalogo(tipo);
  if (tipo === 'locales') poblarLocalesSelect('general');
}

// ── Locales de pago: catálogo editable (core fijos + etiquetas propias) ──
function poblarLocalesSelect(seleccionado) {
  const sel = document.getElementById('f-local');
  const locs = _cat_carga?.locales;
  if (!sel || !locs || !locs.length) return;
  sel.innerHTML = locs.map(l =>
    `<option value="${escHtml(l.clave)}" ${l.clave === seleccionado ? 'selected' : ''}>${escHtml(l.nombre)}</option>`).join('')
    + '<option value="__nuevo__">➕ Nuevo local/etiqueta…</option>'
    + '<option value="__quitar__">🗑 Quitar uno…</option>';
}
async function elegirLocalPago(v) {
  if (v === '__nuevo__') {
    const nombre = prompt('Nombre del local/etiqueta nuevo (ej: "Libertador"):');
    if (!nombre) { poblarLocalesSelect('general'); return; }
    const clave = nombre.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    if (!clave) { poblarLocalesSelect('general'); return; }
    const { error } = await sb.from('tesoreria_locales_pago')
      .insert({ clave, nombre: nombre.trim(), created_by: session.email });
    if (error) { alert('No se pudo crear: ' + error.message); poblarLocalesSelect('general'); return; }
    await cargarCatalogosCarga(true);
    poblarLocalesSelect(clave);
    toast('✓ Local creado');
    return;
  }
  if (v === '__quitar__') { quitarDeCatalogo('locales'); poblarLocalesSelect('general'); return; }
}

async function guardarPago(id) {
  const concepto = document.getElementById('f-concepto').value.trim();
  const destinatario = document.getElementById('f-destinatario').value.trim() || null;
  const importe = nmParse(document.getElementById('f-importe').value);
  const moneda = document.getElementById('f-moneda').value;
  const fecha_vencimiento = document.getElementById('f-fecha').value;
  const categoria = document.getElementById('f-categoria').value;
  const medio_pago = document.getElementById('f-medio').value;
  const local = document.getElementById('f-local').value;
  if (local.startsWith('__')) return alert('Elegí un local válido');
  const recurrente = document.getElementById('f-recurrente').checked;
  const frecuencia = recurrente ? document.getElementById('f-frecuencia').value : null;
  const recurrente_veces = recurrente ? (parseInt(document.getElementById('f-rec-veces').value) || null) : null;
  const notas = document.getElementById('f-notas').value.trim() || null;
  if (!concepto) return alert('Falta el concepto');
  if (importe === null || isNaN(importe)) return alert('Falta el importe');
  if (!fecha_vencimiento) return alert('Falta la fecha de vencimiento');
  const enPartes = !id && !!document.getElementById('f-en-partes')?.checked;
  let partes = null;
  if (enPartes) {
    if (recurrente) return alert('Un pago en partes no puede ser recurrente: destildá una de las dos opciones.');
    if (!(importe > 0)) return alert('Solo se dividen en partes los pagos a realizar (importe mayor a cero).');
    partes = _partesEdit.map(r => ({ concepto: (r.concepto || '').trim(), importe: +r.importe || 0, fecha: r.fecha }));
    if (!partes.length) return alert('Agregá al menos una parte, o destildá "Se paga en partes".');
    if (partes.some(r => r.importe <= 0)) return alert('Cada parte necesita un importe mayor a cero.');
    if (partes.some(r => !r.fecha)) return alert('Cada parte necesita su fecha de vencimiento.');
    const sumaP = partes.reduce((s, r) => s + r.importe, 0);
    if (Math.abs(sumaP - importe) >= 1 && !confirm(`Las partes suman ${fmtMoneda(sumaP, moneda)} y el total es ${fmtMoneda(importe, moneda)}.\n\n¿Guardar igual?`)) return;
  }
  const payload = { concepto, destinatario, importe, moneda, fecha_vencimiento, categoria, medio_pago, local, recurrente, frecuencia, recurrente_veces, notas };
  if (categoria === 'proveedores' && _origenSel.proveedor_codigo) {
    payload.proveedor_codigo = _origenSel.proveedor_codigo;
    payload.proveedor_cuit = _origenSel.proveedor_cuit || null;
  }
  try {
    if (id) {
      const antes = _pagosPendientesCache.find(x => x.id === id) || {};
      const { error } = await sb.from('tesoreria_pagos_pendientes').update(payload).eq('id', id);
      if (error) throw error;
      toast('✓ Actualizado');
      // (25-sep) Serie de cuotas: ofrecer llevar el cambio a las cuotas siguientes
      if (antes.serie_id) {
        const nro = _cuotaNro(antes.concepto) || 1;
        const sig = _pagosPendientesCache.filter(x => x.serie_id === antes.serie_id && x.id !== id
          && ['pendiente','por_confirmar'].includes(x.estado) && (_cuotaNro(x.concepto) || 0) > nro);
        const cambioFecha = antes.fecha_vencimiento !== fecha_vencimiento;
        const cambio = cambioFecha || +antes.importe !== +importe || antes.concepto !== concepto
          || (antes.destinatario || null) !== destinatario || antes.medio_pago !== medio_pago
          || antes.local !== local || antes.categoria !== categoria || antes.moneda !== moneda;
        if (sig.length && cambio && confirm(`Esta es la CUOTA ${nro} de una serie y hay ${sig.length} cuota(s) siguiente(s) pendiente(s).\n\n¿Aplicar el mismo cambio a las siguientes?\n(importe, concepto, destinatario, medio, local${cambioFecha ? ' y las fechas se corren a partir de esta' : ''})\n\nAceptar = sí, a todas · Cancelar = solo a esta cuota`)) {
          const { data: n, error: e2 } = await sb.rpc('tesoreria_serie_aplicar', { p_id: id, p_fechas: cambioFecha, p_incluir_cancelados: false });
          if (e2) throw e2;
          toast(`✓ Aplicado a ${n} cuota(s) siguiente(s)`);
        }
      }
    } else {
      payload.created_by = session.email || 'admin';
      const { data: nuevo, error } = await sb.from('tesoreria_pagos_pendientes').insert(payload).select('id').single();
      if (error) throw error;
      if (partes) {
        const { error: e2 } = await sb.rpc('tesoreria_pago_partes_definir', { p_id: nuevo.id, p_partes: partes });
        if (e2) alert('El pago se creó, pero no se pudieron guardar las partes: ' + e2.message + '\n\nAbrilo y tocá "Dividir en partes".');
        else toast(`✓ Creado en ${partes.length} partes`);
      } else toast('✓ Creado');
    }
    document.getElementById('modal-pago').remove();
    refrescarPendientesEnLugar(); refrescarBadgePagosPendientes();
  } catch (e) { alert('Error: ' + e.message); }
}



// ═══════════════════════════════════════════════════════════════════════
// MINIATURA DEL ADJUNTO (v110, 20-oct-2026, pedido JP): apenas eligen un
// archivo (foto o PDF) se muestra una vista previa chica debajo del input,
// para que vean QUÉ están subiendo. Si el PDF es un comprobante generado por
// el sistema (tiene "CÓDIGO DE SEGUIMIENTO MOV-…"), avisa en rojo.
// ═══════════════════════════════════════════════════════════════════════
let _pdfjsCarga = null;
function _cargarPdfjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (_pdfjsCarga) return _pdfjsCarga;
  _pdfjsCarga = new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      ok(window.pdfjsLib);
    };
    sc.onerror = () => no(new Error('No se pudo cargar pdf.js'));
    document.head.appendChild(sc);
  });
  return _pdfjsCarga;
}
function _cajaMiniatura(input) {
  let box = input.parentElement.querySelector('.adj-mini');
  if (!box) {
    box = document.createElement('div');
    box.className = 'adj-mini';
    box.style.cssText = 'margin-top:8px;display:none;';
    input.insertAdjacentElement('afterend', box);
  }
  return box;
}
async function previsualizarAdjunto(input) {
  const box = _cajaMiniatura(input);
  const file = input.files && input.files[0];
  if (!file) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const kb = file.size > 1024 * 1024 ? (file.size / 1048576).toFixed(1) + ' MB' : Math.round(file.size / 1024) + ' KB';
  box.style.display = '';
  box.innerHTML = `<div style="display:flex;gap:10px;align-items:flex-start;">
      <div class="adj-mini-img" style="flex:0 0 auto;width:120px;min-height:80px;border:1px solid var(--border);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:11px;">⏳</div>
      <div style="font-size:12px;line-height:1.5;">
        <div><strong>${escHtml(file.name)}</strong> · ${kb}</div>
        <div class="adj-mini-info" style="color:var(--muted);"></div>
        <div style="color:var(--muted);margin-top:4px;">Mirá la miniatura: tiene que ser ${(input.id === 'em-factura' ? (document.getElementById('em-lbl-archivo')?.textContent || '') : (document.getElementById('lbl-adjunto')?.textContent || '')).toLowerCase().includes('depósito') ? 'el ticket del depósito bancario' : 'la factura o el ticket de compra'}. Si no es, elegí otro archivo.</div>
      </div></div>`;
  const img = box.querySelector('.adj-mini-img'), info = box.querySelector('.adj-mini-info');
  try {
    if (file.type.startsWith('image/')) {
      const url = URL.createObjectURL(file);
      img.innerHTML = `<img src="${url}" style="max-width:120px;max-height:160px;display:block;" onload="URL.revokeObjectURL(this.src)">`;
      info.textContent = 'Foto';
    } else if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      const pdfjs = await _cargarPdfjs();
      const buf = await file.arrayBuffer();
      const doc = await pdfjs.getDocument({ data: buf }).promise;
      const pg = await doc.getPage(1);
      const vp0 = pg.getViewport({ scale: 1 });
      const vp = pg.getViewport({ scale: 118 / vp0.width });
      const cv = document.createElement('canvas');
      cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
      cv.style.cssText = 'display:block;max-height:160px;';
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      img.innerHTML = ''; img.appendChild(cv);
      info.textContent = 'PDF · ' + doc.numPages + (doc.numPages === 1 ? ' página' : ' páginas');
      // ¿Es un comprobante generado por el sistema (recibo / retiro)?
      try {
        const tc = await pg.getTextContent();
        const txt = tc.items.map(i => i.str).join(' ');
        const mov = /MOV-\d{5,}/.exec(txt);
        if (/SEGUIMIENTO/i.test(txt) && mov) {
          info.innerHTML += `<div style="color:#dc2626;font-weight:600;margin-top:4px;">⚠ Este PDF es un comprobante del sistema (${escHtml(mov[0])}), no es un ticket ni una factura. Fijate si elegiste el archivo correcto.</div>`;
        }
      } catch (_) { /* sin texto: no se puede saber */ }
    } else {
      img.textContent = '📄'; info.textContent = file.type || 'archivo';
    }
  } catch (e) {
    img.textContent = '📄';
    info.innerHTML = '<span style="color:#b45309;">No se pudo armar la vista previa (' + escHtml(e.message || e) + ').</span>';
  }
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t && t.tagName === 'INPUT' && t.type === 'file' && (t.id === 'f-factura' || t.id === 'em-factura')) previsualizarAdjunto(t);
});

// ⇪ Aviso de Bloq Mayús en campos de contraseña (agregado 14-ago-2026)
(function () {
  function toggleAviso(input, on) {
    var el = input.nextElementSibling;
    var esAviso = el && el.classList && el.classList.contains('caps-aviso');
    if (on && !esAviso) {
      el = document.createElement('div');
      el.className = 'caps-aviso';
      el.textContent = '\u21ea May\u00fasculas activadas';
      el.style.cssText = 'color:#b45309;font-size:12px;font-weight:600;margin-top:4px;';
      input.insertAdjacentElement('afterend', el);
    } else if (!on && esAviso) {
      el.remove();
    }
  }
  function handler(e) {
    var t = e.target;
    if (t && t.type === 'password' && typeof e.getModifierState === 'function') {
      toggleAviso(t, e.getModifierState('CapsLock'));
    }
  }
  document.addEventListener('keydown', handler, true);
  document.addEventListener('keyup', handler, true);
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t && t.type === 'password') toggleAviso(t, false);
  }, true);
})();
</script>

<script>
// (24-ago) Blindaje iOS: re-suscripcion automatica de push. iOS suelta la
// suscripcion silenciosamente cada tanto; si el permiso sigue concedido y
// esta usuaria YA tenia la campanita activa en ESTA app (hay fila propia,
// no del hub), se renueva sola al abrir. Si la apago a proposito (fila
// borrada), no se toca. Regla viva: mantener igual en las 4 apps + hub.
(async function _autoResubPush() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (typeof pushManager === 'undefined' || !pushManager.soportado()) return;
    const { data: { session: _s } } = await sb.auth.getSession();
    if (!_s) return;
    let _emp = null, _gen = null;
    try {
      const { data: u } = await sb.rpc('rrhh_current_user');
      const _u = Array.isArray(u) ? u[0] : u;
      _emp = _u?.empleado_id ?? null;
      if (!_emp) _gen = _u?.local_gerencia ?? null;
    } catch (_) {}
    if (!_emp && !_gen) return;
    let q = sb.from('rrhh_push_subscriptions').select('id')
      .eq('app', 'tesoreria').or('plataforma.is.null,plataforma.neq.hub').limit(1);
    q = _emp ? q.eq('empleado_id', _emp) : q.eq('local_generico', _gen);
    const { data: filas } = await q;
    if (!filas || !filas.length) return;
    await pushManager.activar();
  } catch (_) {}
})();
</script>
