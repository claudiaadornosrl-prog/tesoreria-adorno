/* ADORNO_MILES:INI — bloque compartido, idéntico en todos los módulos (fuente: _shared/adorno-miles.js; se inyecta con _shared/inyectar_miles.py). NO editar a mano en un módulo. */
// (1-oct-2026, JP) Separador de miles MIENTRAS se escribe, en todos los módulos.
//  · Campos de texto con inputmode="decimal" (wireImporte y afines): se formatean en vivo
//    "1.234.567,89"; el valor sigue siendo ese texto, que nmParse ya sabe leer.
//  · <input type="number"> de importes: el navegador no puede mostrar puntos en un campo
//    numérico, así que se convierten a texto y se les pone un `value` propio que SIGUE
//    devolviendo el número limpio ("1234567.89"). Number(el.value) funciona igual que antes.
//  · No se tocan los campos que no son importes: los que tienen max, o cuyo id/placeholder
//    habla de días, cuotas, minutos, tasa, %, orden, año, DNI, remito, etc. (data-sin-miles
//    para excluir uno a mano).
//  · El "." que tipea la persona vale como coma decimal: los puntos de miles los pone el sistema.
window.ADORNO_MILES = (function () {
  const NATIVO = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  const nget = el => NATIVO.get.call(el), nset = (el, v) => NATIVO.set.call(el, v);
  const EXCL = new Set(['dias','días','dia','día','cuotas','cuota','mins','minutos','minuto','horas','hora','tasa','pct',
    'porc','porcentaje','orden','puntos','cant','cantidad','pack','pv','num','numero','número','numint','nro','freq',
    'hijos','anio','año','year','pmin','pmax','regimen','régimen','remito','vta','dni','cuit','cuil','cbu','legajo',
    'tel','telefono','teléfono','sku','cp']);

  // "1234567,8" (dígitos + una coma; los puntos se ignoran) → "1.234.567,8"
  function fmtTexto(s) {
    s = String(s == null ? '' : s);
    const neg = /^\s*-/.test(s);
    s = s.replace(/[^\d,]/g, '');
    const i = s.indexOf(',');
    let ent = i < 0 ? s : s.slice(0, i);
    const dec = i < 0 ? null : s.slice(i + 1).replace(/,/g, '');
    ent = ent.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    if (dec !== null && ent === '') ent = '0';
    return (neg ? '-' : '') + ent + (dec !== null ? ',' + dec : '');
  }
  // "1.234,5" → "1234.5" (lo que devolvía un type=number)
  function aNumStr(disp) {
    const t = String(disp || '').replace(/\./g, '').replace(',', '.').replace(/[^\d.\-]/g, '').replace(/\.$/, '');
    return (t === '' || t === '-') ? '' : t;
  }
  // número o "1234.5" (estilo JS) → "1.234,5"
  function deNum(v) {
    if (v === '' || v == null) return '';
    const n = Number(v);
    if (!Number.isFinite(n)) return '';
    const s = String(parseFloat(n.toFixed(6)));          // sin ruido de coma flotante
    return fmtTexto((/e/i.test(s) ? n.toFixed(2) : s).replace('.', ','));
  }
  // "10.5" estilo JS (sin coma, 1–2 decimales) → "10,5". Misma regla que nmParse.
  function normTexto(v) {
    v = String(v == null ? '' : v);
    return (!v.includes(',') && /^\s*-?\d+\.\d{1,2}\s*$/.test(v)) ? v.trim().replace('.', ',') : v;
  }

  function reformatear(el, ev) {
    let v = nget(el);
    let pos = el.selectionStart == null ? v.length : el.selectionStart;
    const tipo = (ev && ev.inputType) || '';
    const data = (ev && typeof ev.data === 'string') ? ev.data : '';
    if (/^insert/.test(tipo) && data.includes('.') && !v.includes(',')) {
      // El punto que TIPEA la persona es la coma decimal (los de miles los pone el sistema).
      // Se ubica dentro de lo recién insertado, venga de a una tecla o varias juntas.
      const ini = pos - data.length, k = data.lastIndexOf('.');
      if (ini >= 0 && v.slice(ini, pos) === data) v = v.slice(0, ini + k) + ',' + v.slice(ini + k + 1);
    } else if (/paste|drop/i.test(tipo)) {
      v = normTexto(v);                                    // pegado "1234.56"
    }
    const sig = v.slice(0, pos).replace(/[^\d,\-]/g, '').length;
    const nuevo = fmtTexto(v);
    if (nuevo !== nget(el)) nset(el, nuevo);
    let p = 0, vistos = 0;
    while (p < nuevo.length && vistos < sig) { if (/[\d,\-]/.test(nuevo[p])) vistos++; p++; }
    try { el.setSelectionRange(p, p); } catch (_) {}
  }

  // Campo de TEXTO (inputmode=decimal): formato en vivo, el value sigue siendo el texto.
  function wire(el) {
    if (!el || el._miles) return;
    el._miles = 'txt';
    Object.defineProperty(el, 'value', { configurable: true,
      get() { return nget(el); },
      set(v) { nset(el, normTexto(v)); } });
    const v0 = normTexto(nget(el));
    nset(el, /^-?[1-9]\d{3,}(,\d+)?$/.test(v0) ? fmtTexto(v0) : v0);   // "42222" → "42.222"
  }

  // <input type="number"> de importes → texto con miles; .value sigue devolviendo "1234.5".
  function subirNumero(el) {
    if (!el || el._miles) return;
    el._miles = 'num';
    const v0 = nget(el);
    el.setAttribute('type', 'text');
    if (!el.getAttribute('inputmode')) el.setAttribute('inputmode', 'decimal');
    el.setAttribute('data-miles', 'num');
    el.setAttribute('autocomplete', 'off');
    Object.defineProperty(el, 'value', { configurable: true,
      get() { return aNumStr(nget(el)); },
      set(v) { nset(el, deNum(v)); } });
    Object.defineProperty(el, 'valueAsNumber', { configurable: true,
      get() { const s = aNumStr(nget(el)); return s === '' ? NaN : Number(s); },
      set(v) { nset(el, deNum(v)); } });
    nset(el, deNum(v0));
  }

  function esImporte(el) {
    if (el.dataset.sinMiles != null || el.hasAttribute('max')) return false;
    const txt = [el.id, el.name, el.getAttribute('data-field'), el.placeholder, el.title].filter(Boolean).join(' ').toLowerCase();
    if (txt.split(/[^a-záéíóúñ]+/).some(t => EXCL.has(t))) return false;
    const idt = (el.id || el.getAttribute('data-field') || '').toLowerCase().split(/[^a-z]+/).filter(Boolean);
    return !(idt.length && idt[idt.length - 1] === 'min');           // …_min = minutos
  }

  function revisar(n) {
    if (!n || n.nodeType !== 1) return;
    const lista = n.tagName === 'INPUT' ? [n]
      : (n.querySelectorAll ? n.querySelectorAll('input[type="number"], input[inputmode="decimal"]') : []);
    for (const el of lista) {
      if (el._miles || el._milesNo) continue;
      const tipo = (el.getAttribute('type') || 'text').toLowerCase();
      if (tipo === 'number') { if (esImporte(el)) subirNumero(el); else el._milesNo = true; }
      else if (tipo === 'text' && el.getAttribute('inputmode') === 'decimal' && el.dataset.sinMiles == null) wire(el);
      else el._milesNo = true;
    }
  }

  // En captura sobre el documento: corre ANTES que el oninput del propio campo.
  document.addEventListener('input', ev => { const el = ev.target; if (el && el._miles) reformatear(el, ev); }, true);
  document.addEventListener('focusin', ev => revisar(ev.target), true);
  try {
    new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) revisar(n); })
      .observe(document.documentElement, { childList: true, subtree: true });
  } catch (_) {}
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => revisar(document.body));
  else revisar(document.body);

  return { wire, subirNumero, revisar, fmtTexto, aNumStr, deNum };
})();

  function armar() {

  // (28-oct, JP: "una voz que sea la más parecida a la de Claudia") mujer, argentina primero. Cada equipo tiene voces distintas:
  // se usa la primera de esta lista que exista; la persona puede elegir otra en el panel (queda guardada en ese equipo).
  // (28-oct) Voz elegida por JP con la galería (hub/voces.html), una por sistema, todas a velocidad 1.1:
  //   PC (Windows): Microsoft Helena (España), tono 1.0 · iPhone: Paulina (México), tono 0.7 · Android: español de Estados Unidos, tono 1.1.

  const PREFERIDAS = ['helena', 'laura', 'elvira', 'mónica', 'monica', 'google español', 'elena', 'dalia', 'paloma', 'sabina', 'paulina', 'google español de estados unidos'];
  const AJUSTES = { pc: { velocidad: 1.1, tono: 1.0 }, ios: { velocidad: 1.1, tono: 0.7 }, android: { velocidad: 1.1, tono: 1.1 } };
  function plataforma() {
    const ua = navigator.userAgent || '';
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document)) return 'ios';

  function vocesEs() { try { return speechSynthesis.getVoices().filter((v) => /^es/i.test(v.lang)); } catch (_) { return []; } }
  function voz() {
    const vs = vocesEs(); if (!vs.length) return null;
    const pl = plataforma();
    if (pl === 'ios') { const v = vs.find((x) => /paulina/i.test(x.name)) || vs.find((x) => /m[oó]nica/i.test(x.name)); if (v) return v; }
    if (pl === 'android') { const us = vs.filter((x) => /^es[-_]us$/i.test(x.lang)); if (us.length) return us.find((x) => x.localService) || us[0]; }
    // palabra entera: "helena" no es "elena"
    const pts = (v) => { const n = v.name.toLowerCase(); const i = PREFERIDAS.findIndex((p) => new RegExp('(^|[^a-záéíóúñ])' + p + '($|[^a-záéíóúñ])').test(n)); return (i < 0 ? 0 : 100 - i * 5) + (v.lang === 'es-AR' ? 30 : 0) + (v.localService ? 0 : 2); };

})();

window.ADORNO_SSO = (function () {
  var KEY = 'adorno-auth', DEV = 'adorno-equipo-confiable', MOD = 'adorno-modulo-';

    var _p = _t ? JSON.parse(atob(_t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) : null;
    if (_p && String(_p.iss || '').indexOf('jfwtiagteuwmyvblgwms') < 0 && _p.ref !== 'jfwtiagteuwmyvblgwms') del(KEY);
  } catch (e) {}

    KEY: KEY,

    migrar: function (keyVieja, modulo) {
      if (!keyVieja) return;

      if (!v) return;
      // La sesión se copia una sola vez; la marca del módulo se pone siempre

      if (!get(KEY)) set(KEY, v);

    confiar: function (si) { si ? set(DEV, '1') : del(DEV); },

    entraDirecto: function (modulo, email) {

    olvidarModulos: function () {

      } catch (e) {}

/* APP */
/* (13-oct-2026, JP) cabecera como la de Compras: banner del color del módulo, íconos blancos,

.header { background: var(--primary); color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }

.header-right { display: flex; gap: 2px; align-items: center; flex: none; }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -5px; }
.ico.s { width: 16px; height: 16px; vertical-align: -3px; }
.hbtn { display: flex; align-items: center; height: 34px; padding: 0 7px; border: none; border-radius: 9px; background: transparent; color: #fff; opacity: .85; cursor: pointer; font-family: inherit; font-size: 13px; white-space: nowrap; text-decoration: none; transition: background .15s, opacity .15s; }
.hbtn:hover { background: rgba(255,255,255,.18); opacity: 1; }
.hbtn .lb { max-width: 0; overflow: hidden; opacity: 0; margin-left: 0; transition: max-width .25s ease, opacity .18s, margin-left .25s; }
.hbtn:hover .lb { max-width: 160px; opacity: 1; margin-left: 6px; }
.hsep { width: 1px; height: 22px; background: rgba(255,255,255,.35); margin: 0 6px; flex: none; }
.btn-icon { background: white; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.btn-secondary:hover { background: #f3f4f6; }

/* Nav tabs (unificadas dentro del header) */
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; margin: 0 10px; justify-content: flex-end; align-items: center; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { display: flex; align-items: center; height: 34px; padding: 0 7px; border: none; border-radius: 9px; background: transparent; color: #fff; opacity: .85; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .15s, opacity .15s; }
.tabs button .lb { max-width: 0; overflow: hidden; opacity: 0; margin-left: 0; transition: max-width .25s ease, opacity .18s, margin-left .25s; }
.tabs button:hover .lb, .tabs button.active .lb { max-width: 170px; opacity: 1; margin-left: 6px; }
.tabs button:hover { background: rgba(255,255,255,.18); opacity: 1; }
.tabs button.active { background: #fff; color: var(--primary-dark); opacity: 1; font-weight: 700; }
.tabs .badge { background: #dc2626; color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 11px; margin-left: 5px; font-weight: 700; }
.kebab-tabs-btn { display: none; }
@media (max-width: 900px) {
  .kebab-tabs-btn { display: flex; }
  .tabs { display: none; position: absolute; top: calc(100% + 4px); right: 8px; left: auto;
    background: white; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); flex-direction: column; padding: 6px;
    z-index: 200; margin: 0; min-width: 210px; overflow: visible; }
  .tabs.open { display: flex; }
  .tabs button { justify-content: flex-start; color: var(--text); opacity: 1; border-left: 3px solid transparent; border-radius: 6px; height: auto; padding: 10px 12px; }
  .tabs button .lb { max-width: none; opacity: 1; margin-left: 8px; }
  .tabs button:hover { background: #fafafa; }
  .tabs button.active { border-left-color: var(--primary); background: #fff7ed; color: var(--primary-dark); }
  .header-sub { display: none; }
}

main { padding: 16px; max-width: 1400px; margin: 0 auto; }

/* Saldos por grupo */
.grupo { margin-bottom: 22px; }
.grupo-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding: 0 4px; }

.cuenta-card { background: white; border-radius: 10px; padding: 14px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); cursor: pointer; transition: transform 0.1s; }

.cuenta-card .cuenta-moneda { font-size: 11px; color: var(--muted); }

/* Total */
.total-card { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
.total-card .label { font-size: 12px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; }
.total-card .value { font-size: 30px; font-weight: 800; margin-top: 4px; }

/* Tabla movimientos */
.toolbar { background: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; box-shadow: var(--shadow); }
.toolbar select, .toolbar input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: white; }
.toolbar input { min-width: 180px; }
.toolbar .spacer { flex: 1; }
.toolbar button.primary { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.toolbar button.primary:hover { background: var(--primary-dark); }
/* (13-oct-2026, JP) barras en un solo renglón: controles chicos, botones solo ícono con tooltip */
.toolbar.compacta { padding: 8px 10px; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.toolbar.compacta::-webkit-scrollbar { display: none; }
.toolbar.compacta select, .toolbar.compacta input { padding: 6px 8px; font-size: 12.5px; min-width: 0; }
.toolbar.compacta input[type=date] { width: 128px; }
.toolbar.compacta input[type=search] { flex: 1; min-width: 150px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: white; color: var(--text); cursor: pointer; flex: none; padding: 0; }
.ibtn:hover { background: #f3f4f6; }
.ibtn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.ibtn.primary:hover { background: var(--primary-dark); }
.ibtn .ico { width: 18px; height: 18px; }
.ibtn .ico.s { width: 15px; height: 15px; }
.ayuda { display: inline-flex; color: var(--muted); cursor: help; vertical-align: middle; }
.form-grid.compacta { gap: 8px 10px; }
.form-grid.compacta .form-row label { font-size: 11px; margin-bottom: 2px; }
.form-grid.compacta .form-row input, .form-grid.compacta .form-row select, .form-grid.compacta .form-row textarea { padding: 6px 9px; font-size: 13px; }
.form-grid.compacta .form-row textarea { min-height: 40px; }
.form-grid.compacta .btn-secondary { padding: 6px 8px; font-size: 12.5px; }
.pp-fila { display: grid; grid-template-columns: 84px 1fr 130px auto; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #f3f4f6; border-left: 4px solid transparent; cursor: pointer; }
.pp-fila:nth-child(even) { background: #fafafa; }
.pp-fila:hover { background: #fff7ed; }
.pp-bar { height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; max-width: 220px; flex: 1; }
.pp-bar > div { height: 100%; background: var(--primary); }
/* (27-oct, JP) Formulario de pagos pendientes · diseño B */
.pp-in { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; background: #fff; font-family: inherit; color: var(--text); }
.pp-in:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px #fde68a; }
.pp-lbl { font-size: 12.5px; color: #374151; font-weight: 600; margin-bottom: 4px; }
.pp-band { background: var(--primary-light); border: 1px solid #fcd34d; border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0,1fr) 84px 150px; gap: 10px; align-items: end; }
.pp-band-lbl { font-size: 12px; color: #92400e; font-weight: 700; margin-bottom: 4px; }
.pp-band .pp-in { border-color: #fcd34d; }
.pp-in-big { font-size: 22px; font-weight: 700; padding: 5px 10px; font-variant-numeric: tabular-nums; color: #78350f; }
.pp-form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 12px; }
.pp-sub { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; background: #f8fafc; border-radius: 8px; padding: 10px; }
.pp-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.pp-chip { position: relative; display: inline-flex; align-items: center; gap: 5px; border: 1px solid #d1d5db; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; background: #fff; color: #374151; user-select: none; }
.pp-chip:hover { background: #fff7ed; border-color: #fcd34d; }
.pp-chip:has(input:checked) { background: #fde68a; border-color: var(--primary); color: #78350f; font-weight: 700; }
.pp-chip input[type=checkbox] { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.pp-chip:focus-within { box-shadow: 0 0 0 3px #fde68a; }
.pp-chips .pp-chip-sel select { border: none; background: transparent; font-size: 12.5px; padding: 0 2px; cursor: pointer; color: inherit; font-family: inherit; width: auto; min-width: 0; max-width: 170px; height: auto; box-shadow: none; }
@media (max-width: 520px) {
  .pp-band { grid-template-columns: 1fr 1fr; }
  .pp-band-imp { grid-column: 1 / -1; }
  .pp-form2, .pp-sub { grid-template-columns: 1fr; }
}
/* línea de tiempo de las partes */
.pp-tl { position: relative; display: grid; margin: 8px 0 10px; }
.pp-tl-line, .pp-tl-ok { position: absolute; top: 10px; height: 3px; border-radius: 2px; }
.pp-tl-line { background: #e5e7eb; }
.pp-tl-ok { background: var(--green); }
.pp-tl-it { position: relative; text-align: center; padding: 0 3px; min-width: 0; }
.pp-tl-dot { width: 22px; height: 22px; border-radius: 50%; margin: 0 auto; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #fff; }
.pp-tl-dot.ok { background: var(--green); color: #fff; }
.pp-tl-dot.prox { border: 3px solid var(--primary); }
.pp-tl-dot.fut { border: 2px dashed #cbd5e1; }
.pp-tl-dot.duda { background: var(--primary); color: #fff; }
.pp-tl-dot.canc { background: #e5e7eb; color: #6b7280; }
.pp-tl-nom { font-size: 11.5px; margin-top: 4px; color: #374151; line-height: 1.25; overflow-wrap: anywhere; }
.pp-tl-det { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pp-tl-it.prox .pp-tl-nom, .pp-tl-it.prox .pp-tl-det { color: #92400e; font-weight: 700; }
.pp-tl-it.canc { opacity: .6; }
.pp-parte-fila { display: grid; grid-template-columns: minmax(0,1fr) 52px 108px 128px 22px; gap: 6px; align-items: center; margin-bottom: 5px; }
@media (max-width: 520px) {
  .pp-parte-fila { grid-template-columns: 56px minmax(0,1fr) 22px; padding-bottom: 6px; border-bottom: 1px dashed #fde68a; }
  .pp-parte-fila > :first-child { grid-column: 1 / -1; }
  .pp-parte-fila > input[type=date] { grid-column: 1 / 3; }
}
.bot-fila { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-bottom: 1px solid #f3f4f6; flex-wrap: wrap; }
.bot-fila:last-child { border-bottom: none; }
/* (v109) bot corriendo: punto que late + robot que "trabaja" + barra indeterminada */
.mov-pag { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-wrap: wrap; } .mov-pag .ibtn[disabled] { opacity: .35; pointer-events: none; }
.bot-fila.corriendo { background: linear-gradient(90deg, #eff6ff 0%, #fff 60%); }
.bot-dot.run { background: #2563eb !important; box-shadow: 0 0 0 0 rgba(37,99,235,.55); animation: botPulso 1.3s ease-out infinite; }
@keyframes botPulso { 0% { box-shadow: 0 0 0 0 rgba(37,99,235,.55); } 70% { box-shadow: 0 0 0 8px rgba(37,99,235,0); } 100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); } }
.bot-robot { display: inline-block; font-size: 15px; line-height: 1; margin-right: 2px; animation: botTrabaja 1.1s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes botTrabaja { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(8deg) translateY(-2px); } }
.bot-barra { position: relative; height: 3px; border-radius: 2px; background: #dbeafe; overflow: hidden; margin-top: 5px; max-width: 260px; }
.bot-barra::after { content: ''; position: absolute; left: -40%; top: 0; height: 100%; width: 40%; border-radius: 2px; background: #2563eb; animation: botBarra 1.4s linear infinite; }
@keyframes botBarra { from { left: -40%; } to { left: 100%; } }
.bot-corriendo-txt { color: #1d4ed8; font-weight: 600; }
.bot-corriendo-txt .pts::after { content: ''; animation: botPuntos 1.5s steps(4, end) infinite; }
@keyframes botPuntos { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
@media (prefers-reduced-motion: reduce) { .bot-robot, .bot-dot.run, .bot-barra::after, .bot-corriendo-txt .pts::after { animation: none; } }

.table-wrap { background: white; border-radius: 10px; box-shadow: var(--shadow); overflow: auto; }

/* Forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; font-family: inherit;
}

.form-row.full { grid-column: 1 / -1; }

.card { background: white; border-radius: 10px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card-title { font-size: 14px; font-weight: 700; margin: 0 0 12px; color: var(--text); }

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .header-title { font-size: 16px; }
  main { padding: 10px; }
}

<script>

const SUPA_URL = 'https://jfwtiagteuwmyvblgwms.supabase.co';

}
const SUPA_KEY = 'sb_publishable_udSPma98Sw9eskeeLCgdCw_S2vIX0Fk';
ADORNO_SSO.migrar('tesoreria-adorno-auth', 'tesoreria');

// (SSO) Envolver login/logout una sola vez cubre todas las pantallas del

(function (mod) {

let session = null;  // { user, email, rol, empleadoData, localGerencia }
let currentTab = 'dashboard';

// Cache global de datos para no re-fetchear todo el tiempo
let _cuentas = [];
let _categorias = [];

const fmt$ = (n, moneda) => {
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Number(n||0));
  const prefix = moneda === 'USD' ? 'U$D ' : '$ ';
  // Con centavos, como los muestra el banco (jul 2026)
  return sign + prefix + abs.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
// (27-oct, JP) Fichas de Saldos sin centavos (redondeado). Movimientos y el resto siguen con fmt$.
const fmtSaldo = (n, moneda) => {
  const r = Math.round(Number(n || 0));
  const prefix = moneda === 'USD' ? 'U$D ' : '$ ';
  return (r < 0 ? '-' : '') + prefix + Math.abs(r).toLocaleString('es-AR', { maximumFractionDigits: 0 });
};
const fmtFecha = d => {
  if (!d) return '—';
  const dt = new Date(d.length === 10 ? d + 'T12:00:00' : d);
  // (2-sep, pedido JP) SIEMPRE dd/mm/aaaa en las grillas del módulo
  return dt.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const escHtml = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// (2-sep, pedido JP) Importes con separador de miles TAMBIÉN al cargar:
// el campo es texto, al salir se formatea "1.234.567,89" y al entrar vuelve
// a número editable. nmParse entiende es-AR (puntos miles, coma decimal),
// el "1234.56" tipeado con punto decimal, y el signo negativo.
const nmParse = v => {
  v = String(v ?? '').trim().replace(/\$|\s/g, '');
  if (!v || v === '-') return 0;
  if (!v.includes(',')) {
    const m = v.match(/^(-?\d+)\.(\d{1,2})$/);   // "1234.56" = decimal
    if (m) return Number(v) || 0;
  }
  return Number(v.replace(/\./g, '').replace(',', '.')) || 0;
};
const nmShow = n => { n = Number(n) || 0; return n === 0 ? '' :
  n.toLocaleString('es-AR', { maximumFractionDigits: 2 }); };
function wireImporte(el) {
  if (!el || el._wireImp) return;
  el._wireImp = true;
  // (1-oct-2026) miles en vivo: ya no se quitan los puntos al entrar al campo (ADORNO_MILES)
  if (window.ADORNO_MILES) ADORNO_MILES.wire(el);
  el.addEventListener('focus', () => { el.select?.(); });
  el.addEventListener('blur',  () => { el.value = nmShow(nmParse(el.value)); });
  if (el.value) el.value = nmShow(nmParse(el.value));
}
// 🚨 En hora argentina (UTC−3), `new Date().toISOString()` ya devuelve el día
// SIGUIENTE a partir de las 21:00. Los locales cierran 21/22 hs, así que la
// cajera que cargaba un comprobante a las 21:30 lo grababa con fecha de mañana
// y le descuadraba la caja del día. Ventas ya usaba esta versión (index.html
// ~548); Tesorería había quedado con la de UTC.
const hoyISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Argentina/Buenos_Aires' }).format(new Date());

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  setTimeout(() => { t.className = ''; }, 2800);
}

// ═══════════════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════════════
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Faltan datos'; return; }
  document.getElementById('login-btn').disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    await initSession();
  } catch (e) {
    errEl.textContent = e.message || 'No se pudo entrar';
    document.getElementById('login-btn').disabled = false;
  }
}

async function logout() {
  await sb.auth.signOut();
  session = null;
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
}

async function initSession() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return false;
  // Buscar rol del usuario en rrhh_usuarios
  const { data: u } = await sb.from('rrhh_usuarios')
    .select('rol, empleado_id, local_gerencia, activo')
    .eq('auth_user_id', user.id)
    .maybeSingle();
  if (!u || !u.activo) {
    alert('Tu usuario no tiene acceso a Tesorería.');
    await logout();
    return false;
  }
  session = {
    user, email: user.email,
    rol: u.rol,
    empleado_id: u.empleado_id,
    localGerencia: u.local_gerencia,
    // verTodo: admin OR encargada de oficina (manejan toda la administración)
    verTodo: (u.rol === 'admin') || (u.rol === 'gerente' && u.local_gerencia === 'oficina'),
  };
  // ── Cajeras designadas (jul 2026) ──
  // Una empleada (rol 'empleado') solo entra si está en tesoreria_cajeras:
  // la RPC devuelve su local; para el resto de las empleadas devuelve null.
  if (u.rol === 'empleado') {
    // (10-ago) Marisa/Analía son rol empleado pero admin-oficina por email
    // (mismo par que tesoreria_es_admin_oficina() en la DB) — no son cajeras
    // y no deben caer en el logout.
    const _ADMIN_OF = ['marisaisabel07@yahoo.com.ar', 'rivera.analia.leon@gmail.com', 'administracion@claudiaadorno.com', 'claudiaadorno@claudiaadorno.com'];
    if (!_ADMIN_OF.includes((session.email || '').toLowerCase())) {
      const { data: cajLocal } = await sb.rpc('tesoreria_cajera_local');
      if (cajLocal) {
        session.localGerencia = cajLocal;
        session.esCajera = true;
      } else {
        // (9-sep, JP) Cualquier empleada entra, pero SOLO para subir una
        // factura/ticket o un depósito de la caja de su local (sin recibos,
        // sin saldos, sin movimientos). RPC tesoreria_mi_caja() → su caja.
        const { data: caja } = await sb.rpc('tesoreria_mi_caja');
        const mi = Array.isArray(caja) ? caja[0] : caja;
        if (!mi) {
          alert('Tu usuario no tiene acceso a Tesorería.');
          await logout();
          return false;
        }
        session.localGerencia = mi.local;
        session.miCaja = mi;
        session.soloComprobantes = true;
      }
    }
  }
  // Usuario genérico de local (alcorta@/unicenter@, gerente sin legajo):
  // también solo comprobantes en la pestaña de carga (los recibos exigen legajo).
  if (u.rol === 'gerente' && !u.empleado_id && u.local_gerencia !== 'oficina') {
    session.soloComprobantes = true;
  }
  enterApp();
  return true;
}

function enterApp() {
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('hdr-sub').textContent = '· ' + (
    session.rol === 'admin' ? 'Admin' :  // (13-oct, JP) sin el mail: empujaba los íconos del header
    session.localGerencia === 'oficina' ? 'Oficina (admin)' :
    session.esCajera ? 'Cajera · ' + (session.localGerencia || '') :
    (session.soloComprobantes && session.miCaja) ? 'Comprobantes · ' + (session.localGerencia || '') :
    'Encargada · ' + (session.localGerencia || '')
  );
  // (9-sep) la pestaña de carga se llama según lo que puede hacer el usuario
  // (13-oct, JP) la pestaña se llama Comprobantes para todos
  { const b = document.getElementById('tab-cargar'); b.querySelector('.lb').textContent = 'Comprobantes'; b.title = 'Comprobantes'; }
  // ── Visibilidad de tabs por rol ──
  // "Oficina" = admin, gerente de oficina, o Marisa/Analía (mismo par de
  // emails que tesoreria_es_admin_oficina() en la DB — mantener sincronizado).
  const ADMIN_OFICINA_EMAILS = ['marisaisabel07@yahoo.com.ar', 'rivera.analia.leon@gmail.com', 'administracion@claudiaadorno.com', 'claudiaadorno@claudiaadorno.com'];
  session.esOficina = session.verTodo ||
    ADMIN_OFICINA_EMAILS.includes((session.email || '').toLowerCase());
  if (session.esOficina) {
    // Oficina ve Pendientes y Bots (display explícito, a prueba de caches viejas)
    document.getElementById('tab-pendientes').style.display = '';
    document.getElementById('tab-scrapers').style.display = '';
    // (6-ago, JP) Recibos SÍ se ve desde admin / Oficina / Marisa / Analía.
    // Lo que hay que bloquear son vendedoras y usuarios genéricos de local,
    // para que no puedan tocar la caja (ver rama de abajo).
    document.getElementById('tab-cargar').style.display = '';

    document.getElementById('tab-firma').style.display = 'none';
  } else {
    // Locales: solo Saldos + Movimientos (+ Recibos según quién sea).
    // TODO explícito: si antes entró un admin en este mismo navegador, los
    // tabs quedaban prendidos de la sesión anterior (bug 30-jul).
    document.getElementById('tab-pendientes').style.display = 'none';
    document.getElementById('tab-scrapers').style.display = 'none';
    // Quiénes NO pueden tocar la caja:
    //   · usuario GENÉRICO del local (gerente sin empleada asociada,
    //     ej: alcorta@ / unicenter@)
    //   · vendedoras (rol 'empleado' que no sea cajera)
    // Sí la manejan: encargadas (gerente con empleada) y cajeras.
    const generico = session.rol === 'gerente' && !session.empleado_id;
    const vendedora = session.rol === 'empleado' && !session.esCajera;
    // (9-sep, JP) todos pueden CARGAR — genéricos y vendedoras solo
    // factura/ticket o depósito (ver renderCargar); recibos = cajeras/encargadas.
    document.getElementById('tab-cargar').style.display = '';
    // (10-ago) Pendientes firma solo para quien hace recibos
    document.getElementById('tab-firma').style.display =
      (generico || vendedora) ? 'none' : '';
    // Vendedora: NO ve saldos ni movimientos — entra directo a Comprobantes
    document.getElementById('tab-dashboard').style.display = vendedora ? 'none' : '';
    document.getElementById('tab-movimientos').style.display = vendedora ? 'none' : '';
    if (vendedora) {
      currentTab = 'cargar';
      document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'cargar'));
    }
  }
  // (22-sep) el push de "transferencia recibida" abre directo la pestaña
  if (new URLSearchParams(location.search).get('tab') === 'transferencias') {
    currentTab = 'transferencias';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === 'transferencias'));
  }
  cargar();
  actualizarBtnNotifs();
}

// ═══════════════════════════════════════════════════════════════════════
// CARGAR DATOS BASE (cuentas + categorías)
// ═══════════════════════════════════════════════════════════════════════
async function cargar() {
  document.getElementById('refresh-btn').innerHTML = '<span class="spinner"></span>';
  try {
    // Saldos por cuenta (la RLS filtra para gerente)
    const { data: saldos } = await sb.from('tesoreria_saldos').select('*');
    _cuentas = saldos || [];
    // (13-oct, JP) hora del último saldo informado por el banco/MP/PPI, para avisar si está viejo
    try {
      const { data: hs } = await sb.from('tesoreria_cuentas').select('id,saldo_banco_at');
      const mapa = Object.fromEntries((hs || []).map(x => [x.id, x.saldo_banco_at]));
      _cuentas.forEach(c => { c.saldo_banco_at = mapa[c.id] || null; });
    } catch (_) {}
    // Categorías
    const { data: cats } = await sb.from('tesoreria_categorias')
      .select('*').eq('activa', true).order('orden_display');
    _categorias = cats || [];
    renderTab(currentTab);
    refrescarBadgePagosPendientes();
  } catch (e) {
    document.getElementById('contenido').innerHTML = `<div class="empty"><div class="icon">⚠️</div>Error: ${escHtml(e.message)}</div>`;
  } finally {
    document.getElementById('refresh-btn').innerHTML = '↻';
  }
}

function toggleTabsMenu(ev) {
  ev.stopPropagation();
  document.getElementById('tabs').classList.toggle('open');
}
document.addEventListener('click', () => {
  document.getElementById('tabs')?.classList.remove('open');
});

function cambiarTab(tab) {
  document.getElementById('tabs').classList.remove('open');
  currentTab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderTab(tab);
}

function renderTab(tab) {
  if (tab === 'dashboard')   return renderDashboard();
  if (tab === 'movimientos') return renderMovimientos();
  if (tab === 'cargar')      return renderCargar();
  if (tab === 'firma')       return renderPendientesFirma();
  if (tab === 'pendientes')  return renderPagosPendientes();
  if (tab === 'scrapers')    return renderScrapers();
  if (tab === 'transferencias') return renderTransferencias();
}

// ═══════════════════════════════════════════════════════════════════════
// 💸 TRANSFERENCIAS RECIBIDAS EN EL CVU DE MP (22-sep, pedido JP)
// Los locales necesitan saber si el cliente ya transfirió para entregarle.
// Las cuentas colaboradoras de MP no ven la cuenta madre; acá sí: la RPC
// devuelve solo hora / importe / código, sin saldos. MP NO informa quién
// transfirió, así que el match es por importe y hora contra el comprobante
// que muestra el cliente. "✔ Es mía" evita que dos locales entreguen contra
// la misma transferencia.
// ═══════════════════════════════════════════════════════════════════════
async function renderTransferencias() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  const { data, error } = await sb.rpc('tesoreria_transferencias_recibidas', { p_dias: 2 });
  if (error) { cont.innerHTML = `<div class="empty">Error: ${escHtml(error.message)}</div>`; return; }
  const filas = data || [];
  const miLocal = session.localGerencia || session.local || '';
  cont.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <h2 style="margin:0;font-size:17px;">💸 Transferencias recibidas en Mercado Pago <span style="font-size:12px;color:var(--muted);font-weight:500;">últimas 48 h</span></h2>
        <span class="ayuda" title="Lo que entró al CVU/alias de la empresa en las últimas 48 horas (no los cobros por QR ni Point, esos los ven en su cuenta). MP no informa quién transfirió: comparalo con el comprobante del cliente por importe y hora. Las transferencias entran solas cada 15 minutos y desaparecen de esta lista cuando un local toca ✔ Es mía o a las 48 horas. Si el cliente dice que ya transfirió y no aparece, tocá Verificar ahora: consulta Mercado Pago en el momento."><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
      </div>
      <button class="ibtn primary" id="btn-verif-transf" onclick="verificarTransferenciasAhora()" title="Verificar ahora: consulta Mercado Pago en el momento"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg></button>
    </div>
    ${filas.length === 0 ? '<div class="empty"><div class="icon">💸</div>No hay transferencias libres en las últimas 48 horas (las que ya se reclamaron con ✔ Es mía no se muestran).</div>' : `
    <div class="tabla-wrap"><table class="tabla">
      <thead><tr><th>Fecha</th><th>Hora</th><th style="text-align:right;">Importe</th><th>Código</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        ${filas.map(t => {
          const rec = t.reclamado_local;
          const estado = rec
            ? `<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:999px;font-size:12px;">✔ ${escHtml(rec.toUpperCase())}</span> <span style="font-size:12px;color:var(--muted);">${escHtml(t.reclamo_nota||'')}</span>`
            : `<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:999px;font-size:12px;">libre</span>`;
          const btn = !rec ? `<button class="btn-secondary" style="padding:4px 10px;" onclick="reclamarTransferencia(${t.id}, ${t.importe})">✔ Es mía</button>` : '';
          return `<tr>
            <td>${fmtFecha(t.fecha)}</td>
            <td style="font-family:monospace;">${escHtml(t.hora||'')}</td>
            <td style="text-align:right;font-family:monospace;font-weight:700;">${fmt$(t.importe)}</td>
            <td style="font-family:monospace;font-size:12px;" title="Código de la transferencia — figura en el comprobante del cliente">${escHtml(t.codigo||'')}</td>
            <td>${estado}</td>
            <td>${btn}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`}
    `;
}

async function verificarTransferenciasAhora() {
  const b = document.getElementById('btn-verif-transf');
  if (b) { b.disabled = true; b.style.opacity = '.5'; b.title = 'Consultando MP…'; }
  try {
    const { data, error } = await sb.functions.invoke('sync-mp-on-demand', { body: { minutes_back: 180 } });
    if (error) throw error;
    toast(`MP consultado · ${data?.sincronizados || 0} pago(s) actualizados`);
  } catch (e) {
    toast('No pude consultar MP: ' + (e.message || e), true);
  }
  renderTransferencias();
}

async function reclamarTransferencia(id, importe) {
  const nota = prompt(`Transferencia de ${fmt$(importe)}.\n\n¿De qué cliente es / qué se llevó?\n\nQueda registrada a nombre de tu local y DESAPARECE de esta lista para todos (el otro local ya no la ve).`, '');
  if (nota === null) return;
  const { data, error } = await sb.rpc('tesoreria_transferencia_reclamar', { p_id: id, p_nota: nota });
  if (error) { alert('No se pudo reclamar: ' + error.message); return; }
  toast(`Reclamada para ${(data?.local||'').toUpperCase()} ✓ · ya no aparece en la lista`);
  renderTransferencias();
}

      <div style="font-size:13px;font-weight:600;color:#92400e;">📝 ${pend.length} egreso(s) pendiente(s) de firma</div>
      <div style="font-size:12px;color:#a16207;margin-top:4px;">
        Generá el PDF, firmalo y mandalo por mail a <strong>claudiaadornosrl@gmail.com</strong>.
        El sistema lo va a detectar por el QR y marcar como firmado (entonces afecta el saldo).
      </div>

    ${pend.map(m => `

        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">

async function cancelarMovimiento(id, impresoEl) {
  // El motivo NO es decorativo: queda en tesoreria_movimientos_borrados, que es
  // el único rastro que va a quedar de este comprobante. La RPC lo exige.
  const aviso = impresoEl
    ? '\n\n🖨 OJO: este recibo ya se imprimió el ' + new Date(impresoEl).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) +
      '.\nSi el papel firmado ya salió para Oficina, avisales — si no, rompelo.'
    : '';
  const motivo = prompt('¿Por qué anulás este comprobante?\n\nEl movimiento desaparece y la caja vuelve como estaba.' + aviso + '\n\nMotivo (obligatorio):');
  if (motivo === null) return;
  if (!motivo.trim()) { toast('Hace falta el motivo', true); return; }
  try {
    const { data, error } = await sb.rpc('tesoreria_cancelar_movimiento', { p_mov_id: id, p_motivo: motivo });
    if (error) throw error;
    if (data && data.ok === false) { toast(data.msg || 'No se pudo anular', true); return; }
    toast('✓ ' + ((data && data.codigo) ? data.codigo + ' anulado' : 'Anulado'));
    await cargar();                 // los saldos cambian: hay que releerlos
    renderPendientesFirma();
  } catch (e) { toast('Error: ' + e.message, true); }
}

// PDF: comprobante de egreso con QR
// ═══════════════════════════════════════════════════════════════════════
// (9-sep) Tipografía institucional (URW Gothic = Avant Garde) para el logo del
// comprobante, igual que en los recibos de RRHH. Vive en fonts/ del repo (y en
// el cache del SW); si no se puede cargar, cae a helvetica bold como antes.
let _fuenteAdornoOk = false;
async function _loadFuenteAdorno(doc) {
  try { if (doc.getFontList && doc.getFontList()['AdornoTitulo']) return true; } catch (_) {}
  try {
    const r = await fetch('./fonts/URWGothic-Book.ttf');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const bytes = new Uint8Array(await r.arrayBuffer());
    let bin = ''; for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
    doc.addFileToVFS('AdornoTitulo.ttf', btoa(bin));
    doc.addFont('AdornoTitulo.ttf', 'AdornoTitulo', 'normal');
    _fuenteAdornoOk = true;
    return true;
  } catch (e) { console.warn('Fuente institucional no disponible, fallback helvetica', e); return false; }
}

async function generarPDFEgreso(movId) {
  // Cargar movimiento + cuenta + categoría
  const { data: m, error } = await sb.from('tesoreria_movimientos_view')
    .select('*').eq('id', movId).single();
  if (error || !m) { toast('No se pudo cargar el movimiento', true); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, margen = 18;
  const conFuente = await _loadFuenteAdorno(doc);

  // Header con logo de marca
  doc.setFillColor(245, 158, 11);  // amber
  doc.rect(0, 0, W, 4, 'F');

  if (conFuente) doc.setFont('AdornoTitulo', 'normal'); else doc.setFont('helvetica', 'bold');
  doc.setFontSize(24);
  doc.setTextColor(180, 83, 9);
  doc.text('Claudia Adorno', margen, 22);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(100, 100, 100);
  doc.text('CLAUDIA ADORNO SRL · CUIT 30-70967311-0', W - margen, 18, { align: 'right' });
  doc.text('Buenos Aires, Argentina', W - margen, 22, { align: 'right' });

  doc.setDrawColor(245, 158, 11);
  doc.setLineWidth(0.5);
  doc.line(margen, 28, W - margen, 28);

  // Título
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.setTextColor(30, 41, 59);
  doc.text('COMPROBANTE DE EGRESO DE CAJA', W/2, 42, { align: 'center' });

  // Fecha del comprobante (carga, no del egreso)
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(120, 120, 120);
  doc.text(`Buenos Aires, ${new Date().toLocaleDateString('es-AR', { day:'numeric', month:'long', year:'numeric' })}`,
           W - margen, 52, { align: 'right' });

  // Box con datos del movimiento
  let y = 65;
  doc.setDrawColor(226, 232, 240);
  doc.setFillColor(252, 252, 252);
  doc.setLineWidth(0.3);
  doc.roundedRect(margen, y, W - 2*margen, 60, 2, 2, 'FD');

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text('CUENTA', margen + 6, y + 8);
  doc.text('CATEGORÍA', margen + 6, y + 22);
  doc.text('FECHA', margen + 6, y + 36);
  doc.text('IMPORTE', W - margen - 6, y + 8, { align: 'right' });

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(30, 41, 59);
  doc.text(m.cuenta_nombre || '—', margen + 6, y + 14);
  doc.text(m.categoria_nombre || '—', margen + 6, y + 28);
  doc.text(new Date(m.fecha + 'T12:00:00').toLocaleDateString('es-AR', { day:'2-digit', month:'long', year:'numeric' }), margen + 6, y + 42);

  doc.setFontSize(18);
  doc.setTextColor(220, 38, 38);
  doc.text(fmt$(m.importe, m.cuenta_moneda), W - margen - 6, y + 18, { align: 'right' });

  // Descripción
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text('DETALLE', margen + 6, y + 50);
  doc.setFontSize(11);
  doc.setTextColor(30, 41, 59);
  const lineas = doc.splitTextToSize(m.descripcion || 'Sin detalle', W - 2*margen - 12);
  doc.text(lineas, margen + 6, y + 56);

  // Texto de conformidad
  y = 140;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(30, 41, 59);
  const cuerpo = `Por la presente dejo constancia de la salida de $${Math.round(Math.abs(m.importe)).toLocaleString('es-AR')} de la caja "${m.cuenta_nombre}" por el concepto de "${m.categoria_nombre || 'movimiento manual'}".`;
  const lineasCuerpo = doc.splitTextToSize(cuerpo, W - 2*margen);
  doc.text(lineasCuerpo, margen, y, { lineHeightFactor: 1.6 });

  // Firmas
  y = 200;
  doc.setDrawColor(180, 180, 180);
  doc.setLineWidth(0.4);
  doc.line(margen, y + 14, margen + 75, y + 14);
  doc.line(W - margen - 75, y + 14, W - margen, y + 14);

  doc.setFont('helvetica', 'italic');
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text('Firma autorizante', margen + 37, y + 18, { align: 'center' });
  doc.text('Firma receptora del dinero', W - margen - 37, y + 18, { align: 'center' });

  // QR con token único — el sync IMAP lee este token del PDF firmado
  // y matchea con tesoreria_movimientos.qr_token para marcar firmado_at
  try {
    if (typeof qrcode === 'function') {
      // El token va en el QR (UUID inmutable, único por mov).
      // El código de seguimiento humano-legible va al lado del QR.
      const tokenQR = m.qr_token || m.codigo_seguimiento || ('MOV-' + String(m.id).padStart(5, '0'));
      const codigoHumano = m.codigo_seguimiento || ('MOV-' + String(m.id).padStart(5, '0'));
      const qr = qrcode(0, 'M');
      qr.addData('TESORERIA:' + tokenQR);
      qr.make();
      const qrDataUrl = qr.createDataURL(4, 0);
      doc.addImage(qrDataUrl, 'PNG', margen, H - 50, 22, 22);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(120, 120, 120);
      doc.text('CÓDIGO DE SEGUIMIENTO', margen + 26, H - 44);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(180, 83, 9);
      doc.text(codigoHumano, margen + 26, H - 38);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(120, 120, 120);
      doc.text('Una vez firmado, escaneá esta hoja y enviála a', margen + 26, H - 32);
      doc.setFont('helvetica', 'bold');
      doc.text('claudiaadornosrl@gmail.com', margen + 26, H - 28);
      doc.setFont('helvetica', 'normal');
      doc.text('El sistema detecta el QR y lo marca como firmado automáticamente.', margen + 26, H - 24);
    }
  } catch (e) { console.warn('qr:', e); }

  // Footer
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(150, 150, 150);
  doc.text(`Generado automáticamente · ${new Date().toLocaleString('es-AR')} · ${m.codigo_seguimiento || 'MOV-'+m.id}`,
           W/2, H - 8, { align: 'center' });

  const nombreArchivo = `${m.codigo_seguimiento || 'MOV-'+m.id} ${(m.cuenta_nombre||'').replace(/\s+/g,'_')} ${m.fecha}.pdf`;
  doc.save(nombreArchivo);
  // 🚨 (17-sep, JP) Descargar el PDF es el momento en que el comprobante SALE
  // del local: desde acá el papel puede estar en camino a firmar, así que no
  // se edita ni se anula más (lo reabre un rechazo de administración).
  // Se marca una sola vez; volver a bajarlo para reimprimir no corre la fecha.
  if (!m.firmado_at) {
    const { error: eMarca } = await sb.rpc('tesoreria_marcar_pdf_descargado', { p_mov_id: movId });
    if (eMarca) console.warn('No se pudo marcar la descarga:', eMarca.message);
    if (currentTab === 'firma') renderPendientesFirma(); else if (currentTab === 'movimientos') renderMovimientos();
  }
  toast('✓ PDF descargado · firmalo y mandalo por mail');
}

// ═══════════════════════════════════════════════════════════════════════
// DASHBOARD: saldos agrupados
// ═══════════════════════════════════════════════════════════════════════
// (13-oct, JP) "actualizado hace X" en las cuentas que alimenta un bot (banco, MP, PPI, fondos):
//  gris si es reciente, rojo si pasaron más de 12 h (el bot no corrió o falló). Las cajas no lo muestran.
function _actualizadoHace(c){
  if (!c || c._virtual || c.tipo === 'caja' || !c.saldo_banco_at) return '';
  const min = Math.max(0, (Date.now() - new Date(c.saldo_banco_at).getTime()) / 60000);
  const txt = min < 60 ? `hace ${Math.round(min)} min` : min < 48 * 60 ? `hace ${Math.round(min / 60)} h` : `hace ${Math.round(min / 1440)} días`;
  const viejo = min > 12 * 60;
  return ` <span style="font-size:11px;color:${viejo ? '#dc2626' : 'var(--muted)'};font-weight:${viejo ? '700' : '400'};" title="Último saldo informado por el banco/MP: ${new Date(c.saldo_banco_at).toLocaleString('es-AR')}${viejo ? ' · pasaron más de 12 h: revisá el bot' : ''}">· ${viejo ? '⚠ ' : ''}actualizado ${txt}</span>`;
}
function renderDashboard() {
  const cont = document.getElementById('contenido');
  if (_cuentas.length === 0) {
    cont.innerHTML = `<div class="empty"><div class="icon">💰</div>No tenés acceso a ninguna cuenta. Pedile al admin que te dé permisos.</div>`;
    return;
  }
  // Agrupar. (13-oct, JP) la Caja Oficina no va en Saldos: en Oficina no se maneja efectivo
  const grupos = {};
  _cuentas.filter(c => !(c.tipo === 'caja' && c.local === 'oficina')).forEach(c => {
    const g = c.grupo || 'Sin grupo';
    if (!grupos[g]) grupos[g] = [];
    grupos[g].push(c);
  });

  // Calcular total por moneda (solo ARS, para mostrar el "total global" más útil)
  let totalARS = 0, totalUSD = 0;
  _cuentas.forEach(c => {
    if (c.moneda === 'USD') totalUSD += Number(c.saldo || 0);
    else                    totalARS += Number(c.saldo || 0);
  });

  let html = '';
  // Mostrar total general para admin y oficina
  if (session.verTodo) {
    html += `
      <div class="total-card">
        <div class="label">Total general (ARS)</div>
        <div class="value">${fmtSaldo(totalARS, 'ARS')}</div>
        ${totalUSD > 0 ? `<div class="breakdown">+ ${fmtSaldo(totalUSD, 'USD')} en USD</div>` : ''}
      </div>
    `;
  }

  // Tipos que se agrupan visualmente como "Inversiones" (drill-down)
  const TIPOS_INVERSION = ['banco_fondo', 'banco_titulos', 'banco_pf'];

  for (const [grupo, cuentas] of Object.entries(grupos)) {
    // Separar cuentas normales vs inversiones (las inversiones se agrupan en
    // 2 cards virtuales por moneda: "Inversiones ARS" / "Inversiones USD")
    const normales   = cuentas.filter(c => !TIPOS_INVERSION.includes(c.tipo));
    const inversiones = cuentas.filter(c =>  TIPOS_INVERSION.includes(c.tipo));

    // Armar las 2 cards virtuales de inversiones (si hay alguna cuenta de
    // inversión en este grupo).
    const monedasInv = [...new Set(inversiones.map(c => c.moneda))];
    const cardsInversionVirtual = monedasInv.map(moneda => {
      const cuentasMon = inversiones.filter(c => c.moneda === moneda);
      const saldoTotal = cuentasMon.reduce((s, c) => s + Number(c.saldo || 0), 0);
      return {
        _virtual: true,
        _grupo: grupo,
        _moneda: moneda,
        nombre: `Inversiones ${moneda === 'USD' ? 'Dólares' : 'Pesos'}`,
        icono: '💼',
        moneda,
        saldo: saldoTotal,
        color: '#f97316',
      };
    });

    const todas = [...normales, ...cardsInversionVirtual];
    if (!todas.length) continue;

    const subtot = todas.reduce((s, c) => s + Number(c.saldo || 0), 0);
    const moneda = todas[0]?.moneda || 'ARS';
    html += `
      <div class="grupo">
        <div class="grupo-title">${escHtml(grupo)} · subtotal ${fmtSaldo(subtot, moneda)}</div>
        <div class="cuentas-grid">
          ${todas.map(c => {
            const onClick = c._virtual
              ? `verInversionesDe('${escHtml(c._grupo)}','${c._moneda}')`
              : `verMovimientosCuenta(${c.id})`;
            return `
            <div class="cuenta-card" style="border-left-color:${c.color||'#f59e0b'};position:relative;">
              <div onclick="${onClick}" style="cursor:pointer;">
                <div class="cuenta-nombre">${c.icono||'💵'} ${escHtml(c.nombre)} ${c._virtual ? '<span style="font-size:11px;color:var(--muted);">▸</span>' : ''}</div>
                <div class="cuenta-saldo ${Number(c.saldo) < 0 ? 'negativo' : ''}">${fmtSaldo(c.saldo, c.moneda)}</div>
                <div class="cuenta-moneda">${c.moneda}${_actualizadoHace(c)}</div>
              </div>
              ${!c._virtual ? `
                <button onclick="event.stopPropagation();setCuentaDefaultDesdeSaldos(${c.id})"
                  title="${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? 'Quitar como caja predeterminada' : 'Abrir Movimientos siempre en esta caja (este dispositivo)'}"
                  style="position:absolute;top:8px;right:${session.verTodo ? '44px' : '8px'};background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">
                  ${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? '⭐' : '☆'}
                </button>
              ` : ''}
              ${(!c._virtual && session.verTodo) ? `
                <button onclick="event.stopPropagation();abrirActualizarSaldo(${c.id})"
                  title="Actualizar saldo (ancla)"
                  style="position:absolute;top:8px;right:8px;background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--muted);cursor:pointer;">
                  🎯
                </button>
              ` : ''}
            </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }
  cont.innerHTML = html;
}

// ─── Vista intermedia: inversiones de un grupo por moneda ──────────
// Muestra 3 cards (FIMA / Títulos / PF) cuando el usuario clickea
// "Inversiones Pesos" o "Inversiones Dólares" desde el dashboard.
function verInversionesDe(grupo, moneda) {
  const TIPOS_INVERSION = ['banco_fondo', 'banco_titulos', 'banco_pf'];
  const cuentas = _cuentas.filter(c =>
    c.grupo === grupo && c.moneda === moneda && TIPOS_INVERSION.includes(c.tipo)
  );
  const tipoLabel = {
    banco_fondo:   { nombre: 'Fondos FIMA',  icono: '📈' },
    banco_titulos: { nombre: 'Títulos',      icono: '📊' },
    banco_pf:      { nombre: 'Plazo Fijo',   icono: '🔒' },
  };
  // Ordenar: fondos → títulos → PF
  const ordenTipo = { banco_fondo: 1, banco_titulos: 2, banco_pf: 3 };
  cuentas.sort((a, b) => ordenTipo[a.tipo] - ordenTipo[b.tipo]);
  const subtot = cuentas.reduce((s, c) => s + Number(c.saldo || 0), 0);
  const cont = document.getElementById('contenido');
  cont.innerHTML = `
    <div style="margin-bottom:12px;">
      <button class="btn-secondary" onclick="cambiarTab('dashboard')" style="padding:6px 12px;font-size:13px;">‹ Volver</button>
    </div>
    <div class="grupo">
      <div class="grupo-title">${escHtml(grupo)} · Inversiones ${moneda === 'USD' ? 'Dólares' : 'Pesos'} · subtotal ${fmtSaldo(subtot, moneda)}</div>
      <div class="cuentas-grid">
        ${cuentas.map(c => {
          const meta = tipoLabel[c.tipo] || { nombre: c.nombre, icono: '💵' };
          return `
            <div class="cuenta-card" style="border-left-color:${c.color||'#f97316'};position:relative;">
              <div onclick="verMovimientosCuenta(${c.id})" style="cursor:pointer;">
                <div class="cuenta-nombre">${meta.icono} ${escHtml(meta.nombre)}</div>
                <div class="cuenta-saldo ${Number(c.saldo) < 0 ? 'negativo' : ''}">${fmtSaldo(c.saldo, c.moneda)}</div>
                <div class="cuenta-moneda">${c.moneda}${_actualizadoHace(c)}</div>
              </div>
              <button onclick="event.stopPropagation();setCuentaDefaultDesdeSaldos(${c.id})"
                title="${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? 'Quitar como caja predeterminada' : 'Abrir Movimientos siempre en esta caja (este dispositivo)'}"
                style="position:absolute;top:8px;right:${session.verTodo ? '44px' : '8px'};background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">
                ${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? '⭐' : '☆'}
              </button>
              ${session.verTodo ? `
                <button onclick="event.stopPropagation();abrirActualizarSaldo(${c.id})"
                  title="Actualizar saldo (ancla)"
                  style="position:absolute;top:8px;right:8px;background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--muted);cursor:pointer;">
                  🎯
                </button>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function verMovimientosCuenta(cuentaId) {
  _movFiltroCuenta = cuentaId;
  cambiarTab('movimientos');
}

function setCuentaDefaultDesdeSaldos(cuentaId) {
  const actual = localStorage.getItem(LS_CTA_DEFAULT);
  const cta = _cuentas.find(c => c.id === cuentaId);
  if (actual == cuentaId) {
    localStorage.removeItem(LS_CTA_DEFAULT);
    if (_movFiltroCuenta == cuentaId) _movFiltroCuenta = null;
    toast('Ya no hay caja predeterminada');
  } else {
    localStorage.setItem(LS_CTA_DEFAULT, String(cuentaId));
    _movFiltroCuenta = String(cuentaId);
    toast(`⭐ ${cta ? cta.nombre : 'Caja'} quedó como predeterminada en este dispositivo`);
  }
  renderDashboard();  // (10-ago) fix: renderSaldos no existía
}

// ─── Actualizar saldo ancla manual ────────────────────────────────
async function abrirActualizarSaldo(cuentaId) {
  const cuenta = _cuentas.find(c => c.id === cuentaId);
  if (!cuenta) return;
  // Traer ancla actual
  const { data: c } = await sb.from('tesoreria_cuentas')
    .select('saldo_ancla, saldo_ancla_fecha').eq('id', cuentaId).single();
  const ancladaActual = c?.saldo_ancla;
  const fechaActual = c?.saldo_ancla_fecha || hoyISO();

  const html = `
    <div id="modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:white;border-radius:12px;padding:22px;max-width:480px;width:100%;">
        <h3 style="margin:0 0 8px;color:var(--primary-dark);">🎯 Actualizar saldo de ${escHtml(cuenta.nombre)}</h3>
        <p style="font-size:12px;color:var(--muted);margin:0 0 12px;">
          Pegá el saldo REAL que ves en el panel de la cuenta a una fecha concreta.
          El sistema lo usa como punto fijo y suma los movimientos posteriores para calcular el saldo actual.
        </p>
        ${ancladaActual != null ? `
          <div style="background:#f3f4f6;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;">
            <strong>Ancla actual:</strong> ${fmt$(ancladaActual, cuenta.moneda)} al ${fmtFecha(fechaActual)}
          </div>
        ` : `<div style="background:#fef3c7;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;">Sin ancla cargada todavía</div>`}
        <div class="form-row" style="margin-bottom:10px;">
          <label>Saldo real (${cuenta.moneda})</label>
          <input type="number" id="ancla-saldo" step="0.01" value="${ancladaActual ?? ''}" placeholder="Ej: 1234567.89">
        </div>
        <div class="form-row" style="margin-bottom:14px;">
          <label>Fecha del saldo</label>
          <input type="date" id="ancla-fecha" value="${fechaActual}">
        </div>
        <div class="form-actions">
          <button class="btn-secondary" onclick="document.getElementById('modal').remove()">Cancelar</button>
          ${ancladaActual != null ? `<button class="btn-secondary" style="color:#dc2626;" onclick="borrarAncla(${cuentaId})">🗑 Borrar ancla</button>` : ''}
          <button class="btn-primary" style="width:auto;padding:9px 18px;" onclick="guardarAncla(${cuentaId})">💾 Guardar</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function guardarAncla(cuentaId) {
  const saldo = parseFloat(document.getElementById('ancla-saldo').value);
  const fecha = document.getElementById('ancla-fecha').value;
  if (isNaN(saldo) || !fecha) { toast('Saldo y fecha son obligatorios', true); return; }
  const { error } = await sb.from('tesoreria_cuentas').update({
    saldo_ancla: saldo,
    saldo_ancla_fecha: fecha,
    saldo_ancla_actualizado_at: new Date().toISOString(),
    saldo_ancla_por: session.email || 'admin',
  }).eq('id', cuentaId);
  if (error) { toast('Error: ' + error.message, true); return; }
  toast('✓ Saldo ancla actualizado');
  document.getElementById('modal').remove();
  cargar();
}

async function borrarAncla(cuentaId) {
  if (!confirm('¿Borrar el ancla? El saldo va a calcularse solo desde los movimientos.')) return;
  const { error } = await sb.from('tesoreria_cuentas').update({
    saldo_ancla: null,
    saldo_ancla_fecha: null,
    saldo_ancla_actualizado_at: null,
    saldo_ancla_por: null,
  }).eq('id', cuentaId);
  if (error) { toast('Error: ' + error.message, true); return; }
  toast('✓ Ancla borrada');
  document.getElementById('modal').remove();
  cargar();
}

  const m = _movsCache.find(x => x.id === movId);

// Caja predeterminada: se guarda POR DISPOSITIVO (localStorage), así cada
// puesto abre en la caja que más usa (ej: Oficina → Galicia CA Pesos).
const LS_CTA_DEFAULT = 'tesoreria_cuenta_default';
let _movFiltroCuenta = localStorage.getItem(LS_CTA_DEFAULT) || null;
let _movFiltroDesde = null;
let _movFiltroHasta = null;

function toggleCuentaDefault() {
  const actual = localStorage.getItem(LS_CTA_DEFAULT);
  if (_movFiltroCuenta && actual != _movFiltroCuenta) {
    localStorage.setItem(LS_CTA_DEFAULT, _movFiltroCuenta);
    const cta = _cuentas.find(c => c.id == _movFiltroCuenta);
    toast(`⭐ ${cta ? cta.nombre : 'Esta caja'} quedó como predeterminada en este dispositivo`);
  } else {
    localStorage.removeItem(LS_CTA_DEFAULT);
    toast('Ya no hay caja predeterminada — la app abre en "Todas"');
  }
  renderMovimientos();
}

async function renderMovimientos() {
  const cont = document.getElementById('contenido');
  // Defaults: último mes
  if (!_movFiltroDesde) {
    const d = new Date(); d.setMonth(d.getMonth() - 1);
    _movFiltroDesde = d.toISOString().split('T')[0];
  }
  if (!_movFiltroHasta) _movFiltroHasta = hoyISO();

  // Si la cuenta guardada ya no existe o el usuario no la ve, ignorarla
  if (_movFiltroCuenta && !_cuentas.some(c => c.id == _movFiltroCuenta)) {
    _movFiltroCuenta = null;
    localStorage.removeItem(LS_CTA_DEFAULT);
  }
  const esDefault = _movFiltroCuenta && localStorage.getItem(LS_CTA_DEFAULT) == _movFiltroCuenta;
  const cuentasOpt = _cuentas.map(c => `<option value="${c.id}" ${_movFiltroCuenta==c.id?'selected':''}>${escHtml(c.nombre)}</option>`).join('');

  cont.innerHTML = `
    <div class="toolbar compacta">
      <select id="mov-cuenta" title="Cuenta" onchange="_movFiltroCuenta=this.value||null; renderMovimientos();">
        <option value="">Todas las cuentas</option>${cuentasOpt}
      </select>
      <button class="ibtn" onclick="toggleCuentaDefault()" title="${esDefault ? 'Quitar como predeterminada' : 'Abrir siempre en esta cuenta (en este dispositivo)'}" style="${_movFiltroCuenta ? '' : 'opacity:0.35;pointer-events:none;'}">${esDefault ? '⭐' : '☆'}</button>
      <input type="date" id="mov-desde" title="Desde" value="${_movFiltroDesde}" onchange="_movFiltroDesde=this.value; renderMovimientos();">
      <input type="date" id="mov-hasta" title="Hasta" value="${_movFiltroHasta}" onchange="_movFiltroHasta=this.value; renderMovimientos();">
      <input type="search" id="mov-buscar" placeholder="🔎 Importe, proveedor, descripción…" value="${escHtml(_movBusca)}" oninput="_movBusca=this.value; filtrarMovsLocal(true);">
      <button class="ibtn" onclick="exportarMovsExcel()" title="Descargar lo filtrado en Excel"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13l8 6M16 13l-8 6"/></svg></button>
      <button class="ibtn" onclick="exportarMovsPdf()" title="Descargar lo filtrado en PDF"><svg class="ico s" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 17v-5h2a1.5 1.5 0 0 1 0 3H9"/></svg></button>
      <button class="ibtn primary" onclick="cambiarTab('cargar')" title="Cargar un movimiento a mano (ingreso, egreso o transferencia)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div id="mov-lista"><div class="empty"><div class="spinner"></div></div></div>
  `;

  try {
    // Si hay cuenta filtrada, traer también las tenencias de esa cuenta
    let tenencias = [];
    if (_movFiltroCuenta) {
      const { data: t } = await sb.from('tesoreria_tenencias')
        .select('*').eq('cuenta_id', _movFiltroCuenta)
        .order('valor_corriente', { ascending: false });
      tenencias = t || [];
    }

    let q = sb.from('tesoreria_movimientos_view')
      .select('*')
      .gte('fecha', _movFiltroDesde).lte('fecha', _movFiltroHasta)
      .order('fecha', { ascending: false })
      // orden_banco: posición dentro del día según el banco (Galicia reordena
      // los movs a posteriori, ej. echeqs — así el saldo fila x fila cierra).
      .order('orden_banco', { ascending: false, nullsFirst: false })
      .order('id', { ascending: false });
    if (_movFiltroCuenta) q = q.eq('cuenta_id', _movFiltroCuenta);
    // (22-oct, JP) antes se cortaba en 500 y no había forma de ver el resto: ahora se traen todos los del rango, de a 1000
    let data = [], error = null;
    for (let i = 0; i < 20; i++) {
      const r = await q.range(i * 1000, i * 1000 + 999);
      if (r.error) { error = r.error; break; }
      data = data.concat(r.data || []);
      if (!r.data || r.data.length < 1000) break;
    }
    if (error) throw error;
    _movPag.p = 0;
    _movsCache = data || [];
    _tenenciasCache = tenencias;
    filtrarMovsLocal();
  } catch (e) {
    document.getElementById('mov-lista').innerHTML = `<div class="empty"><div class="icon">⚠️</div>Error: ${escHtml(e.message)}</div>`;
  }
}

function renderTablaTenencias(tenencias) {
  if (!tenencias || tenencias.length === 0) return '';
  // Agrupar por tipo
  const grupos = {};
  tenencias.forEach(t => {
    const tipo = t.tipo || 'Otros';
    if (!grupos[tipo]) grupos[tipo] = [];
    grupos[tipo].push(t);
  });
  const fmtCur = (n, c) => fmt$(n, c || 'USD');
  // Precio puede tener decimales (FCI tipicamente 4). Formato propio.
  const fmtPrecio = (n, c) => {
    const prefix = c === 'USD' ? 'U$D ' : '$ ';
    return prefix + Number(n || 0).toLocaleString('es-AR', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 4,
    });
  };
  // Cantidad con hasta 4 decimales (sin agrupador raro)
  const fmtCantidad = (n) => Number(n || 0).toLocaleString('es-AR', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 4,
  });
  const ultimoUpdate = tenencias.reduce((max, t) =>
    !max || (t.actualizado_at > max) ? t.actualizado_at : max, null);

  let html = `
    <div class="card" style="margin-bottom:14px;padding:0;overflow:hidden;">
      <div style="background:var(--primary-dark);color:white;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;">
        <span>📈 Tenencias actuales</span>
        ${ultimoUpdate ? `<span style="font-size:11px;font-weight:400;opacity:0.85;">Actualizado ${fmtFecha(ultimoUpdate.split('T')[0])}</span>` : ''}
      </div>
      <div class="table-wrap">
        <table style="margin:0;">
          <thead><tr>
            <th>Especie</th>
            <th>Tipo</th>
            <th class="right">Cantidad</th>
            <th class="right">Precio</th>
            <th class="right">Valor corriente</th>
          </tr></thead>
          <tbody>
  `;
  for (const [tipo, items] of Object.entries(grupos)) {
    const subt = items.reduce((s, t) => s + Number(t.valor_corriente || 0), 0);
    const moneda = items[0]?.currency || 'USD';
    items.forEach(t => {
      html += `<tr>
        <td>
          <div style="font-weight:600;">${escHtml(t.ticker || '')}</div>
          <div style="font-size:11px;color:var(--muted);">${escHtml(t.descripcion || '')}</div>
        </td>
        <td><span class="chip" style="background:#e5e7eb;color:#374151;font-size:11px;">${escHtml(tipo)}</span></td>
        <td class="right">${fmtCantidad(t.cantidad)}</td>
        <td class="right">${fmtPrecio(t.precio, t.currency)}</td>
        <td class="right" style="font-weight:600;">${fmtCur(t.valor_corriente, t.currency)}</td>
      </tr>`;
    });
    html += `<tr style="background:#f9fafb;font-weight:600;">
      <td colspan="4" class="right" style="padding-right:14px;">Subtotal ${escHtml(tipo)} (${escHtml(moneda)}):</td>
      <td class="right">${fmtCur(subt, moneda)}</td>
    </tr>`;
  }
  html += `
          </tbody>
        </table>
      </div>
    </div>
  `;
  return html;
}

let _movPag = { p: 0, n: Number(localStorage.getItem('tes_mov_pag') || 100) };

function _movPagTam(n) { _movPag.n = Number(n); _movPag.p = 0; try { localStorage.setItem('tes_mov_pag', String(n)); } catch (_) {} filtrarMovsLocal(); }
function _movPagHtml(total) {
  const pags = Math.max(1, Math.ceil(total / _movPag.n)); if (_movPag.p >= pags) _movPag.p = pags - 1;

let _tenenciasCache = [];
let _movBusca = '';

// ── Buscador local (11-ago, pedido Marisa): filtra los movs ya cargados ──
function _movsFiltrados() {
  const t = (_movBusca || '').toLowerCase().trim();
  if (!t) return _movsCache;
  const tNum = t.replace(/\./g, '').replace(',', '.');
  return _movsCache.filter(m =>
    (m.descripcion || '').toLowerCase().includes(t) ||
    (m.nota || '').toLowerCase().includes(t) ||
    (m.categoria_nombre || '').toLowerCase().includes(t) ||
    (m.cuenta_nombre || '').toLowerCase().includes(t) ||
    String(Math.round(Math.abs(m.importe))).includes(tNum) ||
    JSON.stringify(m.extra || {}).toLowerCase().includes(t));
}
function filtrarMovsLocal(resetPag) {
  if (resetPag) _movPag.p = 0;
  renderListaMovimientos(_movsFiltrados(), _tenenciasCache || []);

async function guardarEditMov(id) {
  try {
    const patch = {
      fecha: document.getElementById('em-fecha').value,
      importe: nmParse(document.getElementById('em-importe').value),
      categoria_id: parseInt(document.getElementById('em-categoria').value) || null,
      descripcion: document.getElementById('em-desc').value.trim() || null,
    };
    if (!patch.fecha || isNaN(patch.importe) || patch.importe === 0) throw new Error('Fecha e importe válidos son obligatorios');
    // (7-sep) re-adjuntar factura/depósito (caso "archivo rechazado")
    const fIn = document.getElementById('em-factura');
    const file = fIn?.files?.[0];
    if (file) {
      if (file.size > 15 * 1024 * 1024) throw new Error('El archivo es muy grande (máx 15 MB)');
      const m0 = _movsCache.find(x => x.id === id) || {};
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${m0.cuenta_id || 0}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error: upErr } = await sb.storage.from('tesoreria-facturas').upload(path, file, { contentType: file.type || 'image/jpeg' });
      if (upErr) throw new Error('No pude subir el archivo: ' + upErr.message);
      const { data: pub } = sb.storage.from('tesoreria-facturas').getPublicUrl(path);
      patch.factura_path = pub.publicUrl;   // el trigger resetea el circuito (se vuelve a subir al OneDrive)
      patch.observacion_control = null; patch.observacion_control_por = null; patch.observacion_control_at = null;
    }

    // ── Cambio de TIPO (17-sep, JP) ──────────────────────────────────
    // Va por RPC porque cada tipo tiene reglas propias: el recibo lleva firma
    // y no lleva archivo; la factura y el depósito al revés, y el archivo es
    // obligatorio. Se hace ANTES del resto para que el update no pise lo que
    // la RPC acomoda.
    const selTipo = document.getElementById('em-respaldo');
    const m1 = _movsCache.find(x => x.id === id) || {};
    if (selTipo && selTipo.value !== m1.respaldo_tipo) {
      const nuevo = selTipo.value;
      if (nuevo !== 'recibo' && !patch.factura_path && !m1.factura_path) {
        throw new Error('Para pasarlo a ' + (nuevo === 'deposito' ? 'depósito' : 'factura') +
                        ' hay que adjuntar la foto o el PDF');
      }
      const { data: rt, error: eT } = await sb.rpc('tesoreria_cambiar_respaldo',
        { p_mov_id: id, p_tipo: nuevo, p_factura_path: patch.factura_path || null });
      if (eT) throw eT;
      if (rt && rt.ok === false) throw new Error(rt.msg || 'No se pudo cambiar el tipo');
      delete patch.factura_path;    // ya lo dejó puesto la RPC
      toast('✓ ' + (rt?.msg || 'Tipo cambiado'));
    }

    const { error } = await sb.from('tesoreria_movimientos').update(patch).eq('id', id);
    if (error) throw error;
    // (28-sep) Días del pago eventual: por RPC (valida y vale también con el recibo firmado)
    if (_catEventual(patch.categoria_id) && patch.importe < 0) {
      const d = document.getElementById('em-ev-desde')?.value, h = document.getElementById('em-ev-hasta')?.value;
      const dRaw = document.getElementById('em-ev-dias')?.value;
      const { error: eEv } = await sb.rpc('rrhh_eventual_fijar_dias',
        { p_mov: id, p_desde: d || null, p_hasta: h || null, p_dias: dRaw ? Number(dRaw) : null });
      if (eEv) throw new Error('Se guardó el movimiento pero no los días: ' + eEv.message);
    }
    document.getElementById('editmov-bg')?.remove();
    toast('✓ Movimiento actualizado');
    await cargar();   // los saldos pueden haber cambiado
    if (session.soloComprobantes) renderCargar();
    else if (currentTab === 'firma') renderPendientesFirma();
    else renderMovimientos();
  } catch (e) { toast('Error: ' + e.message, true); }
}

async function borrarMov(id) {
  const m = _movsCache.find(x => x.id === id);
  if (!m) return;
  const desc = (m.descripcion || '').slice(0, 60);
  if (!confirm(`¿ANULAR este movimiento?\n\n#${m.id} · ${m.fecha} · ${fmt$(m.importe, m.cuenta_moneda)}\n${desc}\n\nDesaparece y la caja vuelve como estaba.${!session.verTodo ? '\n(Si ya imprimiste el recibo, rompelo — este comprobante deja de existir.)' : ''}`)) return;
  const motivo = prompt('¿Por qué lo anulás? (queda registrado)');
  if (motivo === null) return;
  if (!motivo.trim()) { toast('Hace falta el motivo', true); return; }
  try {
    // Si era transferencia, avisar que queda la pata contraria
    if (m.transferencia_id && !confirm('Este movimiento es parte de una TRANSFERENCIA: la otra pata NO se borra sola.\n¿Borrar igual?')) return;
    // Si tiene factura en el bucket, borrarla también
    if (m.factura_path) {
      const pref = SUPA_URL + '/storage/v1/object/public/tesoreria-facturas/';
      if (m.factura_path.startsWith(pref)) {
        await sb.storage.from('tesoreria-facturas').remove([m.factura_path.slice(pref.length)]);
      }
    }
    // 🚨 Pasa por la RPC y no por .delete() directo: así el motivo es
    // obligatorio y queda en tesoreria_movimientos_borrados. Antes este botón
    // borraba sin dejar ningún rastro de quién ni por qué.
    const { data, error } = await sb.rpc('tesoreria_cancelar_movimiento', { p_mov_id: id, p_motivo: motivo });
    if (error) throw error;
    if (data && data.ok === false) { toast(data.msg || 'No se pudo anular', true); return; }
    toast('🗑 ' + ((data && data.codigo) ? data.codigo + ' anulado' : 'Movimiento anulado'));
    await cargar();
    renderMovimientos();
  } catch (e) { toast('Error: ' + e.message, true); }
}

async function reportarProblemaMov(id) {
  // Igual que abrirEditarMov: se llama también desde Pendientes firma, donde

  let m = _movsCache.find(x => x.id === id);
  if (!m) {
