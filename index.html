<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tesorería · Claudia Adorno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#f59e0b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- jsPDF + QR para generar comprobantes de egreso -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* Tipografia institucional: URW Gothic (clon libre de Avant Garde),
   servida desde fonts/ del propio repo. */
@font-face {
  font-family: 'URW Gothic';
  src: url('fonts/URWGothic-Book.ttf') format('truetype');
  font-weight: 300 700;
  font-display: swap;
}

:root {
  --primary: #f59e0b;
  --primary-dark: #b45309;
  --primary-light: #fef3c7;
  --bg: #f9fafb;
  --card: #ffffff;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --blue: #0ea5e9;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'URW Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

.screen { display: none; }
.screen.active { display: block; }

/* LOGIN */
#login-screen.active { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
.login-card { background: white; border-radius: 16px; padding: 32px 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 100%; }
.login-card h1 { text-align: center; font-size: 28px; margin: 0 0 4px; color: var(--primary-dark); }
.login-card .sub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 26px; }
.login-card label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.login-card input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
.login-card input:focus { outline: none; border-color: var(--primary); }
.btn-primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.login-error { color: var(--red); font-size: 12px; margin-bottom: 8px; min-height: 16px; }

/* APP */
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header-title { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
.header-sub { font-size: 12px; color: var(--muted); }
.header-right { display: flex; gap: 8px; align-items: center; }
.btn-icon { background: white; border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.btn-secondary:hover { background: #f3f4f6; }

/* Nav tabs (unificadas dentro del header) */
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1; margin: 0 10px; }
.tabs button { background: transparent; border: none; padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button.active { color: var(--primary-dark); border-bottom-color: var(--primary); }
.tabs button:hover { background: #fafafa; }
.kebab-tabs-btn { display: none; }
@media (max-width: 900px) {
  .kebab-tabs-btn { display: inline-block; }
  .tabs { display: none; position: absolute; top: calc(100% + 4px); right: 8px; left: auto;
    background: white; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); flex-direction: column; padding: 6px;
    z-index: 200; margin: 0; min-width: 190px; overflow: visible; }
  .tabs.open { display: flex; }
  .tabs button { text-align: left; border-bottom: none; border-left: 3px solid transparent; border-radius: 6px; padding: 11px 12px; }
  .tabs button.active { border-left-color: var(--primary); background: #fff7ed; }
}

main { padding: 16px; max-width: 1400px; margin: 0 auto; }

/* Saldos por grupo */
.grupo { margin-bottom: 22px; }
.grupo-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding: 0 4px; }
.cuentas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.cuenta-card { background: white; border-radius: 10px; padding: 14px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); cursor: pointer; transition: transform 0.1s; }
.cuenta-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); }
.cuenta-card .cuenta-nombre { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
.cuenta-card .cuenta-saldo { font-size: 22px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
.cuenta-card .cuenta-saldo.negativo { color: var(--red); }
.cuenta-card .cuenta-moneda { font-size: 11px; color: var(--muted); }

/* Total */
.total-card { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
.total-card .label { font-size: 12px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; }
.total-card .value { font-size: 30px; font-weight: 800; margin-top: 4px; }
.total-card .breakdown { font-size: 12px; opacity: 0.9; margin-top: 6px; }

/* Tabla movimientos */
.toolbar { background: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; box-shadow: var(--shadow); }
.toolbar select, .toolbar input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: white; }
.toolbar input { min-width: 180px; }
.toolbar .spacer { flex: 1; }
.toolbar button.primary { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.toolbar button.primary:hover { background: var(--primary-dark); }

.table-wrap { background: white; border-radius: 10px; box-shadow: var(--shadow); overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
th { background: #f9fafb; padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
th.right, td.right { text-align: right; }
td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; font-variant-numeric: tabular-nums; }
tbody tr:nth-child(even) { background: #fafafa; }
tbody tr:hover { background: var(--primary-light); }
.importe-ingreso { color: var(--green); font-weight: 600; }
.importe-egreso { color: var(--red); font-weight: 600; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.chip-origen-manual { background: #e0e7ff; color: #3730a3; }
.chip-origen-ventas { background: #dbeafe; color: #1e40af; }
.chip-origen-scraper { background: #dcfce7; color: #065f46; }
.chip-origen-transferencia { background: #fef3c7; color: #92400e; }
.chip-firma-pendiente { background: #fef3c7; color: #92400e; }

/* Forms */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 14px; font-family: inherit;
}
.form-row textarea { resize: vertical; min-height: 50px; }
.form-row.full { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

.card { background: white; border-radius: 10px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card-title { font-size: 14px; font-weight: 700; margin: 0 0 12px; color: var(--text); }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty .icon { font-size: 42px; margin-bottom: 10px; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 10px 18px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.2s; z-index: 9999; pointer-events: none; }
#toast.show { opacity: 1; }
#toast.err { background: var(--red); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #e5e7eb; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .header-title { font-size: 16px; }
  main { padding: 10px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="screen active">
  <div class="login-card">
    <h1>💰 Tesorería</h1>
    <p class="sub">Claudia Adorno SRL · Cajas, bancos e inversiones</p>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email">
    <label>Contraseña</label>
    <input type="password" id="login-pass" placeholder="•••" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-error" id="login-error"></div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Entrar →</button>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="screen">
  <div class="header">
    <div class="header-left">
      <a href="https://claudiaadornosrl-prog.github.io/hub/" title="Volver al Hub" aria-label="Volver al Hub" style="text-decoration:none;font-size:17px;line-height:1;color:inherit;opacity:0.65;padding:4px 8px;border-radius:8px;">↩</a>
      <span class="header-title">💰 Tesorería</span>
      <span class="header-sub" id="hdr-sub"></span>
    </div>
    <div class="tabs" id="tabs">
      <button class="active" data-tab="dashboard" onclick="cambiarTab('dashboard')">📊 Saldos</button>
      <button data-tab="movimientos" onclick="cambiarTab('movimientos')">📋 Movimientos</button>
      <button data-tab="cargar" onclick="cambiarTab('cargar')" id="tab-cargar">🧾 Recibos</button>
      <button data-tab="firma" onclick="cambiarTab('firma')" id="tab-firma" style="display:none;">📝 Pendientes firma <span id="badge-firma" style="display:none;background:#dc2626;color:white;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;font-weight:700;"></span></button>
      <button data-tab="pendientes" onclick="cambiarTab('pendientes')" id="tab-pendientes">💸 Pendientes <span id="badge-pendientes" style="display:none;background:#dc2626;color:white;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:4px;font-weight:700;"></span></button>
      <button data-tab="scrapers" onclick="cambiarTab('scrapers')" id="tab-scrapers" style="display:none;">🤖 Bots</button>
    </div>
    <div class="header-right">
      <button class="btn-icon kebab-tabs-btn" onclick="toggleTabsMenu(event)" title="Menú" aria-label="Menú">☰</button>
      <button class="btn-icon" id="btn-notifs" onclick="toggleNotificaciones()" title="Activar notificaciones">🔕</button>
      <button class="btn-icon" id="refresh-btn" onclick="cargar()" title="Actualizar">↻</button>
      <button class="btn-secondary" onclick="logout()">Salir</button>
    </div>
  </div>

  <main id="contenido"><div class="empty"><div class="spinner"></div></div></main>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════
const SUPA_URL = 'https://kwwiykssrpabncpqtmwi.supabase.co';

// ── Recibos firmados: convertir la ruta archivada (OneDrive/VPS) al link web
//    de SharePoint para poder ABRIR el PDF desde la grilla ──
const SHAREPOINT_BASE = 'https://claudiaadorno-my.sharepoint.com/personal/office_claudiaadorno_onmicrosoft_com/Documents/DOCUMENTOS/';
const ONEDRIVE_WIN_PREFIX = 'C:\\Users\\Usuario\\OneDrive - Claudia Adorno SRL\\DOCUMENTOS\\';
const VPS_PREFIX = '/opt/adorno/recibos_archivados/';
function pathToSharepointUrl(path) {
  if (!path || typeof path !== 'string') return null;
  if (/^https?:\/\//i.test(path)) return path;   // ya es una URL
  let resto;
  if (path.startsWith(ONEDRIVE_WIN_PREFIX)) resto = path.substring(ONEDRIVE_WIN_PREFIX.length);
  else if (path.startsWith(VPS_PREFIX)) resto = path.substring(VPS_PREFIX.length);
  else return null;
  resto = resto.replace(/\\/g, '/');
  return SHAREPOINT_BASE + resto.split('/').map(encodeURIComponent).join('/');
}
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3d2l5a3NzcnBhYm5jcHF0bXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjI1NTQsImV4cCI6MjA5NDkzODU1NH0.O1VhKdjPahnJJ9qXcQuSKQbnKGhsEZqYmjDEfRuRpkc';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'tesoreria-adorno-auth' }
});

let session = null;  // { user, email, rol, empleadoData, localGerencia }
let currentTab = 'dashboard';

// Cache global de datos para no re-fetchear todo el tiempo
let _cuentas = [];
let _categorias = [];

const fmt$ = (n, moneda) => {
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Number(n||0));
  const prefix = moneda === 'USD' ? 'U$D ' : '$ ';
  // Con centavos, como los muestra el banco (jul 2026)
  return sign + prefix + abs.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtFecha = d => {
  if (!d) return '—';
  const dt = new Date(d.length === 10 ? d + 'T12:00:00' : d);
  return dt.toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: '2-digit' });
};
const escHtml = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoyISO = () => new Date().toISOString().split('T')[0];

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  setTimeout(() => { t.className = ''; }, 2800);
}

// ═══════════════════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════════════════
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Faltan datos'; return; }
  document.getElementById('login-btn').disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    await initSession();
  } catch (e) {
    errEl.textContent = e.message || 'No se pudo entrar';
    document.getElementById('login-btn').disabled = false;
  }
}

async function logout() {
  await sb.auth.signOut();
  session = null;
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').classList.add('active');
}

async function initSession() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return false;
  // Buscar rol del usuario en rrhh_usuarios
  const { data: u } = await sb.from('rrhh_usuarios')
    .select('rol, empleado_id, local_gerencia, activo')
    .eq('auth_user_id', user.id)
    .maybeSingle();
  if (!u || !u.activo) {
    alert('Tu usuario no tiene acceso a Tesorería.');
    await logout();
    return false;
  }
  session = {
    user, email: user.email,
    rol: u.rol,
    empleado_id: u.empleado_id,
    localGerencia: u.local_gerencia,
    // verTodo: admin OR encargada de oficina (manejan toda la administración)
    verTodo: (u.rol === 'admin') || (u.rol === 'gerente' && u.local_gerencia === 'oficina'),
  };
  // ── Cajeras designadas (jul 2026) ──
  // Una empleada (rol 'empleado') solo entra si está en tesoreria_cajeras:
  // la RPC devuelve su local; para el resto de las empleadas devuelve null.
  if (u.rol === 'empleado') {
    // (10-ago) Marisa/Analía son rol empleado pero admin-oficina por email
    // (mismo par que tesoreria_es_admin_oficina() en la DB) — no son cajeras
    // y no deben caer en el logout.
    const _ADMIN_OF = ['marisaisabel07@yahoo.com.ar', 'rivera.analia.leon@gmail.com', 'administracion@claudiaadorno.com', 'claudiaadorno@claudiaadorno.com'];
    if (!_ADMIN_OF.includes((session.email || '').toLowerCase())) {
      const { data: cajLocal } = await sb.rpc('tesoreria_cajera_local');
      if (!cajLocal) {
        alert('Tu usuario no tiene acceso a Tesorería.');
        await logout();
        return false;
      }
      session.localGerencia = cajLocal;
      session.esCajera = true;
    }
  }
  enterApp();
  return true;
}

function enterApp() {
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('hdr-sub').textContent = '· ' + (
    session.rol === 'admin' ? 'Admin · ' + session.email :
    session.localGerencia === 'oficina' ? 'Oficina (admin)' :
    session.esCajera ? 'Cajera · ' + (session.localGerencia || '') :
    'Encargada · ' + (session.localGerencia || '')
  );
  // ── Visibilidad de tabs por rol ──
  // "Oficina" = admin, gerente de oficina, o Marisa/Analía (mismo par de
  // emails que tesoreria_es_admin_oficina() en la DB — mantener sincronizado).
  const ADMIN_OFICINA_EMAILS = ['marisaisabel07@yahoo.com.ar', 'rivera.analia.leon@gmail.com', 'administracion@claudiaadorno.com', 'claudiaadorno@claudiaadorno.com'];
  session.esOficina = session.verTodo ||
    ADMIN_OFICINA_EMAILS.includes((session.email || '').toLowerCase());
  if (session.esOficina) {
    // Oficina ve Pendientes y Bots (display explícito, a prueba de caches viejas)
    document.getElementById('tab-pendientes').style.display = '';
    document.getElementById('tab-scrapers').style.display = '';
    // (6-ago, JP) Recibos SÍ se ve desde admin / Oficina / Marisa / Analía.
    // Lo que hay que bloquear son vendedoras y usuarios genéricos de local,
    // para que no puedan tocar la caja (ver rama de abajo).
    document.getElementById('tab-cargar').style.display = '';
    // (10-ago) fix: Pendientes firma quedaba display:none para siempre
    document.getElementById('tab-firma').style.display = '';
  } else {
    // Locales: solo Saldos + Movimientos (+ Recibos según quién sea).
    // TODO explícito: si antes entró un admin en este mismo navegador, los
    // tabs quedaban prendidos de la sesión anterior (bug 30-jul).
    document.getElementById('tab-pendientes').style.display = 'none';
    document.getElementById('tab-scrapers').style.display = 'none';
    // Quiénes NO pueden tocar la caja:
    //   · usuario GENÉRICO del local (gerente sin empleada asociada,
    //     ej: alcorta@ / unicenter@)
    //   · vendedoras (rol 'empleado' que no sea cajera)
    // Sí la manejan: encargadas (gerente con empleada) y cajeras.
    const generico = session.rol === 'gerente' && !session.empleado_id;
    const vendedora = session.rol === 'empleado' && !session.esCajera;
    document.getElementById('tab-cargar').style.display =
      (generico || vendedora) ? 'none' : '';
    // (10-ago) fix: misma visibilidad para Pendientes firma
    document.getElementById('tab-firma').style.display =
      (generico || vendedora) ? 'none' : '';
  }
  cargar();
  actualizarBtnNotifs();
}

// ═══════════════════════════════════════════════════════════════════════
// CARGAR DATOS BASE (cuentas + categorías)
// ═══════════════════════════════════════════════════════════════════════
async function cargar() {
  document.getElementById('refresh-btn').innerHTML = '<span class="spinner"></span>';
  try {
    // Saldos por cuenta (la RLS filtra para gerente)
    const { data: saldos } = await sb.from('tesoreria_saldos').select('*');
    _cuentas = saldos || [];
    // Categorías
    const { data: cats } = await sb.from('tesoreria_categorias')
      .select('*').eq('activa', true).order('orden_display');
    _categorias = cats || [];
    renderTab(currentTab);
    refrescarBadgePagosPendientes();
  } catch (e) {
    document.getElementById('contenido').innerHTML = `<div class="empty"><div class="icon">⚠️</div>Error: ${escHtml(e.message)}</div>`;
  } finally {
    document.getElementById('refresh-btn').innerHTML = '↻';
  }
}

function toggleTabsMenu(ev) {
  ev.stopPropagation();
  document.getElementById('tabs').classList.toggle('open');
}
document.addEventListener('click', () => {
  document.getElementById('tabs')?.classList.remove('open');
});

function cambiarTab(tab) {
  document.getElementById('tabs').classList.remove('open');
  currentTab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderTab(tab);
}

function renderTab(tab) {
  if (tab === 'dashboard')   return renderDashboard();
  if (tab === 'movimientos') return renderMovimientos();
  if (tab === 'cargar')      return renderCargar();
  if (tab === 'firma')       return renderPendientesFirma();
  if (tab === 'pendientes')  return renderPagosPendientes();
  if (tab === 'scrapers')    return renderScrapers();
}

// PENDIENTES DE FIRMA
// ═══════════════════════════════════════════════════════════════════════
async function renderPendientesFirma() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  const { data: pend, error } = await sb.from('tesoreria_movimientos_pendientes_firma')
    .select('*').order('cargado_at', { ascending: false });
  if (error) { cont.innerHTML = `<div class="empty">Error: ${escHtml(error.message)}</div>`; return; }

  // Badge en el nav
  const badge = document.getElementById('badge-firma');
  if ((pend||[]).length > 0) { badge.textContent = pend.length; badge.style.display = ''; }
  else                       { badge.style.display = 'none'; }

  if (!pend || pend.length === 0) {
    cont.innerHTML = `<div class="empty"><div class="icon">✅</div>No hay egresos pendientes de firma.</div>`;
    return;
  }

  cont.innerHTML = `
    <div class="card" style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;">
      <div style="font-size:13px;font-weight:600;color:#92400e;">📝 ${pend.length} egreso(s) pendiente(s) de firma</div>
      <div style="font-size:12px;color:#a16207;margin-top:4px;">
        Generá el PDF, firmalo y mandalo por mail a <strong>claudiaadornosrl@gmail.com</strong>.
        El sistema lo va a detectar por el QR y marcar como firmado (entonces afecta el saldo).
      </div>
    </div>
    ${pend.map(m => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:240px;">
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">
              ${escHtml(m.codigo_seguimiento||'')} · ${fmtFecha(m.fecha)} · ${escHtml(m.cuenta_nombre)}
            </div>
            <div style="font-size:20px;font-weight:700;color:var(--red);margin-top:4px;">${fmt$(m.importe)}</div>
            <div style="font-size:13px;color:var(--text);margin-top:4px;">${escHtml(m.categoria_nombre||'Sin categoría')}</div>
            ${m.descripcion ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;font-style:italic;">"${escHtml(m.descripcion)}"</div>` : ''}
            <div style="font-size:11px;color:var(--muted);margin-top:6px;">
              Cargado por <strong>${escHtml(m.cargado_por||'?')}</strong>
              hace <strong>${m.dias_pendiente} día(s)</strong>
              ${m.dias_pendiente >= 3 ? '<span style="color:var(--red);">⚠ atrasado</span>' : ''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
            <button class="btn-primary" style="width:auto;padding:8px 14px;font-size:13px;" onclick="generarPDFEgreso(${m.id})">📄 Descargar PDF</button>
            ${session.verTodo ? `<button class="btn-secondary" style="color:var(--red);border-color:#fca5a5;" onclick="cancelarMovimiento(${m.id})">✗ Cancelar</button>` : ''}
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

async function cancelarMovimiento(id) {
  const motivo = prompt('¿Por qué cancelás este movimiento? (queda registrado)');
  if (motivo === null) return;
  try {
    const { error } = await sb.rpc('tesoreria_cancelar_movimiento', { p_mov_id: id, p_motivo: motivo });
    if (error) throw error;
    toast('✓ Cancelado'); renderPendientesFirma();
  } catch (e) { toast('Error: ' + e.message, true); }
}

// ═══════════════════════════════════════════════════════════════════════
// PDF: comprobante de egreso con QR
// ═══════════════════════════════════════════════════════════════════════
async function generarPDFEgreso(movId) {
  // Cargar movimiento + cuenta + categoría
  const { data: m, error } = await sb.from('tesoreria_movimientos_view')
    .select('*').eq('id', movId).single();
  if (error || !m) { toast('No se pudo cargar el movimiento', true); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, margen = 18;

  // Header con logo de marca
  doc.setFillColor(245, 158, 11);  // amber
  doc.rect(0, 0, W, 4, 'F');

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(22);
  doc.setTextColor(180, 83, 9);
  doc.text('Claudia Adorno', margen, 22);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(100, 100, 100);
  doc.text('CLAUDIA ADORNO SRL · CUIT 30-70967311-0', W - margen, 18, { align: 'right' });
  doc.text('Buenos Aires, Argentina', W - margen, 22, { align: 'right' });

  doc.setDrawColor(245, 158, 11);
  doc.setLineWidth(0.5);
  doc.line(margen, 28, W - margen, 28);

  // Título
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.setTextColor(30, 41, 59);
  doc.text('COMPROBANTE DE EGRESO DE CAJA', W/2, 42, { align: 'center' });

  // Fecha del comprobante (carga, no del egreso)
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(120, 120, 120);
  doc.text(`Buenos Aires, ${new Date().toLocaleDateString('es-AR', { day:'numeric', month:'long', year:'numeric' })}`,
           W - margen, 52, { align: 'right' });

  // Box con datos del movimiento
  let y = 65;
  doc.setDrawColor(226, 232, 240);
  doc.setFillColor(252, 252, 252);
  doc.setLineWidth(0.3);
  doc.roundedRect(margen, y, W - 2*margen, 60, 2, 2, 'FD');

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text('CUENTA', margen + 6, y + 8);
  doc.text('CATEGORÍA', margen + 6, y + 22);
  doc.text('FECHA', margen + 6, y + 36);
  doc.text('IMPORTE', W - margen - 6, y + 8, { align: 'right' });

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.setTextColor(30, 41, 59);
  doc.text(m.cuenta_nombre || '—', margen + 6, y + 14);
  doc.text(m.categoria_nombre || '—', margen + 6, y + 28);
  doc.text(new Date(m.fecha + 'T12:00:00').toLocaleDateString('es-AR', { day:'2-digit', month:'long', year:'numeric' }), margen + 6, y + 42);

  doc.setFontSize(18);
  doc.setTextColor(220, 38, 38);
  doc.text(fmt$(m.importe, m.cuenta_moneda), W - margen - 6, y + 18, { align: 'right' });

  // Descripción
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text('DETALLE', margen + 6, y + 50);
  doc.setFontSize(11);
  doc.setTextColor(30, 41, 59);
  const lineas = doc.splitTextToSize(m.descripcion || 'Sin detalle', W - 2*margen - 12);
  doc.text(lineas, margen + 6, y + 56);

  // Texto de conformidad
  y = 140;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(30, 41, 59);
  const cuerpo = `Por la presente dejo constancia de la salida de $${Math.round(Math.abs(m.importe)).toLocaleString('es-AR')} de la caja "${m.cuenta_nombre}" por el concepto de "${m.categoria_nombre || 'movimiento manual'}".`;
  const lineasCuerpo = doc.splitTextToSize(cuerpo, W - 2*margen);
  doc.text(lineasCuerpo, margen, y, { lineHeightFactor: 1.6 });

  // Firmas
  y = 200;
  doc.setDrawColor(180, 180, 180);
  doc.setLineWidth(0.4);
  doc.line(margen, y + 14, margen + 75, y + 14);
  doc.line(W - margen - 75, y + 14, W - margen, y + 14);

  doc.setFont('helvetica', 'italic');
  doc.setFontSize(9);
  doc.setTextColor(120, 120, 120);
  doc.text('Firma autorizante', margen + 37, y + 18, { align: 'center' });
  doc.text('Firma receptora del dinero', W - margen - 37, y + 18, { align: 'center' });

  // QR con token único — el sync IMAP lee este token del PDF firmado
  // y matchea con tesoreria_movimientos.qr_token para marcar firmado_at
  try {
    if (typeof qrcode === 'function') {
      // El token va en el QR (UUID inmutable, único por mov).
      // El código de seguimiento humano-legible va al lado del QR.
      const tokenQR = m.qr_token || m.codigo_seguimiento || ('MOV-' + String(m.id).padStart(5, '0'));
      const codigoHumano = m.codigo_seguimiento || ('MOV-' + String(m.id).padStart(5, '0'));
      const qr = qrcode(0, 'M');
      qr.addData('TESORERIA:' + tokenQR);
      qr.make();
      const qrDataUrl = qr.createDataURL(4, 0);
      doc.addImage(qrDataUrl, 'PNG', margen, H - 50, 22, 22);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(120, 120, 120);
      doc.text('CÓDIGO DE SEGUIMIENTO', margen + 26, H - 44);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(180, 83, 9);
      doc.text(codigoHumano, margen + 26, H - 38);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(120, 120, 120);
      doc.text('Una vez firmado, escaneá esta hoja y enviála a', margen + 26, H - 32);
      doc.setFont('helvetica', 'bold');
      doc.text('claudiaadornosrl@gmail.com', margen + 26, H - 28);
      doc.setFont('helvetica', 'normal');
      doc.text('El sistema detecta el QR y lo marca como firmado automáticamente.', margen + 26, H - 24);
    }
  } catch (e) { console.warn('qr:', e); }

  // Footer
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(150, 150, 150);
  doc.text(`Generado automáticamente · ${new Date().toLocaleString('es-AR')} · ${m.codigo_seguimiento || 'MOV-'+m.id}`,
           W/2, H - 8, { align: 'center' });

  const nombreArchivo = `${m.codigo_seguimiento || 'MOV-'+m.id} ${(m.cuenta_nombre||'').replace(/\s+/g,'_')} ${m.fecha}.pdf`;
  doc.save(nombreArchivo);
  toast('✓ PDF descargado · firmalo y mandalo por mail');
}

// ═══════════════════════════════════════════════════════════════════════
// DASHBOARD: saldos agrupados
// ═══════════════════════════════════════════════════════════════════════
function renderDashboard() {
  const cont = document.getElementById('contenido');
  if (_cuentas.length === 0) {
    cont.innerHTML = `<div class="empty"><div class="icon">💰</div>No tenés acceso a ninguna cuenta. Pedile al admin que te dé permisos.</div>`;
    return;
  }
  // Agrupar
  const grupos = {};
  _cuentas.forEach(c => {
    const g = c.grupo || 'Sin grupo';
    if (!grupos[g]) grupos[g] = [];
    grupos[g].push(c);
  });

  // Calcular total por moneda (solo ARS, para mostrar el "total global" más útil)
  let totalARS = 0, totalUSD = 0;
  _cuentas.forEach(c => {
    if (c.moneda === 'USD') totalUSD += Number(c.saldo || 0);
    else                    totalARS += Number(c.saldo || 0);
  });

  let html = '';
  // Mostrar total general para admin y oficina
  if (session.verTodo) {
    html += `
      <div class="total-card">
        <div class="label">Total general (ARS)</div>
        <div class="value">${fmt$(totalARS, 'ARS')}</div>
        ${totalUSD > 0 ? `<div class="breakdown">+ ${fmt$(totalUSD, 'USD')} en USD</div>` : ''}
      </div>
    `;
  }

  // Tipos que se agrupan visualmente como "Inversiones" (drill-down)
  const TIPOS_INVERSION = ['banco_fondo', 'banco_titulos', 'banco_pf'];

  for (const [grupo, cuentas] of Object.entries(grupos)) {
    // Separar cuentas normales vs inversiones (las inversiones se agrupan en
    // 2 cards virtuales por moneda: "Inversiones ARS" / "Inversiones USD")
    const normales   = cuentas.filter(c => !TIPOS_INVERSION.includes(c.tipo));
    const inversiones = cuentas.filter(c =>  TIPOS_INVERSION.includes(c.tipo));

    // Armar las 2 cards virtuales de inversiones (si hay alguna cuenta de
    // inversión en este grupo).
    const monedasInv = [...new Set(inversiones.map(c => c.moneda))];
    const cardsInversionVirtual = monedasInv.map(moneda => {
      const cuentasMon = inversiones.filter(c => c.moneda === moneda);
      const saldoTotal = cuentasMon.reduce((s, c) => s + Number(c.saldo || 0), 0);
      return {
        _virtual: true,
        _grupo: grupo,
        _moneda: moneda,
        nombre: `Inversiones ${moneda === 'USD' ? 'Dólares' : 'Pesos'}`,
        icono: '💼',
        moneda,
        saldo: saldoTotal,
        color: '#f97316',
      };
    });

    const todas = [...normales, ...cardsInversionVirtual];
    if (!todas.length) continue;

    const subtot = todas.reduce((s, c) => s + Number(c.saldo || 0), 0);
    const moneda = todas[0]?.moneda || 'ARS';
    html += `
      <div class="grupo">
        <div class="grupo-title">${escHtml(grupo)} · subtotal ${fmt$(subtot, moneda)}</div>
        <div class="cuentas-grid">
          ${todas.map(c => {
            const onClick = c._virtual
              ? `verInversionesDe('${escHtml(c._grupo)}','${c._moneda}')`
              : `verMovimientosCuenta(${c.id})`;
            return `
            <div class="cuenta-card" style="border-left-color:${c.color||'#f59e0b'};position:relative;">
              <div onclick="${onClick}" style="cursor:pointer;">
                <div class="cuenta-nombre">${c.icono||'💵'} ${escHtml(c.nombre)} ${c._virtual ? '<span style="font-size:11px;color:var(--muted);">▸</span>' : ''}</div>
                <div class="cuenta-saldo ${Number(c.saldo) < 0 ? 'negativo' : ''}">${fmt$(c.saldo, c.moneda)}</div>
                <div class="cuenta-moneda">${c.moneda}</div>
              </div>
              ${!c._virtual ? `
                <button onclick="event.stopPropagation();setCuentaDefaultDesdeSaldos(${c.id})"
                  title="${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? 'Quitar como caja predeterminada' : 'Abrir Movimientos siempre en esta caja (este dispositivo)'}"
                  style="position:absolute;top:8px;right:${session.verTodo ? '44px' : '8px'};background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">
                  ${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? '⭐' : '☆'}
                </button>
              ` : ''}
              ${(!c._virtual && session.verTodo) ? `
                <button onclick="event.stopPropagation();abrirActualizarSaldo(${c.id})"
                  title="Actualizar saldo (ancla)"
                  style="position:absolute;top:8px;right:8px;background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--muted);cursor:pointer;">
                  🎯
                </button>
              ` : ''}
            </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }
  cont.innerHTML = html;
}

// ─── Vista intermedia: inversiones de un grupo por moneda ──────────
// Muestra 3 cards (FIMA / Títulos / PF) cuando el usuario clickea
// "Inversiones Pesos" o "Inversiones Dólares" desde el dashboard.
function verInversionesDe(grupo, moneda) {
  const TIPOS_INVERSION = ['banco_fondo', 'banco_titulos', 'banco_pf'];
  const cuentas = _cuentas.filter(c =>
    c.grupo === grupo && c.moneda === moneda && TIPOS_INVERSION.includes(c.tipo)
  );
  const tipoLabel = {
    banco_fondo:   { nombre: 'Fondos FIMA',  icono: '📈' },
    banco_titulos: { nombre: 'Títulos',      icono: '📊' },
    banco_pf:      { nombre: 'Plazo Fijo',   icono: '🔒' },
  };
  // Ordenar: fondos → títulos → PF
  const ordenTipo = { banco_fondo: 1, banco_titulos: 2, banco_pf: 3 };
  cuentas.sort((a, b) => ordenTipo[a.tipo] - ordenTipo[b.tipo]);
  const subtot = cuentas.reduce((s, c) => s + Number(c.saldo || 0), 0);
  const cont = document.getElementById('contenido');
  cont.innerHTML = `
    <div style="margin-bottom:12px;">
      <button class="btn-secondary" onclick="cambiarTab('dashboard')" style="padding:6px 12px;font-size:13px;">‹ Volver</button>
    </div>
    <div class="grupo">
      <div class="grupo-title">${escHtml(grupo)} · Inversiones ${moneda === 'USD' ? 'Dólares' : 'Pesos'} · subtotal ${fmt$(subtot, moneda)}</div>
      <div class="cuentas-grid">
        ${cuentas.map(c => {
          const meta = tipoLabel[c.tipo] || { nombre: c.nombre, icono: '💵' };
          return `
            <div class="cuenta-card" style="border-left-color:${c.color||'#f97316'};position:relative;">
              <div onclick="verMovimientosCuenta(${c.id})" style="cursor:pointer;">
                <div class="cuenta-nombre">${meta.icono} ${escHtml(meta.nombre)}</div>
                <div class="cuenta-saldo ${Number(c.saldo) < 0 ? 'negativo' : ''}">${fmt$(c.saldo, c.moneda)}</div>
                <div class="cuenta-moneda">${c.moneda}</div>
              </div>
              <button onclick="event.stopPropagation();setCuentaDefaultDesdeSaldos(${c.id})"
                title="${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? 'Quitar como caja predeterminada' : 'Abrir Movimientos siempre en esta caja (este dispositivo)'}"
                style="position:absolute;top:8px;right:${session.verTodo ? '44px' : '8px'};background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;">
                ${localStorage.getItem(LS_CTA_DEFAULT) == c.id ? '⭐' : '☆'}
              </button>
              ${session.verTodo ? `
                <button onclick="event.stopPropagation();abrirActualizarSaldo(${c.id})"
                  title="Actualizar saldo (ancla)"
                  style="position:absolute;top:8px;right:8px;background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--muted);cursor:pointer;">
                  🎯
                </button>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function verMovimientosCuenta(cuentaId) {
  _movFiltroCuenta = cuentaId;
  cambiarTab('movimientos');
}

function setCuentaDefaultDesdeSaldos(cuentaId) {
  const actual = localStorage.getItem(LS_CTA_DEFAULT);
  const cta = _cuentas.find(c => c.id === cuentaId);
  if (actual == cuentaId) {
    localStorage.removeItem(LS_CTA_DEFAULT);
    if (_movFiltroCuenta == cuentaId) _movFiltroCuenta = null;
    toast('Ya no hay caja predeterminada');
  } else {
    localStorage.setItem(LS_CTA_DEFAULT, String(cuentaId));
    _movFiltroCuenta = String(cuentaId);
    toast(`⭐ ${cta ? cta.nombre : 'Caja'} quedó como predeterminada en este dispositivo`);
  }
  renderDashboard();  // (10-ago) fix: renderSaldos no existía
}

async function abrirActualizarSaldo(cuentaId) {
  const cuenta = _cuentas.find(c => c.id === cuentaId);
  if (!cuenta) return;
  // Traer ancla actual
  const { data: c } = await sb.from('tesoreria_cuentas')
    .select('saldo_ancla, saldo_ancla_fecha').eq('id', cuentaId).single();
  const ancladaActual = c?.saldo_ancla;
  const fechaActual = c?.saldo_ancla_fecha || hoyISO();

  const html = `
    <div id="modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:white;border-radius:12px;padding:22px;max-width:480px;width:100%;">
        <h3 style="margin:0 0 8px;color:var(--primary-dark);">🎯 Actualizar saldo de ${escHtml(cuenta.nombre)}</h3>
        <p style="font-size:12px;color:var(--muted);margin:0 0 12px;">
          Pegá el saldo REAL que ves en el panel de la cuenta a una fecha concreta.
          El sistema lo usa como punto fijo y suma los movimientos posteriores para calcular el saldo actual.
        </p>
        ${ancladaActual != null ? `
          <div style="background:#f3f4f6;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;">
            <strong>Ancla actual:</strong> ${fmt$(ancladaActual, cuenta.moneda)} al ${fmtFecha(fechaActual)}
          </div>
        ` : `<div style="background:#fef3c7;padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:14px;">Sin ancla cargada todavía</div>`}
        <div class="form-row" style="margin-bottom:10px;">
          <label>Saldo real (${cuenta.moneda})</label>
          <input type="number" id="ancla-saldo" step="0.01" value="${ancladaActual ?? ''}" placeholder="Ej: 1234567.89">
        </div>
        <div class="form-row" style="margin-bottom:14px;">
          <label>Fecha del saldo</label>
          <input type="date" id="ancla-fecha" value="${fechaActual}">
        </div>
        <div class="form-actions">
          <button class="btn-secondary" onclick="document.getElementById('modal').remove()">Cancelar</button>
          ${ancladaActual != null ? `<button class="btn-secondary" style="color:#dc2626;" onclick="borrarAncla(${cuentaId})">🗑 Borrar ancla</button>` : ''}

        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function guardarAncla(cuentaId) {
  const saldo = parseFloat(document.getElementById('ancla-saldo').value);
  const fecha = document.getElementById('ancla-fecha').value;
  if (isNaN(saldo) || !fecha) { toast('Saldo y fecha son obligatorios', true); return; }
  const { error } = await sb.from('tesoreria_cuentas').update({
    saldo_ancla: saldo,
    saldo_ancla_fecha: fecha,
    saldo_ancla_actualizado_at: new Date().toISOString(),
    saldo_ancla_por: session.email || 'admin',
  }).eq('id', cuentaId);
  if (error) { toast('Error: ' + error.message, true); return; }
  toast('✓ Saldo ancla actualizado');
  document.getElementById('modal').remove();
  cargar();
}

async function borrarAncla(cuentaId) {
  if (!confirm('¿Borrar el ancla? El saldo va a calcularse solo desde los movimientos.')) return;
  const { error } = await sb.from('tesoreria_cuentas').update({
    saldo_ancla: null,
    saldo_ancla_fecha: null,
    saldo_ancla_actualizado_at: null,
    saldo_ancla_por: null,
  }).eq('id', cuentaId);
  if (error) { toast('Error: ' + error.message, true); return; }
  toast('✓ Ancla borrada');
  document.getElementById('modal').remove();
  cargar();
}

// Caja predeterminada: se guarda POR DISPOSITIVO (localStorage), así cada
// puesto abre en la caja que más usa (ej: Oficina → Galicia CA Pesos).
const LS_CTA_DEFAULT = 'tesoreria_cuenta_default';
let _movFiltroCuenta = localStorage.getItem(LS_CTA_DEFAULT) || null;
let _movFiltroDesde = null;
let _movFiltroHasta = null;

function toggleCuentaDefault() {
  const actual = localStorage.getItem(LS_CTA_DEFAULT);
  if (_movFiltroCuenta && actual != _movFiltroCuenta) {
    localStorage.setItem(LS_CTA_DEFAULT, _movFiltroCuenta);
    const cta = _cuentas.find(c => c.id == _movFiltroCuenta);
    toast(`⭐ ${cta ? cta.nombre : 'Esta caja'} quedó como predeterminada en este dispositivo`);
  } else {
    localStorage.removeItem(LS_CTA_DEFAULT);
    toast('Ya no hay caja predeterminada — la app abre en "Todas"');
  }
  renderMovimientos();
}

async function renderMovimientos() {
  const cont = document.getElementById('contenido');
  // Defaults: último mes
  if (!_movFiltroDesde) {
    const d = new Date(); d.setMonth(d.getMonth() - 1);
    _movFiltroDesde = d.toISOString().split('T')[0];
  }
  if (!_movFiltroHasta) _movFiltroHasta = hoyISO();

  // Si la cuenta guardada ya no existe o el usuario no la ve, ignorarla
  if (_movFiltroCuenta && !_cuentas.some(c => c.id == _movFiltroCuenta)) {
    _movFiltroCuenta = null;
    localStorage.removeItem(LS_CTA_DEFAULT);
  }
  const esDefault = _movFiltroCuenta && localStorage.getItem(LS_CTA_DEFAULT) == _movFiltroCuenta;
  const cuentasOpt = _cuentas.map(c => `<option value="${c.id}" ${_movFiltroCuenta==c.id?'selected':''}>${escHtml(c.nombre)}</option>`).join('');

  cont.innerHTML = `
    <div class="toolbar">
      <label style="font-size:12px;color:var(--muted);">Cuenta:</label>
      <select id="mov-cuenta" onchange="_movFiltroCuenta=this.value||null; renderMovimientos();">
        <option value="">Todas</option>${cuentasOpt}
      </select>
      <button onclick="toggleCuentaDefault()" title="${esDefault ? 'Quitar como predeterminada' : 'Abrir siempre en esta caja (en este dispositivo)'}"
              style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:15px;${_movFiltroCuenta ? '' : 'opacity:0.35;pointer-events:none;'}">
        ${esDefault ? '⭐' : '☆'}
      </button>
      <label style="font-size:12px;color:var(--muted);">Desde:</label>
      <input type="date" id="mov-desde" value="${_movFiltroDesde}" onchange="_movFiltroDesde=this.value; renderMovimientos();">
      <label style="font-size:12px;color:var(--muted);">Hasta:</label>
      <input type="date" id="mov-hasta" value="${_movFiltroHasta}" onchange="_movFiltroHasta=this.value; renderMovimientos();">
      <input type="search" id="mov-buscar" placeholder="🔎 Importe, proveedor, descripción…" value="${escHtml(_movBusca)}"
             oninput="_movBusca=this.value; filtrarMovsLocal();"
             style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-width:190px;">
      <button onclick="exportarMovsExcel()" title="Descargar lo filtrado en Excel"
              style="background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;">⬇ Excel</button>
      <div class="spacer"></div>
      <button class="primary" onclick="cambiarTab('cargar')">➕ Cargar movimiento</button>
    </div>
    <div id="mov-lista"><div class="empty"><div class="spinner"></div></div></div>
  `;

  try {
    // Si hay cuenta filtrada, traer también las tenencias de esa cuenta
    let tenencias = [];
    if (_movFiltroCuenta) {
      const { data: t } = await sb.from('tesoreria_tenencias')
        .select('*').eq('cuenta_id', _movFiltroCuenta)
        .order('valor_corriente', { ascending: false });
      tenencias = t || [];
    }

    let q = sb.from('tesoreria_movimientos_view')
      .select('*')
      .gte('fecha', _movFiltroDesde).lte('fecha', _movFiltroHasta)
      .order('fecha', { ascending: false })
      // orden_banco: posición dentro del día según el banco (Galicia reordena
      // los movs a posteriori, ej. echeqs — así el saldo fila x fila cierra).
      .order('orden_banco', { ascending: false, nullsFirst: false })
      .order('id', { ascending: false })
      .limit(500);
    if (_movFiltroCuenta) q = q.eq('cuenta_id', _movFiltroCuenta);
    const { data, error } = await q;
    if (error) throw error;
    _movsCache = data || [];
    _tenenciasCache = tenencias;
    filtrarMovsLocal();
  } catch (e) {
    document.getElementById('mov-lista').innerHTML = `<div class="empty"><div class="icon">⚠️</div>Error: ${escHtml(e.message)}</div>`;
  }
}

function renderTablaTenencias(tenencias) {
  if (!tenencias || tenencias.length === 0) return '';
  // Agrupar por tipo
  const grupos = {};
  tenencias.forEach(t => {
    const tipo = t.tipo || 'Otros';
    if (!grupos[tipo]) grupos[tipo] = [];
    grupos[tipo].push(t);
  });
  const fmtCur = (n, c) => fmt$(n, c || 'USD');
  // Precio puede tener decimales (FCI tipicamente 4). Formato propio.
  const fmtPrecio = (n, c) => {
    const prefix = c === 'USD' ? 'U$D ' : '$ ';
    return prefix + Number(n || 0).toLocaleString('es-AR', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 4,
    });
  };
  // Cantidad con hasta 4 decimales (sin agrupador raro)
  const fmtCantidad = (n) => Number(n || 0).toLocaleString('es-AR', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 4,
  });
  const ultimoUpdate = tenencias.reduce((max, t) =>
    !max || (t.actualizado_at > max) ? t.actualizado_at : max, null);

  let html = `
    <div class="card" style="margin-bottom:14px;padding:0;overflow:hidden;">
      <div style="background:var(--primary-dark);color:white;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;">
        <span>📈 Tenencias actuales</span>
        ${ultimoUpdate ? `<span style="font-size:11px;font-weight:400;opacity:0.85;">Actualizado ${fmtFecha(ultimoUpdate.split('T')[0])}</span>` : ''}
      </div>
      <div class="table-wrap">
        <table style="margin:0;">
          <thead><tr>
            <th>Especie</th>
            <th>Tipo</th>
            <th class="right">Cantidad</th>
            <th class="right">Precio</th>
            <th class="right">Valor corriente</th>
          </tr></thead>
          <tbody>
  `;
  for (const [tipo, items] of Object.entries(grupos)) {
    const subt = items.reduce((s, t) => s + Number(t.valor_corriente || 0), 0);
    const moneda = items[0]?.currency || 'USD';
    items.forEach(t => {
      html += `<tr>
        <td>
          <div style="font-weight:600;">${escHtml(t.ticker || '')}</div>
          <div style="font-size:11px;color:var(--muted);">${escHtml(t.descripcion || '')}</div>
        </td>
        <td><span class="chip" style="background:#e5e7eb;color:#374151;font-size:11px;">${escHtml(tipo)}</span></td>
        <td class="right">${fmtCantidad(t.cantidad)}</td>
        <td class="right">${fmtPrecio(t.precio, t.currency)}</td>
        <td class="right" style="font-weight:600;">${fmtCur(t.valor_corriente, t.currency)}</td>
      </tr>`;
    });
    html += `<tr style="background:#f9fafb;font-weight:600;">
      <td colspan="4" class="right" style="padding-right:14px;">Subtotal ${escHtml(tipo)} (${escHtml(moneda)}):</td>
      <td class="right">${fmtCur(subt, moneda)}</td>
    </tr>`;
  }
  html += `
          </tbody>
        </table>
      </div>
    </div>
  `;
  return html;
}

let _movsCache = [];
let _tenenciasCache = [];
let _movBusca = '';

// ── Buscador local (11-ago, pedido Marisa): filtra los movs ya cargados ──
function _movsFiltrados() {
  const t = (_movBusca || '').toLowerCase().trim();
  if (!t) return _movsCache;
  const tNum = t.replace(/\./g, '').replace(',', '.');
  return _movsCache.filter(m =>
    (m.descripcion || '').toLowerCase().includes(t) ||
    (m.nota || '').toLowerCase().includes(t) ||
    (m.categoria_nombre || '').toLowerCase().includes(t) ||
    (m.cuenta_nombre || '').toLowerCase().includes(t) ||
    String(Math.round(Math.abs(m.importe))).includes(tNum) ||
    JSON.stringify(m.extra || {}).toLowerCase().includes(t));
}
function filtrarMovsLocal() {
  renderListaMovimientos(_movsFiltrados(), _tenenciasCache || []);
}

// ── Export Excel de lo filtrado (SheetJS bajo demanda) ──
async function _loadXLSX() {
  if (window.XLSX) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar la librería Excel (¿sin internet?)'));
    document.head.appendChild(s);
  });
}
async function exportarMovsExcel() {
  try {
    await _loadXLSX();
    const movs = _movsFiltrados();
    if (!movs.length) return alert('No hay movimientos para exportar con estos filtros.');
    const filas = movs.map(m => ({
      Fecha: m.fecha,
      Cuenta: m.cuenta_nombre || '',
      Descripcion: m.descripcion || '',
      Categoria: m.categoria_nombre || '',
      Importe: Number(m.importe),
      'Saldo post': m.saldo_post != null ? Number(m.saldo_post) : null,
      Nota: m.nota || '',
      'CUIT/Razón social': [(m.extra || {}).cuit, (m.extra || {}).razon_social].filter(Boolean).join(' · '),
    }));
    const ws = XLSX.utils.json_to_sheet(filas);
    ws['!cols'] = [{wch:10},{wch:20},{wch:45},{wch:18},{wch:14},{wch:14},{wch:30},{wch:28}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Movimientos');
    const cta = _movFiltroCuenta ? (_cuentas.find(c => c.id == _movFiltroCuenta)?.nombre || 'cuenta').replace(/[^\w]+/g, '_') : 'todas';
    XLSX.writeFile(wb, `movimientos_${cta}_${_movFiltroDesde}_a_${_movFiltroHasta}.xlsx`);
  } catch (e) { alert('Error al exportar: ' + e.message); }
}

async function guardarEditMov(id) {
  try {
    const patch = {
      fecha: document.getElementById('em-fecha').value,
      importe: parseFloat(document.getElementById('em-importe').value),
      categoria_id: parseInt(document.getElementById('em-categoria').value) || null,
      descripcion: document.getElementById('em-desc').value.trim() || null,
    };
    if (!patch.fecha || isNaN(patch.importe) || patch.importe === 0) throw new Error('Fecha e importe válidos son obligatorios');
    const { error } = await sb.from('tesoreria_movimientos').update(patch).eq('id', id);
    if (error) throw error;
    document.getElementById('editmov-bg')?.remove();
    toast('✓ Movimiento actualizado');
    renderMovimientos();
  } catch (e) { toast('Error: ' + e.message, true); }
}

async function borrarMov(id) {
  const m = _movsCache.find(x => x.id === id);
  if (!m) return;
  const desc = (m.descripcion || '').slice(0, 60);
  if (!confirm(`¿BORRAR este movimiento?\n\n#${m.id} · ${m.fecha} · ${fmt$(m.importe, m.cuenta_moneda)}\n${desc}\n\nEsta acción no se puede deshacer y altera el saldo de la caja.${!session.verTodo ? '\n(Si ya imprimiste el recibo, rompelo — este comprobante deja de existir.)' : ''}`)) return;
  try {
    // Si era transferencia, avisar que queda la pata contraria
    if (m.transferencia_id && !confirm('Este movimiento es parte de una TRANSFERENCIA: la otra pata NO se borra sola.\n¿Borrar igual?')) return;
    // Si tiene factura en el bucket, borrarla también
    if (m.factura_path) {
      const pref = SUPA_URL + '/storage/v1/object/public/tesoreria-facturas/';
      if (m.factura_path.startsWith(pref)) {
        await sb.storage.from('tesoreria-facturas').remove([m.factura_path.slice(pref.length)]);
      }
    }
    const { error } = await sb.from('tesoreria_movimientos').delete().eq('id', id);
    if (error) throw error;
    toast('🗑 Movimiento borrado');
    renderMovimientos();
  } catch (e) { toast('Error: ' + e.message, true); }
}

async function reportarProblemaMov(id) {
  const m = _movsCache.find(x => x.id === id);
  if (!m) return;
  const motivo = prompt(
    `Este comprobante ya está guardado en el archivero, así que no se puede modificar desde acá.\n\n` +
    `Contá cuál es el problema y le llega la alerta al administrador para que lo corrija:\n\n` +
    `#${m.id} · ${fmtFecha(m.fecha)} · ${fmt$(m.importe, m.cuenta_moneda)}\n${(m.descripcion || '').slice(0, 60)}`
  );
  if (motivo === null) return;
  if (!motivo.trim()) { toast('Contá cuál es el problema', true); return; }
  try {
    const { error } = await sb.rpc('tesoreria_reportar_problema', { p_mov_id: id, p_motivo: motivo.trim() });
    if (error) throw error;
    toast('⚠ Reportado — le llegó la alerta al administrador');
    renderMovimientos();
  } catch (e) { toast('Error: ' + e.message, true); }
}

function renderListaMovimientos(movs, tenencias = []) {
  const cont = document.getElementById('mov-lista');
  const tablaTenencias = renderTablaTenencias(tenencias);

  // Banner de "Pendiente de liquidar" — sólo cuando se filtra por UNA cuenta
  // y esa cuenta tiene saldo_banco_pendiente > 0 (típico de MP Locales).
  let bannerPendiente = '';
  if (_movFiltroCuenta) {
    const c = _cuentas.find(x => x.id === Number(_movFiltroCuenta));
    const pend = Number(c?.saldo_banco_pendiente || 0);
    if (pend > 0) {
      bannerPendiente = `
        <div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:4px solid #f59e0b;border-radius:8px;padding:12px 16px;margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
          <span style="font-size:24px;">📅</span>
          <div style="flex:1;min-width:200px;">
            <div style="font-size:12px;color:#92400e;text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">Pendiente de liquidar</div>
            <div style="font-size:20px;font-weight:700;color:#78350f;">${fmt$(pend, c.moneda)}</div>
            <div style="font-size:11px;color:#92400e;margin-top:2px;">Saldo aún no acreditado, en proceso de release</div>
          </div>
        </div>
      `;
    }
  }

  if (movs.length === 0) {
    cont.innerHTML = tablaTenencias + bannerPendiente + `<div class="empty"><div class="icon">📭</div>Sin movimientos en el rango.</div>`;
    return;
  }
  const totIng = movs.filter(m => +m.importe > 0).reduce((s, m) => s + +m.importe, 0);
  const totEgr = movs.filter(m => +m.importe < 0).reduce((s, m) => s + +m.importe, 0);

  cont.innerHTML = tablaTenencias + bannerPendiente + `
    <div class="card" style="margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;">
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Movimientos:</span> <strong>${movs.length}</strong></div>
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Ingresos:</span> <strong class="importe-ingreso">${fmt$(totIng)}</strong></div>
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Egresos:</span> <strong class="importe-egreso">${fmt$(totEgr)}</strong></div>
      <div><span style="font-size:11px;color:var(--muted);text-transform:uppercase;">Neto:</span> <strong>${fmt$(totIng+totEgr)}</strong></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:30px;"></th>
          <th>Fecha</th><th>Cuenta</th><th>Local</th><th>Canal</th><th>Descripción</th>
          <th class="right">Débitos</th><th class="right">Créditos</th><th class="right">Saldo</th><th></th>
        </tr></thead>
        <tbody>
          ${movs.map(m => {
            const origenChip = {
              manual: 'origen-manual',
              ventas_auto: 'origen-ventas',
              scraper_galicia: 'origen-scraper', scraper_mp: 'origen-scraper', scraper_ppi: 'origen-scraper',
              transferencia: 'origen-transferencia',
              liquidacion: 'origen-ventas'
            }[m.origen] || 'origen-manual';
            const origenLabel = {
              manual: 'manual', ventas_auto: 'ventas', scraper_galicia: 'Galicia', scraper_mp: 'MP', scraper_ppi: 'PPI',
              transferencia: 'transferencia', liquidacion: 'liquidación'
            }[m.origen] || m.origen;
            let firma = '';
            if (m.factura_path) {
              firma = `<a href="${escHtml(m.factura_path)}" target="_blank" rel="noopener" class="chip" style="background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:600;text-decoration:none;" title="${m.factura_enviada_at ? 'Factura enviada a administración el ' + new Date(m.factura_enviada_at).toLocaleDateString('es-AR') : 'Factura adjunta — pendiente de envío a administración'}">📎 Factura${m.factura_enviada_at ? ' ✓' : ''}</a>`;
            } else if (m.respaldo_tipo === 'factura') {
              // Purgada del bucket a los 30 días del envío — el respaldo quedó
              // en el mail a administración y el archivero de Anita.
              firma = `<span class="chip" style="background:#f3f4f6;color:var(--muted);font-size:11px;font-weight:600;" title="La imagen se borró del sistema a los 30 días (enviada a administración el ${m.factura_enviada_at ? new Date(m.factura_enviada_at).toLocaleDateString('es-AR') : '—'}). El respaldo está en el archivero.">📎 Archivada</span>`;
            }
            if (m.requiere_firma) {
              if (m.firmado_at) {
                const urlFirmado = pathToSharepointUrl(m.pdf_path);
                firma = urlFirmado
                  ? `<a href="${escHtml(urlFirmado)}" target="_blank" rel="noopener" class="chip" style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;" title="Firmado el ${new Date(m.firmado_at).toLocaleDateString('es-AR')} — click para abrir el PDF guardado">✓ Firmado 🔗</a>`
                  : `<span class="chip" style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:600;" title="Firmado el ${new Date(m.firmado_at).toLocaleDateString('es-AR')}">✓ Firmado</span>`;
              } else {
                // (4-ago) El 📄 vive solo en la columna de acciones (estaba duplicado acá)
                firma = `<span class="chip" style="background:#fef3c7;color:#92400e;font-size:11px;font-weight:600;" title="Pendiente de firma — descargá el PDF con el botón 📄 de la derecha">⏳ Sin firmar</span>`;
              }
            }
            const imp = +m.importe;
            const debito  = imp < 0 ? `<span class="importe-egreso">- ${fmt$(Math.abs(imp), m.cuenta_moneda)}</span>` : '';
            const credito = imp > 0 ? `<span class="importe-ingreso">+ ${fmt$(imp, m.cuenta_moneda)}</span>` : '';
            const saldo = (m.saldo_post !== null && m.saldo_post !== undefined)
              ? fmt$(m.saldo_post, m.cuenta_moneda) : '—';
            // Chips de local y canal con colores claros para Point/QR
            const canalChip = m.canal
              ? `<span class="chip" style="background:${m.canal==='qr'?'#dbeafe':m.canal==='point'?'#fef3c7':'#e5e7eb'};color:#374151;font-size:11px;">${escHtml(m.canal.toUpperCase())}</span>`
              : '';
            const localLabel = m.mov_local
              ? `<span style="font-weight:600;text-transform:capitalize;">${escHtml(m.mov_local)}</span>`
              : '<span style="color:var(--muted);">—</span>';
            // Info adicional del banco (razón social, CUIT, CBU) capturada
            // por el scraper al expandir los detalles. Renderizamos como
            // subtítulo gris debajo de la descripción si existe.
            const ex = m.extra || {};
            const extraItems = [];
            if (ex.razon_social) extraItems.push(escHtml(ex.razon_social));
            if (ex.cuit) extraItems.push(`<span style="font-family:monospace;">CUIT ${escHtml(ex.cuit)}</span>`);
            if (ex.cbu)  extraItems.push(`<span style="font-family:monospace;">CBU ${escHtml(ex.cbu)}</span>`);
            const subDesc = extraItems.length
              ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;">${extraItems.join(' · ')}</div>`
              : '';
            const tieneExtra = extraItems.length > 0;
            // Nota: si hay nota, fila tintada amarillo claro + icono de chincheta lleno
            const tieneNota = !!(m.nota && m.nota.trim());
            const trStyle = tieneNota ? 'background:#fef9c3;' : '';
            const notaIcon = tieneNota
              ? `<button class="btn-icon" onclick="abrirNotaMov(${m.id})" title="${escHtml(m.nota)}" style="background:none;border:none;cursor:pointer;font-size:16px;padding:2px;">📌</button>`
              : `<button class="btn-icon" onclick="abrirNotaMov(${m.id})" title="Agregar nota" style="background:none;border:none;cursor:pointer;font-size:14px;padding:2px;opacity:0.35;">📝</button>`;
            return `<tr style="${trStyle}">
              <td style="text-align:center;">${notaIcon}</td>
              <td>${fmtFecha(m.fecha)}</td>
              <td><span style="font-weight:600;">${escHtml(m.cuenta_nombre||'?')}</span></td>
              <td>${localLabel}</td>
              <td>${canalChip || '<span style="color:var(--muted);">—</span>'}</td>
              <td style="max-width:320px;${tieneExtra ? '' : 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'}" title="${escHtml(m.descripcion||'')}${m.categoria_nombre ? ' · '+escHtml(m.categoria_nombre) : ''}">
                <div style="${tieneExtra ? 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' : ''}">${escHtml(m.descripcion||'')} <span class="chip chip-${origenChip}">${origenLabel}</span> ${firma}</div>
                ${subDesc}
                ${tieneNota ? `<div style="font-size:11px;color:#854d0e;margin-top:3px;font-style:italic;">📌 ${escHtml(m.nota)}</div>` : ''}
              </td>
              <td class="right">${debito}</td>
              <td class="right">${credito}</td>
              <td class="right" style="color:var(--muted);">${saldo}</td>
              ${(() => {
                // Admin: siempre puede editar/borrar.
                // (3-ago) Recibo pendiente de firma: 📄 re-descarga el PDF
                const btnPdf = (m.origen === 'manual' && m.requiere_firma && !m.firmado_at)
                  ? `<button class="btn-icon" onclick="generarPDFEgreso(${m.id})" title="Volver a descargar el PDF del recibo (aún sin firmar)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.7;">📄</button>`
                  : '';
                if (session.verTodo) return `<td style="white-space:nowrap;text-align:center;">${btnPdf}
                  <button class="btn-icon" onclick="abrirEditarMov(${m.id})" title="Editar movimiento (admin)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">✏️</button>
                  <button class="btn-icon" onclick="borrarMov(${m.id})" title="Borrar movimiento (admin)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">🗑</button>
                </td>`;
                // Encargada/cajera: sus movimientos manuales SIN firmar se
                // pueden corregir o borrar; los ya guardados solo se reportan.
                if (m.origen === 'manual' && !m.firmado_at) return `<td style="white-space:nowrap;text-align:center;">${btnPdf}
                  <button class="btn-icon" onclick="abrirEditarMov(${m.id})" title="Corregir este movimiento (todavía no está guardado en el archivero)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">✏️</button>
                  <button class="btn-icon" onclick="borrarMov(${m.id})" title="Borrar este movimiento (todavía no está guardado en el archivero)" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.6;">🗑</button>
                </td>`;
                if (m.origen === 'manual' && m.firmado_at) return `<td style="white-space:nowrap;text-align:center;">
                  <button class="btn-icon" onclick="reportarProblemaMov(${m.id})" title="Este comprobante ya está guardado en el archivero: reportale el problema al administrador" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px 3px;opacity:0.7;">⚠️</button>
                </td>`;
                return '<td></td>';
              })()}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderCargar() {
  const cont = document.getElementById('contenido');
  // "Gerente restringido" = gerente de un local físico (no oficina ni admin)
  // "Gerente restringido" = cualquiera de local (encargada o cajera), no Oficina
  const esGerente = !session.esOficina;
  // Para gerente: pre-seleccionar la caja DE SU LOCAL (no la primera del array).
  // Bug histórico: sin el filtro c.local === session.localGerencia, agarraba
  // "Caja Alcorta" para TODOS los gerentes por orden alfabético, y la policy
  // tm_gerente_egreso rechazaba el INSERT porque el local no coincidía.
  const cajaGerente = esGerente
    ? (_cuentas.find(c => c.tipo === 'caja' && c.local === session.localGerencia)
       || _cuentas.find(c => c.tipo === 'caja'))  // cajera: su única caja visible
    // (11-ago, pedido Marisa) Oficina: preseleccionar Caja Oficina — antes
    // quedaba la primera del array (Caja Alcorta) y cargaban ahí por error.
    : (_cuentas.find(c => c.tipo === 'caja' && c.local === 'oficina') || null);
  const cuentasOpt = _cuentas.map(c => {
    const sel = cajaGerente && c.id === cajaGerente.id ? 'selected' : '';
    return `<option value="${c.id}" ${sel}>${escHtml(c.nombre)} (${c.moneda})</option>`;
  }).join('');

  cont.innerHTML = `
    <div class="card" style="max-width:680px;margin:0 auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 class="card-title" style="margin:0;">➕ Cargar movimiento</h3>
        ${session.verTodo ? `<button class="btn-secondary" style="font-size:12px;padding:6px 10px;" onclick="abrirImportarPaste()">📋 Pegar tabla del banco</button>` : ''}
      </div>
      <div class="form-row" style="margin-bottom:14px;">
        <label>Tipo</label>
        <div style="display:flex;gap:8px;">
          <button onclick="setTipoCarga('ingreso')" id="ti-ingreso" class="btn-secondary" style="flex:1;">⬆ Ingreso</button>
          <button onclick="setTipoCarga('egreso')" id="ti-egreso" class="btn-secondary" style="flex:1;">⬇ Egreso</button>
          ${esGerente ? '' : '<button onclick="setTipoCarga(\'transferencia\')" id="ti-trans" class="btn-secondary" style="flex:1;">🔄 Transferencia</button>'}
        </div>
      </div>
      <div id="form-fields">
        <div class="form-grid">
          <div class="form-row"><label>Fecha</label><input type="date" id="f-fecha" value="${hoyISO()}"></div>
          <div class="form-row"><label>Importe</label><input type="number" id="f-importe" step="any" placeholder="0"></div>
          <div class="form-row"><label>${esGerente ? 'Caja' : 'Cuenta (de donde sale/entra)'}</label>
            <select id="f-cuenta" ${esGerente ? 'disabled style="background:#f9fafb;"' : ''}>${esGerente ? '' : '<option value="">— Elegir —</option>'}${cuentasOpt}</select>
          </div>
          <div class="form-row"><label>Categoría</label>
            <select id="f-categoria"><option value="">— Elegir —</option></select>
          </div>
          <div class="form-row" id="row-cuenta-destino" style="display:none;"><label>Cuenta destino</label>
            <select id="f-cuenta-destino"><option value="">— Elegir —</option>${cuentasOpt}</select>
          </div>
          <div class="form-row full"><label>Descripción</label>
            <textarea id="f-descripcion" placeholder="Detalle del movimiento (proveedor, comprobante, etc.)"></textarea>
          </div>
          <div class="form-row full" id="row-respaldo" style="display:none;">
            <label>Respaldo del egreso</label>
            <div style="display:flex;gap:8px;">
              <button type="button" id="resp-recibo" class="btn-secondary" style="flex:1;" onclick="setRespaldo('recibo')">🧾 Recibo firmado</button>
              <button type="button" id="resp-factura" class="btn-secondary" style="flex:1;" onclick="setRespaldo('factura')">🧺 Factura / ticket</button>
            </div>
          </div>
          <div class="form-row full" id="row-factura" style="display:none;">
            <label>Foto o PDF de la factura</label>
            <input type="file" id="f-factura" accept="image/*,application/pdf" capture="environment"
                   style="width:100%;padding:10px;border:2px dashed var(--border);border-radius:8px;background:#f9fafb;">
            <div style="font-size:11px;color:var(--muted);margin-top:4px;">
              📬 La factura se envía automáticamente a administración para su contabilización.
            </div>
          </div>
          ${esGerente ? `
            <div class="form-row full" style="background:#fef3c7;padding:10px 12px;border-radius:6px;font-size:12px;color:#92400e;">
              📝 Los egresos que cargues quedan pendientes hasta que firmes el PDF y lo envíes por mail.
            </div>
          ` : ''}
        </div>
        <div class="form-actions">
          <button class="btn-secondary" onclick="cambiarTab('dashboard')">Cancelar</button>
          <button class="btn-primary" style="width:auto;padding:9px 24px;" id="btn-guardar" onclick="guardarMovimiento()">💾 Guardar</button>
        </div>
      </div>
    </div>
  `;
  // Por default, tipo = egreso (es lo más común que carga la encargada)
  setTipoCarga(esGerente ? 'egreso' : 'ingreso');
}

let _tipoCarga = 'ingreso';
let _respaldoCarga = 'recibo';

function setRespaldo(r) {
  _respaldoCarga = r;
  document.getElementById('resp-recibo')?.classList.toggle('activo', r === 'recibo');
  document.getElementById('resp-factura')?.classList.toggle('activo', r === 'factura');
  const rb = document.getElementById('resp-recibo'), fb = document.getElementById('resp-factura');
  if (rb) rb.style.cssText = 'flex:1;' + (r === 'recibo' ? 'background:var(--primary);color:white;border-color:var(--primary);' : '');
  if (fb) fb.style.cssText = 'flex:1;' + (r === 'factura' ? 'background:var(--primary);color:white;border-color:var(--primary);' : '');
  const rf = document.getElementById('row-factura');
  if (rf) rf.style.display = r === 'factura' ? '' : 'none';
}
function setTipoCarga(tipo) {
  _tipoCarga = tipo;
  document.querySelectorAll('#ti-ingreso, #ti-egreso, #ti-trans').forEach(b => {
    b.style.background = ''; b.style.color = ''; b.style.borderColor = '';
  });
  if (tipo === 'ingreso') {
    document.getElementById('ti-ingreso').style.background = 'var(--green-bg)';
    document.getElementById('ti-ingreso').style.color = '#065f46';
    document.getElementById('ti-ingreso').style.borderColor = '#a7f3d0';
  } else if (tipo === 'egreso') {
    document.getElementById('ti-egreso').style.background = 'var(--red-bg)';
    document.getElementById('ti-egreso').style.color = '#991b1b';
    document.getElementById('ti-egreso').style.borderColor = '#fca5a5';
  } else {
    document.getElementById('ti-trans').style.background = '#fef3c7';
    document.getElementById('ti-trans').style.color = '#92400e';
    document.getElementById('ti-trans').style.borderColor = '#fcd34d';
  }
  // Mostrar/ocultar cuenta destino
  document.getElementById('row-cuenta-destino').style.display = tipo === 'transferencia' ? '' : 'none';
  // Respaldo: solo aplica a egresos de gerentes/cajeras de local
  // (oficina y admin cargan sin recibo — pero pueden adjuntar factura igual)
  const rowResp = document.getElementById('row-respaldo');
  if (rowResp) {
    rowResp.style.display = tipo === 'egreso' ? '' : 'none';
    if (tipo === 'egreso') setRespaldo('recibo');   // default recibo para todos; factura se elige a mano
    else { _respaldoCarga = 'recibo'; const rf = document.getElementById('row-factura'); if (rf) rf.style.display = 'none'; }
  }
  // Llenar categorías según tipo
  const lista = _categorias.filter(c => c.tipo === tipo);
  const sel = document.getElementById('f-categoria');
  sel.innerHTML = '<option value="">— Elegir —</option>' + lista.map(c =>
    `<option value="${c.id}">${c.icono||''} ${escHtml(c.nombre)}</option>`).join('');
}

// IMPORTAR PEGADO DE TABLA (Galicia y similares)
// ═══════════════════════════════════════════════════════════════════════
function abrirImportarPaste() {
  // Cuentas bancarias seleccionables (no cajas)
  const cuentasOpt = _cuentas
    .filter(c => c.tipo !== 'caja')
    .map(c => `<option value="${c.id}">${escHtml(c.nombre)} (${c.moneda})</option>`)
    .join('');

  const html = `
    <div id="modal-paste" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;">
      <div style="background:white;border-radius:12px;padding:22px;max-width:920px;width:100%;max-height:90vh;overflow:auto;">
        <h3 style="margin:0 0 6px;color:var(--primary-dark);">📋 Importar movimientos desde el banco</h3>
        <p style="font-size:12px;color:var(--muted);margin:0 0 14px;">
          Andá a Galicia Office, expandí los detalles con la flecha ↑↓ del header, seleccioná la tabla con Ctrl+A o seleccioná solo lo que querés cargar, copiá (Ctrl+C) y pegá acá.
        </p>
        <div class="form-row" style="margin-bottom:10px;">
          <label>Cuenta destino</label>
          <select id="paste-cuenta">
            <option value="">— Elegir cuenta —</option>
            ${cuentasOpt}
          </select>
        </div>
        <div class="form-row" style="margin-bottom:10px;">
          <label>Pegá la tabla copiada (incluí los detalles si están expandidos)</label>
          <textarea id="paste-textarea" rows="10" style="font-family:'Courier New',monospace;font-size:12px;width:100%;" placeholder="Ej:&#10;16/06/2026  Transferencia De Cuer  + $1.000,00  $1.782.072,59&#10;CLAUDIA ADORNO S.R.L&#10;30709673110&#10;0000003100069880789195&#10;..."></textarea>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <button class="btn-secondary" onclick="document.getElementById('modal-paste').remove()">Cancelar</button>
          <button class="btn-primary" style="width:auto;padding:9px 18px;" onclick="analizarPaste()">🔍 Analizar</button>
        </div>
        <div id="paste-preview"></div>
      </div>
    </div>`;
